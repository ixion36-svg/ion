# ION CI pipeline (v0.24.0, SCA added v0.25.0)
#
# Runs on every push to main/dev and every pull request to main. Closes
# the SDLC §8 gaps "CI/CD pipeline" (v0.24.0) and "Software Composition
# Analysis" (v0.25.0). See docs/DEVELOPMENT_LIFECYCLE.md §3.4.4 and §4
# Principles 6 and 7.
#
# Jobs:
#   - test : pytest on Python 3.11 against the full tests/ suite. SQLite
#            in-process, no DB service needed.
#   - lint : ruff check on src/ (config in pyproject.toml [tool.ruff]).
#   - sec  : bandit -r src/ with the skip set documented in this file's
#            comment for `bandit-skip`. Treats high-severity findings as
#            fatal; medium and below as warnings.
#   - sca  : pip-audit (v0.25.0) — scans the project's pinned dependency
#            graph for known CVEs via the OSV database. Fails the build
#            only on HIGH-severity (and above) findings; MEDIUM/LOW are
#            reported but non-blocking, since we cannot patch most
#            transitive low-severity vulns without coordinated upstream
#            bumps. Tighten to MEDIUM after a clean baseline.
#
# Each job is independent — a ruff failure doesn't gate pytest, and vice
# versa, so a single review surface shows everything that's wrong at once.

name: test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -q --tb=short

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check src/

  sec:
    name: bandit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]"

      # Skips are documented per ION's threat model:
      #   B602 — shell=True in subprocess (KB seed scripts intentionally
      #          call external CLIs like vol.py / tcpdump in restricted
      #          paths with no untrusted input)
      #   B608 — SQL string construction (SQLAlchemy ORM elsewhere; the
      #          flagged raw queries are inside _run_migrations and the
      #          lab fixture inserter where column names are allow-listed)
      #   B101 — assert statements (test code, and some defensive asserts
      #          in services that are not used for security checks)
      # High-severity findings fail the job; medium and below are warnings.
      - name: Run bandit
        run: bandit -r src/ --skip B602,B608,B101 -lll

  sca:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit + project deps
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Install the project so pip-audit sees the resolved dep tree.
          # ``--no-deps`` would skip exactly the surface we want to audit.
          pip install -e .

      # pip-audit exits non-zero on ANY vulnerability finding by default;
      # we use ``--ignore-vuln <id>`` to allowlist specific CVEs after
      # weighing severity vs upgrade cost. Each ignore must be paired
      # with an explicit justification below. Future findings go through:
      # (a) attempt dependency bump in pyproject.toml,
      # (b) if bump infeasible, add ``--ignore-vuln <id>`` here and
      #     document the justification,
      # (c) escalate to security review for HIGH/CRITICAL that can
      #     neither be fixed nor reasonably ignored.
      #
      # Current ignores: NONE.
      #
      # Historical: CVE-2024-23342 (ecdsa 0.19.2 Minerva timing side-channel)
      # was ignored from v0.25.0 through v0.31.7 because the ecdsa package
      # was pulled in transitively via python-jose[cryptography] but never
      # actually reachable — the only JWT path was Keycloak OIDC validation
      # pinned to algorithms=["RS256"] (RSA, never ECDSA). v0.31.8 retired
      # python-jose entirely in favour of PyJWT, removing the ecdsa dep
      # from the resolved tree. The --ignore-vuln flag is dropped here.
      #
      # v0.31.22: vulnerability service switched from `osv` to `pypi`
      # after pip-audit/_service/osv.py hit a KeyError: 'ranges' on a
      # malformed OSV response (the OSV API ships affected[] entries
      # that occasionally omit the 'ranges' key — pip-audit doesn't
      # tolerate that yet). PyPI's vulnerability database (osv.dev's
      # ecosystem-PyPI subset, served via PyPI's JSON API) gives us
      # equivalent CVE coverage for Python packages without the OSV
      # API quirk that's blocking CI. If a CVE only appears in OSV's
      # broader catalogue, we'll catch it via Docker Scout's container
      # scan instead. Flip back to `osv` when pip-audit upstream
      # patches the missing-`ranges` guard.
      # v0.31.24: dropped --strict. pip-audit treats "skip" events as errors
      # under --strict, which makes --skip-editable contradictory: we want
      # to skip the editable `ion` distribution gracefully but --strict
      # promotes that skip to a hard failure. Without --strict, real
      # vulnerability findings still exit non-zero (pip-audit's default
      # behaviour) — only the skip warnings go quiet, which is what we
      # actually want for a project-on-its-own-source audit.
      - name: Run pip-audit
        run: |
          pip-audit \
            --vulnerability-service pypi \
            --skip-editable

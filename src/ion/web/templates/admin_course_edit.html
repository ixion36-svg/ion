{% extends "base.html" %}

{% block title %}Edit course · ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-slate-200 overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1600px] w-full px-4 sm:px-6 py-8 md:py-10">

  <a href="/admin/courses" class="btn btn-ghost btn-sm mb-3">← All courses</a>

  <div id="ce-root">
    <div class="flex justify-center items-center gap-2 py-14 text-center opacity-50">
      <span class="loading loading-spinner loading-sm text-primary"></span> Loading…
    </div>
  </div>
</div>
</div>

<style nonce="{{ csp_nonce }}">
/* auto-fit minmax has no daisyUI grid equivalent; do not approximate with breakpoints. */
.ce-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0.6rem}
/* Specific min-heights + mono body vs inherit on the lesson editor. */
.ce-textarea{min-height:6rem;resize:vertical;font-family:'JetBrains Mono','Fira Code',monospace;line-height:1.5}
.ce-textarea-md{min-height:14rem;font-family:inherit}
/* marked.parse emits h2/code/pre/mermaid with no classes we can attach. */
.ce-mdpreview{background:var(--bg-secondary);border:1px solid var(--border);border-radius:0.3rem;padding:0.75rem 1rem;min-height:6rem;font-size:0.85rem;line-height:1.55}
.ce-mdpreview h2,.ce-mdpreview h3,.ce-mdpreview h4{font-weight:700;margin-top:0.6rem;margin-bottom:0.35rem;color:var(--text-primary)}
.ce-mdpreview h2{font-size:1.15rem}.ce-mdpreview h3{font-size:1rem}
.ce-mdpreview code{background:var(--bg-deep);padding:0.1rem 0.4rem;border-radius:0.25rem;font-size:0.78rem;color:#a78bfa}
.ce-mdpreview pre{background:var(--bg-deep);padding:0.75rem;border-radius:0.3rem;overflow-x:auto;margin:0.5rem 0;font-size:0.75rem}
.ce-mdpreview pre code{background:none;padding:0}
.ce-mdpreview .mermaid{background:var(--bg-deep);padding:0.6rem;border-radius:0.3rem;border:1px solid var(--border);margin:0.5rem 0}
</style>

<script nonce="{{ csp_nonce }}">
const COURSE_ID = {{ course_id | tojson }};
let _course = null;
let _editing = {};  // { lesson_id: 'preview' | 'edit' }

function escHtml(s){if(s==null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function md(s){if(typeof marked==='undefined'||typeof DOMPurify==='undefined')return escHtml(s);return DOMPurify.sanitize(marked.parse(s||''));}

async function loadCourse(){
  try{
    // Course detail endpoint requires slug. We get the basic course summary
    // first, then load the full export to populate the editor.
    const list=await(await fetch('/api/courses?include_unpublished=true')).json();
    const meta=(list.courses||[]).find(c=>c.id===COURSE_ID);
    if(!meta)throw new Error('Course not found');
    _course=await(await fetch('/api/courses/'+encodeURIComponent(meta.slug)+'/export')).json();
    _course.id=COURSE_ID;
    render();
  }catch(e){
    document.getElementById('ce-root').innerHTML='<div role="alert" class="alert alert-error"><span>Failed to load course: '+escHtml(e.message)+'</span></div>';
  }
}

function render(){
  const c=_course;
  const lvlOpts=['L1','L2','L3','L4'].map(l=>`<option value="${l}"${l===c.level?' selected':''}>${l}</option>`).join('');
  const html=`
    <div class="flex flex-wrap items-baseline justify-between gap-3 mb-6">
      <h1 class="basis-full md:basis-auto md:flex-1 text-2xl font-semibold">${escHtml(c.title||'(untitled course)')}</h1>
      <div class="flex flex-wrap gap-2">
        <a href="/courses/${escHtml(c.slug)}" target="_blank" class="btn btn-ghost btn-sm">Preview as analyst →</a>
        <button class="btn btn-ghost btn-sm btn-error" data-click-action="deleteCourse">Delete course</button>
      </div>
    </div>

    <!-- Course metadata card -->
    <div class="card bg-base-200 shadow mb-4">
      <div class="card-body">
        <div class="ce-grid">
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Title</div><input class="input input-sm w-full" id="ce-title" value="${escHtml(c.title)}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Slug</div><input class="input input-sm w-full font-mono" id="ce-slug" value="${escHtml(c.slug)}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Level</div><select class="select select-sm w-full" id="ce-level">${lvlOpts}</select></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Estimated hours</div><input type="number" class="input input-sm w-full" id="ce-hours" value="${c.estimated_hours}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Pass threshold (%)</div><input type="number" class="input input-sm w-full" id="ce-pass" value="${c.pass_threshold}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Order in level</div><input type="number" class="input input-sm w-full" id="ce-order" value="${c.order_in_level}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Published</div>
            <label class="label cursor-pointer justify-start gap-2 mt-1.5">
              <input type="checkbox" class="checkbox checkbox-sm checkbox-primary" id="ce-pub" ${c.published?'checked':''}>
              <span class="label-text">Visible to analysts</span>
            </label>
          </div>
        </div>
        <div class="mt-3"><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Description (markdown)</div>
          <textarea class="textarea w-full ce-textarea" id="ce-desc">${escHtml(c.description_md||'')}</textarea>
        </div>
        <div class="card-actions justify-end mt-3"><button class="btn btn-primary btn-sm" data-click-action="saveCourse">Save course metadata</button></div>
      </div>
    </div>

    <!-- Modules -->
    <div class="card bg-base-200 shadow mb-4">
      <div class="card-body">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h2 class="card-title text-base">Modules (${(c.modules||[]).length})</h2>
          <button class="btn btn-primary btn-sm" data-click-action="addModule">+ Module</button>
        </div>
        ${(c.modules||[]).map((m,mi)=>renderModule(m,mi)).join('')}
        ${(c.modules||[]).length===0?'<div role="alert" class="alert alert-info mt-2"><span>No modules yet. Click + Module to add one.</span></div>':''}
      </div>
    </div>

    <!-- Image upload -->
    <div class="card bg-base-200 shadow mb-4">
      <div class="card-body">
        <h2 class="card-title text-base">Images</h2>
        <div role="alert" class="alert alert-info">
          <span>Upload PNG/JPG/SVG/WebP/GIF (5 MB max). After upload, paste the markdown snippet into any lesson body.</span>
        </div>
        <div class="flex flex-wrap items-center gap-2 mt-3">
          <input type="file" id="ce-img" class="file-input file-input-bordered file-input-sm" accept="image/*">
          <button class="btn btn-ghost btn-sm" data-click-action="uploadImage">Upload</button>
        </div>
        <div id="ce-img-out" class="mt-3 text-sm"></div>
      </div>
    </div>
  `;
  document.getElementById('ce-root').innerHTML=html;
  // Re-render mermaid in any preview blocks
  if(typeof mermaid!=='undefined'){try{mermaid.run({querySelector:'.mermaid'});}catch(e){}}
}

function renderModule(m,mi){
  const id=m.id||('new-'+mi);
  const lessons=(m.lessons||[]).map((l,li)=>renderLesson(l,m,mi,li)).join('');
  return `
    <div class="ce-mod card bg-base-300 shadow-sm mt-3" data-mid="${id}">
      <div class="card-body p-4">
      <div class="flex flex-wrap items-center gap-2 _ion-s-59b87fdbd1">
        <div class="_ion-s-65e3af54b5">
          <input class="input input-sm w-full" data-field="title" value="${escHtml(m.title)}" data-input-action="markModuleDirty" data-args='[${m.id||-1}, "$target"]'>
        </div>
        <input type="number" class="input input-sm _ion-s-7fce3abc18" data-field="estimated_minutes" value="${m.estimated_minutes}" data-input-action="markModuleDirty" data-args='[${m.id||-1}, "$target"]' title="Minutes">
        <button class="btn btn-primary btn-sm" data-click-action="saveModule" data-args='[${m.id||-1}, ${mi}]'>Save</button>
        <button class="btn btn-ghost btn-sm" data-click-action="addLesson" data-args='[${m.id||-1}, ${mi}]'>+ Lesson</button>
        ${m.id?`<button class="btn btn-ghost btn-sm btn-error" data-click-action="deleteModule" data-args='[${m.id}]'>Delete module</button>`:''}
      </div>
      <textarea class="textarea w-full ce-textarea" data-field="description_md" placeholder="Module description (markdown)" data-input-action="markModuleDirty" data-args='[${m.id||-1}, "$target"]'>${escHtml(m.description_md||'')}</textarea>
      ${lessons||'<p class="text-sm opacity-50 mt-2">No lessons yet.</p>'}
      </div>
    </div>
  `;
}

function renderLesson(l,m,mi,li){
  const id=l.id||('newL-'+mi+'-'+li);
  const typeOpts=['reading','quiz','lab'].map(t=>`<option value="${t}"${t===l.lesson_type?' selected':''}>${t}</option>`).join('');
  const isExpanded=_editing[id]==='edit';
  const qcount=(l.questions||[]).length;
  const typeBadge=l.lesson_type==='quiz'?'badge-info':l.lesson_type==='lab'?'badge-warning':'badge-ghost';
  return `
    <div class="ce-lesson card bg-base-200 shadow-sm mt-2" data-lid="${id}">
      <div class="card-body p-3">
      <div class="flex flex-wrap items-center gap-2 cursor-pointer hover:bg-primary/10 rounded-md px-1" data-click-action="toggleLesson" data-args='["${id}"]'>
        <span class="badge badge-sm ${typeBadge}">${l.lesson_type}</span>
        <strong>${escHtml(l.title||'(untitled lesson)')}</strong>
        <span class="text-xs opacity-50 ml-auto">~${l.duration_min}m · ${qcount} q</span>
      </div>
      <div class="ce-lesson-body _ion-s-22df499f68" data-ion-style="display:${isExpanded?'block':'none'}">
        <div class="ce-grid _ion-s-bba5e32d4a">
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Title</div><input class="input input-sm w-full" data-field="title" value="${escHtml(l.title)}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Type</div><select class="select select-sm w-full" data-field="lesson_type">${typeOpts}</select></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Duration (min)</div><input type="number" class="input input-sm w-full" data-field="duration_min" value="${l.duration_min}"></div>
          <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Lab target URL</div><input class="input input-sm w-full" data-field="lab_target_url" value="${escHtml(l.lab_target_url||'')}" placeholder="/cases/1"></div>
        </div>
        <div class="text-xs font-semibold uppercase tracking-wide opacity-60">Content (markdown — supports \`\`\`mermaid blocks)</div>
        <textarea class="textarea w-full ce-textarea ce-textarea-md" data-field="content_md" placeholder="Lesson body in markdown…" data-input-action="updateMdPreview" data-args='["${id}", "$value"]'>${escHtml(l.content_md||'')}</textarea>
        <div class="text-xs font-semibold uppercase tracking-wide opacity-60 _ion-s-c9ef2a58eb">Live preview</div>
        <div class="ce-mdpreview" id="ce-md-${id}">${md(l.content_md||'')}</div>

        <div class="flex flex-wrap items-center justify-between gap-2 _ion-s-62a1d0e646">
          <h3 class="text-sm font-semibold">Questions (${qcount})</h3>
          <button class="btn btn-ghost btn-sm" data-click-action="addQuestion" data-args='[${l.id||-1}, ${mi}, ${li}]'>+ Question</button>
        </div>
        ${(l.questions||[]).map((q,qi)=>renderQuestion(q,l,mi,li,qi)).join('')}

        <div class="flex flex-wrap items-center gap-2 _ion-s-a26d92bbf4">
          <button class="btn btn-primary btn-sm" data-click-action="saveLesson" data-args='[${l.id||-1}, ${mi}, ${li}]'>Save lesson</button>
          ${l.id?`<button class="btn btn-ghost btn-sm btn-error _ion-s-690f054c4e" data-click-action="deleteLesson" data-args='[${l.id}]'>Delete lesson</button>`:''}
        </div>
      </div>
      </div>
    </div>
  `;
}

function renderQuestion(q,l,mi,li,qi){
  const id=q.id||('newQ-'+mi+'-'+li+'-'+qi);
  const kindOpts=['single','multi','truefalse','shortanswer'].map(k=>`<option value="${k}"${k===q.kind?' selected':''}>${k}</option>`).join('');
  const optsJson=q.options?JSON.stringify(q.options,null,2):'[\n  {"value":"a","label":"Option A"},\n  {"value":"b","label":"Option B"}\n]';
  const corrJson=JSON.stringify(q.correct_answer);
  return `
    <div class="ce-question card bg-base-300 shadow-sm mt-2 text-sm" data-qid="${id}">
      <div class="card-body p-3">
      <div class="flex flex-wrap items-center gap-2 _ion-s-e802b7a103">
        <select class="select select-sm" data-field="kind">${kindOpts}</select>
        <input type="number" class="input input-sm _ion-s-81c26f8ca5" data-field="points" value="${q.points}" title="Points">
        <span class="text-xs opacity-50 ml-auto">#${qi+1}</span>
      </div>
      <div class="text-xs font-semibold uppercase tracking-wide opacity-60">Stem (markdown)</div>
      <textarea class="textarea w-full ce-textarea" data-field="stem_md">${escHtml(q.stem_md||'')}</textarea>
      <div class="ce-grid _ion-s-c9ef2a58eb">
        <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Options (JSON array of {value, label})</div>
          <textarea class="textarea w-full ce-textarea _ion-s-4500b7ef55" data-field="options">${escHtml(optsJson)}</textarea></div>
        <div><div class="text-xs font-semibold uppercase tracking-wide opacity-60">Correct answer (JSON: string for single/truefalse, list for multi/shortanswer)</div>
          <textarea class="textarea w-full ce-textarea _ion-s-4500b7ef55" data-field="correct_answer">${escHtml(corrJson)}</textarea></div>
      </div>
      <div class="text-xs font-semibold uppercase tracking-wide opacity-60 _ion-s-09e8c5ac29">Explanation (markdown, shown after submit)</div>
      <textarea class="textarea w-full ce-textarea" data-field="explanation_md">${escHtml(q.explanation_md||'')}</textarea>
      <div class="flex flex-wrap items-center gap-2 _ion-s-09e8c5ac29">
        <button class="btn btn-primary btn-sm" data-click-action="saveQuestion" data-args='[${q.id||-1}, ${l.id||-1}, ${mi}, ${li}, ${qi}]'>Save question</button>
        ${q.id?`<button class="btn btn-ghost btn-sm btn-error _ion-s-690f054c4e" data-click-action="deleteQuestion" data-args='[${q.id}]'>Delete</button>`:''}
      </div>
      </div>
    </div>
  `;
}

function toggleLesson(id){
  _editing[id]=_editing[id]==='edit'?null:'edit';
  // Just toggle visibility without re-render to preserve unsaved typing
  const wrap=document.querySelector(`.ce-lesson[data-lid="${id}"] .ce-lesson-body`);
  if(wrap)wrap.style.display=_editing[id]==='edit'?'block':'none';
}
window.toggleLesson=toggleLesson;

function updateMdPreview(id,text){
  const el=document.getElementById('ce-md-'+id);
  if(!el)return;
  el.innerHTML=md(text);
  if(typeof mermaid!=='undefined'){try{mermaid.run({nodes:el.querySelectorAll('.mermaid')});}catch(e){}}
}
window.updateMdPreview=updateMdPreview;

function readField(scope,name){return scope.querySelector(`[data-field="${name}"]`)?.value;}

async function saveCourse(){
  const body={
    title:document.getElementById('ce-title').value.trim(),
    slug:document.getElementById('ce-slug').value.trim(),
    level:document.getElementById('ce-level').value,
    estimated_hours:parseInt(document.getElementById('ce-hours').value,10)||1,
    pass_threshold:parseInt(document.getElementById('ce-pass').value,10)||70,
    order_in_level:parseInt(document.getElementById('ce-order').value,10)||0,
    published:document.getElementById('ce-pub').checked,
    description_md:document.getElementById('ce-desc').value,
  };
  try{
    const r=await fetch('/api/courses/'+COURSE_ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!r.ok){showToast(d.detail||'Save failed','error');return;}
    showToast('Saved','success');
    // Reload to get the new slug if it changed
    loadCourse();
  }catch(e){showToast('Save failed: '+e.message,'error');}
}
window.saveCourse=saveCourse;

async function addModule(){
  try{
    const r=await fetch('/api/courses/'+COURSE_ID+'/modules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New module'})});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Add failed','error');return;}
    showToast('Module added','success');
    loadCourse();
  }catch(e){showToast('Add failed: '+e.message,'error');}
}
window.addModule=addModule;

async function saveModule(mid,mi){
  if(mid<0){showToast('Save the course first','error');return;}
  const scope=document.querySelector(`.ce-mod[data-mid="${mid}"]`);
  const body={
    title:readField(scope,'title'),
    description_md:readField(scope,'description_md'),
    estimated_minutes:parseInt(readField(scope,'estimated_minutes'),10)||30,
  };
  try{
    const r=await fetch('/api/modules/'+mid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Save failed','error');return;}
    showToast('Module saved','success');
    _course.modules[mi].title=body.title;_course.modules[mi].description_md=body.description_md;_course.modules[mi].estimated_minutes=body.estimated_minutes;
  }catch(e){showToast('Save failed: '+e.message,'error');}
}
window.saveModule=saveModule;

function markModuleDirty(){/* no-op visual cue could go here */}
window.markModuleDirty=markModuleDirty;

async function deleteModule(mid){
  if(!confirm('Delete this module and all its lessons + questions?'))return;
  try{await fetch('/api/modules/'+mid,{method:'DELETE'});showToast('Deleted','success');loadCourse();}
  catch(e){showToast('Delete failed: '+e.message,'error');}
}
window.deleteModule=deleteModule;

async function addLesson(mid,mi){
  if(mid<0){showToast('Save the module first','error');return;}
  try{
    const r=await fetch('/api/modules/'+mid+'/lessons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'New lesson',lesson_type:'reading',content_md:'## Heading\n\nLesson content goes here.'})});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Add failed','error');return;}
    showToast('Lesson added','success');
    loadCourse();
  }catch(e){showToast('Add failed: '+e.message,'error');}
}
window.addLesson=addLesson;

async function saveLesson(lid,mi,li){
  if(lid<0){showToast('Save the lesson first','error');return;}
  const scope=document.querySelector(`.ce-lesson[data-lid="${lid}"] .ce-lesson-body`);
  const body={
    title:readField(scope,'title'),
    lesson_type:readField(scope,'lesson_type'),
    duration_min:parseInt(readField(scope,'duration_min'),10)||10,
    lab_target_url:readField(scope,'lab_target_url')||null,
    content_md:readField(scope,'content_md'),
  };
  try{
    const r=await fetch('/api/lessons/'+lid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Save failed','error');return;}
    showToast('Lesson saved','success');
    Object.assign(_course.modules[mi].lessons[li],body);
  }catch(e){showToast('Save failed: '+e.message,'error');}
}
window.saveLesson=saveLesson;

async function deleteLesson(lid){
  if(!confirm('Delete this lesson and all its questions?'))return;
  try{await fetch('/api/lessons/'+lid,{method:'DELETE'});showToast('Deleted','success');loadCourse();}
  catch(e){showToast('Delete failed: '+e.message,'error');}
}
window.deleteLesson=deleteLesson;

async function addQuestion(lid,mi,li){
  if(lid<0){showToast('Save the lesson first','error');return;}
  try{
    const r=await fetch('/api/lessons/'+lid+'/questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'single',stem_md:'New question',options:[{value:'a',label:'Option A'},{value:'b',label:'Option B'}],correct_answer:'a',points:1})});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Add failed','error');return;}
    showToast('Question added','success');
    loadCourse();
  }catch(e){showToast('Add failed: '+e.message,'error');}
}
window.addQuestion=addQuestion;

async function saveQuestion(qid,lid,mi,li,qi){
  if(qid<0){showToast('Save the question first','error');return;}
  const scope=document.querySelector(`.ce-question[data-qid="${qid}"]`);
  let opts=null,corr=null;
  try{opts=JSON.parse(readField(scope,'options')||'null');}
  catch(e){showToast('Options is invalid JSON: '+e.message,'error');return;}
  try{corr=JSON.parse(readField(scope,'correct_answer')||'null');}
  catch(e){showToast('Correct answer is invalid JSON: '+e.message,'error');return;}
  const body={
    kind:readField(scope,'kind'),
    stem_md:readField(scope,'stem_md'),
    options:opts,
    correct_answer:corr,
    explanation_md:readField(scope,'explanation_md'),
    points:parseInt(readField(scope,'points'),10)||1,
  };
  try{
    const r=await fetch('/api/questions/'+qid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const d=await r.json();showToast(d.detail||'Save failed','error');return;}
    showToast('Question saved','success');
  }catch(e){showToast('Save failed: '+e.message,'error');}
}
window.saveQuestion=saveQuestion;

async function deleteQuestion(qid){
  if(!confirm('Delete this question?'))return;
  try{await fetch('/api/questions/'+qid,{method:'DELETE'});showToast('Deleted','success');loadCourse();}
  catch(e){showToast('Delete failed: '+e.message,'error');}
}
window.deleteQuestion=deleteQuestion;

async function deleteCourse(){
  if(!confirm('Delete this entire course? Cannot be undone.'))return;
  try{await fetch('/api/courses/'+COURSE_ID,{method:'DELETE'});showToast('Deleted','success');setTimeout(()=>{window.location.href='/admin/courses';},400);}
  catch(e){showToast('Delete failed: '+e.message,'error');}
}
window.deleteCourse=deleteCourse;

async function uploadImage(){
  const f=document.getElementById('ce-img').files[0];
  if(!f){showToast('Pick a file first','error');return;}
  const fd=new FormData();
  fd.append('file',f);
  try{
    const r=await fetch('/api/courses/'+_course.slug+'/images',{method:'POST',body:fd});
    const d=await r.json();
    if(!r.ok){showToast(d.detail||'Upload failed','error');return;}
    document.getElementById('ce-img-out').innerHTML=`<div role="alert" class="alert alert-success">
      <div>
        <div>Uploaded <a href="${d.url}" target="_blank" class="link link-primary">${d.url}</a> · ${d.bytes} bytes</div>
        <div class="mt-2"><strong>Markdown:</strong> <code class="bg-base-300 px-2 py-1 rounded text-xs">${escHtml(d.markdown)}</code></div>
      </div>
    </div>`;
    showToast('Uploaded','success');
  }catch(e){showToast('Upload failed: '+e.message,'error');}
}
window.uploadImage=uploadImage;

document.addEventListener('DOMContentLoaded',loadCourse);
</script>
{% endblock %}

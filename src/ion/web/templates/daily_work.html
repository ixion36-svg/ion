{% extends "base.html" %}
{% block title %}My Day · ION{% endblock %}
{% block page_id %}daily_work{% endblock %}
{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden"><div class="relative z-10 mx-auto max-w-[1920px] px-4 sm:px-6 lg:px-10 py-10">
<section class="mb-8"><span class="label-tiny text-primary">Daily operations</span><h1 class="text-4xl font-semibold" id="dw-title">My Day</h1></section>
<div class="flex flex-wrap gap-2 items-center mb-4">
  <button type="button" class="btn btn-sm" id="dw-prev" aria-label="Previous day">Previous</button>
  <input type="date" class="input input-sm w-auto" id="dw-date" name="date" />
  <button type="button" class="btn btn-sm" id="dw-next" aria-label="Next day">Next</button>
  <button type="button" class="btn btn-ghost btn-sm" id="dw-today">Today</button>
  <button type="button" class="btn btn-primary btn-sm" id="dw-refresh">Refresh</button>
  <button type="button" class="btn btn-ghost btn-sm" hx-get="/ui/daily-work/controls" hx-target="#dw-controls" hx-swap="innerHTML">Retry task types</button>
  <div class="join" id="dw-modetoggle"><button type="button" class="btn btn-sm join-item on" data-mode="calendar">Calendar</button><button type="button" class="btn btn-sm join-item" data-mode="timeline">Timeline</button></div>
</div>
<div id="dw-controls" hx-get="/ui/daily-work/controls" hx-trigger="load" hx-swap="innerHTML"><span class="loading loading-spinner loading-sm"></span> Loading task types...</div>
<section id="dw-view-me"><div id="dw-day-content" hx-get="/ui/daily-work" hx-trigger="load, dayRequested" hx-include="#dw-date" hx-swap="innerHTML"><span class="loading loading-spinner loading-sm"></span> Loading day...</div>
<a class="btn btn-ghost mt-4" href="/shift-handover">Open shift handover</a></section>
<section id="dw-view-team" class="dw-hidden"><div id="dw-team-content" hx-get="/ui/daily-work/team" hx-trigger="teamRequested" hx-include="#dw-date" hx-swap="innerHTML"></div></section>
  <div class="modal dw-hidden" id="dw-modal">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dw-modal-title">
      <h2 class="text-lg font-semibold" id="dw-modal-title">Edit entry</h2>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Time</legend>
        <input type="time" class="input w-full" id="dw-edit-time" />
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Type</legend>
        <select class="select w-full" id="dw-edit-type"></select>
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">Detail</legend>
        <textarea class="textarea w-full" id="dw-edit-text" rows="3" maxlength="2000"></textarea>
      </fieldset>
      <div class="modal-action">
        <button type="button" class="btn btn-error btn-outline btn-sm dw-hidden mr-auto" id="dw-edit-delete">Delete</button>
        <button type="button" class="btn btn-ghost" id="dw-edit-cancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="dw-edit-save">Save</button>
      </div>
    </div>
  </div>

</div></div>
{% endblock %}
{% block scripts %}
<script nonce="{{ csp_nonce }}">
(function () {
  "use strict";
  var currentMode = "calendar";
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function ymd2(dt) { return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1) + "-" + pad2(dt.getDate()); }
  function todayYMD() { return ymd2(new Date()); }
  function nowHM() { var d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); }
  function shiftDate(ymd, delta) { var p = ymd.split("-"); var dt = new Date(+p[0], +p[1] - 1, +p[2]); dt.setDate(dt.getDate() + delta); return ymd2(dt); }

  var selectedDate = todayYMD();   // the day being viewed (YYYY-MM-DD)

  function api(path, opts) {
    return fetch("/api/worklog" + path, opts || {}).then(function (r) {
      if (r.status === 403) { var e = new Error("forbidden"); e.code = 403; throw e; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }

  function loadDay() { htmx.trigger(document.getElementById("dw-day-content"), "dayRequested"); }
  function loadTeam() { htmx.trigger(document.getElementById("dw-team-content"), "teamRequested"); }
  function addEntry(taskType, fallbackText) {
    var inp = document.getElementById("dw-text");
    var text = inp.value.trim() || fallbackText;
    if (!text) return;
    // Place the entry on the viewed day at the composer time (or now, on
    // today; a neutral 09:00 otherwise) so it lands where the analyst expects.
    var t = document.getElementById("dw-time").value;
    if (!t) t = (selectedDate === todayYMD()) ? nowHM() : "09:00";
    api("/entry", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task_type: taskType, text: text, logged_at: selectedDate + "T" + t + ":00" }),
    }).then(function () { inp.value = ""; return loadDay(); })
      .catch(function (e) { if (window.showToast) showToast("Log failed: " + e.message, "error"); });
  }

  var editingId = null;   // entry id when editing; null when adding
  function openModal(opts) {
    editingId = opts.id || null;
    document.getElementById("dw-modal-title").textContent = editingId ? "Edit entry" : "Add entry";
    document.getElementById("dw-edit-time").value = opts.time || nowHM();
    document.getElementById("dw-edit-type").value = opts.type || (document.getElementById("dw-edit-type").options[0] || {}).value || "";
    document.getElementById("dw-edit-text").value = opts.text || "";
    document.getElementById("dw-edit-delete").classList.toggle("dw-hidden", !editingId);
    document.getElementById("dw-modal").classList.remove("dw-hidden");
    document.getElementById("dw-edit-text").focus();
  }
  function closeModal() { document.getElementById("dw-modal").classList.add("dw-hidden"); editingId = null; }

  function saveModal() {
    var time = document.getElementById("dw-edit-time").value || nowHM();
    var type = document.getElementById("dw-edit-type").value;
    var text = document.getElementById("dw-edit-text").value.trim();
    if (!type || !text) { if (window.showToast) showToast("Pick a type and add detail", "warning"); return; }
    var body = { task_type: type, text: text, logged_at: selectedDate + "T" + time + ":00" };
    var req = editingId
      ? api("/entry/" + editingId, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      : api("/entry", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    req.then(function () { closeModal(); return loadDay(); })
      .catch(function (e) { if (window.showToast) showToast("Save failed: " + e.message, "error"); });
  }
  function deleteModal() {
    if (!editingId) return;
    api("/entry/" + editingId, { method: "DELETE" })
      .then(function () { closeModal(); return loadDay(); })
      .catch(function (e) { if (window.showToast) showToast("Delete failed: " + e.message, "error"); });
  }

  function gotoDate(ymd) {
    selectedDate = ymd;
    document.getElementById("dw-date").value = ymd;
    loadDay();
    if (!document.getElementById("dw-view-team").classList.contains("dw-hidden")) loadTeam();
  }
  function setMode(m) {
    currentMode = m;
    ["calendar", "timeline"].forEach(function (mode) {
      var el = document.getElementById("dw-mode-" + mode);
      if (el) el.classList.toggle("dw-hidden", mode !== m);
    });
    document.querySelectorAll("#dw-modetoggle button").forEach(function (b) { b.classList.toggle("on", b.dataset.mode === m); });
  }
  function setView(v) {
    var me = v === "me";
    document.getElementById("dw-view-me").classList.toggle("dw-hidden", !me);
    document.getElementById("dw-view-team").classList.toggle("dw-hidden", me);
    document.querySelectorAll(".dw-my-controls").forEach(function (el) { el.classList.toggle("dw-hidden", !me); });
    document.getElementById("dw-title").textContent = me ? "My Day" : "Team Day";
    document.querySelectorAll("#dw-toggle button").forEach(function (b) { b.classList.toggle("on", b.dataset.view === v); });
    if (!me) loadTeam();
  }
  document.getElementById("dw-date").value = selectedDate;
  document.addEventListener("click", function (e) {
    var view = e.target.closest("[data-view]");
    if (view && view.closest("#dw-toggle")) setView(view.dataset.view);
    var mode = e.target.closest("[data-mode]");
    if (mode && mode.closest("#dw-modetoggle")) setMode(mode.dataset.mode);
    var preset = e.target.closest("[data-task-type]");
    if (preset) addEntry(preset.dataset.taskType, preset.dataset.taskLabel);
    var item = e.target.closest(".dw-cal-item.dw-editable");
    if (item) { openModal({ id: item.dataset.entryId, type: item.dataset.type, time: item.dataset.time, text: item.dataset.text }); return; }
    var slot = e.target.closest(".dw-hour-slot");
    if (slot) openModal({ time: pad2(Number(slot.dataset.hour)) + ":00" });
    if (e.target.closest("#dw-add")) addEntry(document.getElementById("dw-type").value, null);
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "dw-text" && e.key === "Enter") addEntry(document.getElementById("dw-type").value, null);
  });
  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target.id === "dw-day-content") {
      setMode(currentMode);
      var cal = document.getElementById("dw-calendar");
      var target = cal && (cal.querySelector(".dw-editable") || cal.querySelector('[data-hour="8"]'));
      if (target) cal.scrollTop = Math.max(0, target.offsetTop - cal.offsetTop - 40);
    }
    if (e.detail.target.id === "dw-controls") {
      var input = document.getElementById("dw-time");
      if (input) input.value = nowHM();
    }
  });
  document.getElementById("dw-prev").addEventListener("click", function () { gotoDate(shiftDate(selectedDate, -1)); });
  document.getElementById("dw-next").addEventListener("click", function () { gotoDate(shiftDate(selectedDate, 1)); });
  document.getElementById("dw-today").addEventListener("click", function () { gotoDate(todayYMD()); });
  document.getElementById("dw-refresh").addEventListener("click", function () { loadDay(); if (!document.getElementById("dw-view-team").classList.contains("dw-hidden")) loadTeam(); });
  document.getElementById("dw-date").addEventListener("change", function (e) { if (e.target.value) gotoDate(e.target.value); });
  document.getElementById("dw-edit-save").addEventListener("click", saveModal);
  document.getElementById("dw-edit-cancel").addEventListener("click", closeModal);
  document.getElementById("dw-edit-delete").addEventListener("click", deleteModal);
  document.getElementById("dw-modal").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
})();
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · ION</title>
<link rel="icon" type="image/png" href="/static/img/ion-favicon.png">
<link rel="stylesheet" href="/static/css/ion.css?v={{ ion_version }}">
<link rel="stylesheet" href="/static/css/ion-migrated-styles.css?v={{ ion_version }}">
<script nonce="{{ csp_nonce }}">
  // Load theme and mode immediately to prevent flash
  (function() {
    const theme = localStorage.getItem('ion-theme') || 'cyan';
    const mode = localStorage.getItem('ion-mode') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-mode', mode);
  })();
</script>
<style nonce="{{ csp_nonce }}">
  /* Standalone pre-auth page has no 56px nav; .ion-tw-page subtracts that. */
  .ion-tw-page { min-height: 100vh; }

  /* Hairline grid overlay. Cannot share background-image with .ion-tw-page radials. */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(to right, var(--ion-grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--ion-grid-line) 1px, transparent 1px);
    background-size: 56px 56px;
    pointer-events: none;
    opacity: 0.5;
    z-index: 0;
  }

  /* JS toggles .show on #error-message. daisyUI .alert is visible by default. */
  #error-message { display: none; }
  #error-message.show { display: flex; }
</style>
</head>

<body class="ion-tw ion-tw-page grain overflow-hidden">

  <div class="relative z-10 flex min-h-screen w-full items-center justify-center p-6">
  <div class="card hero-border bg-base-200 relative z-10 w-full max-w-[420px] rounded-[14px] backdrop-blur-md shadow-lg rise d-1">
    <div class="card-body p-10">

    <!-- Eyebrow -->
    <div class="flex items-center justify-center gap-3 mb-5">
      <span class="h-1.5 w-1.5 rounded-full bg-primary pulse-cyan"></span>
      <span class="label-tiny text-primary">ION · SOC Operations</span>
    </div>

    <!-- Brand / logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="h-16 w-16 rounded-[14px] bg-gradient-to-br from-ion-cyan to-ion-iris grid place-items-center mb-5 shadow-[0_0_32px_-8px_rgba(109,228,255,0.9)]">
        <span class="font-mono text-[28px] font-bold text-ink-950">I</span>
      </div>
      <h1 class="font-sans font-semibold text-[30px] leading-[1.05] text-base-content tracking-[-0.02em] text-center">Sign in</h1>
      <p class="mt-2 text-[13px] text-base-content/50 text-center">Welcome back — continue your shift.</p>
    </div>

    <!-- Form -->
    <form id="login-form" class="flex flex-col gap-5 rise d-2">
      <div id="error-message" role="alert" class="alert alert-error">
        <svg class="w-4 h-4 shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span></span>
      </div>

      <fieldset class="fieldset p-0">
        <legend class="fieldset-legend label-tiny">Username or email</legend>
        <input class="input w-full" type="text" id="username" name="username" required autocomplete="username" autofocus placeholder="analyst1">
      </fieldset>

      <fieldset class="fieldset p-0">
        <legend class="fieldset-legend label-tiny">Password</legend>
        <input class="input w-full" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </fieldset>

      <button type="submit" class="btn btn-primary w-full" id="login-btn">
        Sign In
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
    </form>

    <!-- OIDC section (hidden unless /api/auth/oidc/config reports enabled) -->
    <div id="oidc-login" class="rise d-3 hidden">
      <div class="divider"><span class="label-tiny">or</span></div>
      <button type="button" class="btn btn-ghost w-full" id="keycloak-btn" data-click-action="loginWithKeycloak">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Continue with Keycloak
      </button>
    </div>

    <p class="mt-8 text-center label-tiny text-base-content/40">Guarded Glass · Security Toolkit</p>
    </div>
  </div>
  </div>

<script nonce="{{ csp_nonce }}">
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-message');
  const errorText = errorBox.querySelector('span');
  const loginBtn = document.getElementById('login-btn');
  const origLabel = loginBtn.innerHTML;

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() { errorBox.classList.remove('show'); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.innerHTML = 'Signing in…';
    clearError();

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await response.json();

      if (response.ok) {
        if (data.user && data.user.must_change_password) {
          window.location.href = '/profile?change_password=1';
        } else {
          const urlParams = new URLSearchParams(window.location.search);
          const requested = urlParams.get('redirect') || '/';
          // Strict allowlist: single-leading-slash relative path with safe chars.
          // Blocks protocol-relative ("//evil.com"), absolute ("https://..."),
          // backslash-tricks ("/\\evil.com"), and javascript: URIs.
          const SAFE_RELATIVE = /^\/(?!\/)[A-Za-z0-9_\-./?#=&%~+]*$/;
          const redirect = SAFE_RELATIVE.test(requested) ? requested : '/';
          window.location.href = redirect;
        }
      } else {
        showError(data.detail || 'Login failed. Please try again.');
      }
    } catch (error) {
      showError('Unable to connect to server. Please try again.');
    } finally {
      loginBtn.disabled = false;
      loginBtn.innerHTML = origLabel;
    }
  });

  // OIDC / Keycloak
  let oidcConfig = null;
  async function checkOIDCConfig() {
    try {
      const response = await fetch('/api/auth/oidc/config');
      const config = await response.json();
      if (config.enabled) {
        oidcConfig = config;
        document.getElementById('oidc-login').style.display = 'block';
      }
    } catch (err) {
      console.error('Failed to check OIDC config:', err);
    }
  }
  function loginWithKeycloak() {
    if (!oidcConfig) {
      showError('Keycloak login is not available.');
      return;
    }
    const state = oidcConfig.state;
    const params = new URLSearchParams({
      client_id: oidcConfig.client_id,
      redirect_uri: oidcConfig.redirect_uri,
      response_type: 'code',
      scope: 'openid email profile',
      state: state,
    });
    window.location.href = oidcConfig.authorization_url + '?' + params.toString();
  }

  // Error from callback redirect
  function checkForError() {
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error) {
      showError(decodeURIComponent(error));
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }

  // The Keycloak button carries data-click-action="loginWithKeycloak", but
  // that only fires via the delegated dispatcher in event-delegation.js, which
  // is loaded through base.html — and this login page is standalone (no
  // base.html, see note at top). Wire the click directly here, the same way
  // the login form's submit is wired above. CSP (script-src-attr 'none')
  // forbids an inline onclick=, so a direct listener is the correct fix.
  document.getElementById('keycloak-btn').addEventListener('click', loginWithKeycloak);

  checkForError();
  checkOIDCConfig();
</script>
</body>
</html>

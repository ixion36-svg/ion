{% extends "base.html" %}

{% block title %}SOC Maturity Assessment - ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<section class="flex flex-wrap items-end justify-between gap-6 mb-8 rise d-1">
  <div class="basis-full md:basis-auto md:flex-1">
    <div class="flex items-center gap-3 mb-4">
      <svg class="w-4 h-4 text-ion-cyan"><use href="#i-layers"/></svg>
      <span class="label-tiny text-ion-cyan">SOC capability</span>
    </div>
    <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">Maturity Assessment</h1>
    <p class="mt-3 max-w-2xl text-[15px] text-base-content/60">SOC-CMM aligned capability scoring and roadmap.</p>
  </div>
  <div class="flex items-center gap-2 flex-wrap">
    <button class="btn btn-ghost" data-click-action="matShowHistory">History</button>
    <button class="btn btn-primary" data-click-action="matStartNew">New Assessment</button>
  </div>
</section>

<div id="mat-content" class="max-w-[1400px] mx-auto">
  <div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Loading...</div>
</div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
<style nonce="{{ csp_nonce }}">
/* JS toggles .selected on score buttons — daisyUI btn has no selected slot. */
.mat-q-score button.selected {
    background: var(--color-primary);
    color: var(--color-primary-content);
    border-color: var(--color-primary);
}

/* Conic-gradient score ring: daisyUI radial-progress needs a CSS custom
   property set as a raw attribute, which CSP refuses. Geometry and inner
   disc have no utility equivalent. */
.mat-result-ring {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform .3s ease;
}
.mat-result-ring:hover { transform: scale(1.03); }
.mat-result-inner {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--color-base-200);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid color-mix(in oklab, var(--color-base-content) 12%, transparent);
}

/* JS-computed bar width; 1s cubic-bezier fill is not a compiled utility. */
.mat-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s cubic-bezier(.4, 0, .2, 1);
}
</style>
<script nonce="{{ csp_nonce }}">
const MAT_API = '/api/maturity';
let matQuestionnaire = null;
let matResponses = {};

function matEsc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function scoreColor(s) {
    if (s >= 5) return 'var(--mitre-covered,#3fb950)';
    if (s >= 4) return 'var(--primary,#58a6ff)';
    if (s >= 3) return 'var(--sev-medium,#d29922)';
    if (s >= 2) return 'var(--sev-high,#f0883e)';
    return 'var(--sev-critical,#f85149)';
}

async function matStartNew() {
    const c = document.getElementById('mat-content');
    c.innerHTML = '<div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Loading questionnaire...</div>';
    try {
        const r = await fetch(MAT_API + '/questionnaire', {credentials: 'include'});
        matQuestionnaire = await r.json();
        matResponses = {};
        matRenderQuestionnaire();
    } catch (e) {
        c.innerHTML = `<div class="alert alert-error text-[var(--sev-critical)]">${matEsc(e.message)}</div>`;
    }
}

function matRenderQuestionnaire() {
    const q = matQuestionnaire;
    const c = document.getElementById('mat-content');
    let html = `<div class="alert alert-info mb-6">
        <span><strong>SOC-CMM Maturity Assessment</strong> — Rate your SOC across 5 domains on a scale of 1 (Initial) to 5 (Optimising).
        Score each question honestly based on current state, not aspirations. Results are saved for tracking progress over time.</span>
    </div>
    <div class="stats stats-vertical lg:stats-horizontal w-full bg-base-200 shadow mb-6">
        <div class="stat"><div class="stat-value text-error">1</div><div class="stat-title">Initial</div></div>
        <div class="stat"><div class="stat-value text-warning">2</div><div class="stat-title">Managed</div></div>
        <div class="stat"><div class="stat-value text-warning">3</div><div class="stat-title">Defined</div></div>
        <div class="stat"><div class="stat-value text-primary">4</div><div class="stat-title">Measured</div></div>
        <div class="stat"><div class="stat-value text-success">5</div><div class="stat-title">Optimising</div></div>
    </div>`;

    for (const domain of q.domains) {
        html += `<div class="card bg-base-200 shadow mb-4">
            <div class="flex flex-wrap items-center justify-between gap-4 px-6 py-5 cursor-pointer" data-toggle-next-display>
                <div class="basis-full md:basis-auto md:flex-1">
                    <div class="font-semibold text-lg">${matEsc(domain.name)}</div>
                    <div class="text-xs uppercase tracking-wide opacity-50 mt-1">${matEsc(domain.description)}</div>
                </div>
                <div class="font-mono text-2xl font-extrabold" id="mat-domain-score-${domain.id}">-</div>
            </div>
            <div class="px-6 py-5 border-t border-base-300">`;
        for (const question of domain.questions) {
            html += `<div class="card bg-base-300 mb-3">
                <div class="card-body p-4 gap-1">
                <div class="font-semibold">${matEsc(question.text)}</div>
                <div class="text-sm italic opacity-60 mb-3">${matEsc(question.guidance)}</div>
                <div class="mat-q-score flex gap-1.5 mb-2.5" id="mat-q-${question.id}">
                    ${[1,2,3,4,5].map(n => `<button class="btn btn-sm w-10" data-click-action="matScore" data-args='["${domain.id}", "${question.id}", ${n}, "$target"]'>${n}</button>`).join('')}
                </div>
                <input class="input input-sm w-full" placeholder="Notes (optional)" id="mat-notes-${question.id}">
            </div></div>`;
        }
        html += `<div class="text-[.72rem] text-[var(--text-secondary)] mt-1.5">Related ION pages: ${(domain.ion_pages||[]).map(p => `<a class="link link-primary text-[var(--primary)] no-underline" href="${p}">${p}</a>`).join(', ')}</div>`;
        html += '</div></div>';
    }

    html += `<div class="flex flex-wrap justify-end items-center gap-2.5 mt-6">
        <input class="input _ion-s-56b5cc5749" id="mat-title" type="text" placeholder="Assessment title (optional)">
        <button class="btn btn-primary" data-click-action="matSubmit">Submit Assessment</button>
    </div>`;

    c.innerHTML = html;
}

function matScore(domainId, questionId, score, btn) {
    if (!matResponses[domainId]) matResponses[domainId] = {};
    matResponses[domainId][questionId] = {score};
    const container = btn.parentElement;
    container.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    // Update domain average display
    const domain = matQuestionnaire.domains.find(d => d.id === domainId);
    if (domain) {
        const dResponses = matResponses[domainId] || {};
        const scores = domain.questions.map(q => (dResponses[q.id]||{}).score || 0).filter(s => s > 0);
        if (scores.length) {
            const avg = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
            const el = document.getElementById('mat-domain-score-' + domainId);
            if (el) { el.textContent = avg; el.style.color = scoreColor(avg); }
        }
    }
}

async function matSubmit() {
    // Collect notes
    for (const domain of matQuestionnaire.domains) {
        for (const q of domain.questions) {
            const notes = document.getElementById('mat-notes-' + q.id);
            if (notes && notes.value.trim()) {
                if (!matResponses[domain.id]) matResponses[domain.id] = {};
                if (!matResponses[domain.id][q.id]) matResponses[domain.id][q.id] = {score: 1};
                matResponses[domain.id][q.id].notes = notes.value.trim();
            }
        }
    }

    const title = document.getElementById('mat-title').value.trim() || 'SOC Maturity Assessment';
    try {
        const r = await fetch(MAT_API + '/assessments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({title, responses: matResponses}),
        });
        if (!r.ok) throw new Error('Submit failed');
        const result = await r.json();
        matRenderResult(result);
    } catch (e) {
        alert('Submit failed: ' + e.message);
    }
}

function matRenderResult(a) {
    const c = document.getElementById('mat-content');
    const color = scoreColor(a.overall_score);
    const pct = a.overall_score * 20;

    let html = `<div class="card bg-base-200 shadow mb-6">
        <div class="card-body flex-col sm:flex-row items-center gap-8">
        <div class="mat-result-ring" data-ion-style="background:conic-gradient(${color} ${pct}%, rgba(99,110,123,.2) ${pct}%)">
            <div class="mat-result-inner">
                <div class="font-mono text-4xl font-extrabold" data-ion-style="color:${color}">${a.overall_score}</div>
                <div class="text-[0.62rem] uppercase tracking-widest font-bold opacity-50 mt-1">of 5</div>
            </div>
        </div>
        <div>
            <h3 class="text-2xl font-semibold m-0 mb-1.5">${matEsc(a.overall_level)} Maturity</h3>
            <p class="m-0 opacity-70">${matEsc(a.title)} — ${a.created_at ? new Date(a.created_at).toLocaleDateString() : ''}</p>
        </div>
        </div>
    </div>`;

    html += '<div class="grid gap-4 mb-6 [grid-template-columns:repeat(auto-fit,minmax(220px,1fr))]">';
    for (const [domainId, score] of Object.entries(a.scores || {})) {
        const domain = (matQuestionnaire || {domains:[]}).domains.find(d => d.id === domainId) || {name: domainId};
        const col = scoreColor(score.score);
        html += `<div class="card bg-base-200 shadow">
            <div class="card-body p-5">
            <div class="flex justify-between items-center mb-2.5">
                <span class="text-xs font-extrabold uppercase tracking-widest opacity-70">${matEsc(domain.name || domainId)}</span>
                <span class="font-mono font-extrabold text-xl" data-ion-style="color:${col}">${score.score}/5</span>
            </div>
            <div class="h-1.5 bg-base-300 rounded overflow-hidden mb-1.5"><div class="mat-bar-fill" data-ion-style="width:${score.pct}%; background:${col}"></div></div>
            <div class="text-[0.65rem] uppercase tracking-wide opacity-50 font-semibold">${score.pct}%</div>
            </div>
        </div>`;
    }
    html += '</div>';

    html += `<div class="flex gap-2 justify-end">
        <button class="btn btn-ghost" data-click-action="matShowHistory">View History</button>
        <button class="btn btn-primary" data-click-action="matStartNew">New Assessment</button>
    </div>`;

    c.innerHTML = html;
}

async function matShowHistory() {
    const c = document.getElementById('mat-content');
    c.innerHTML = '<div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Loading history...</div>';
    try {
        const r = await fetch(MAT_API + '/assessments', {credentials: 'include'});
        const d = await r.json();
        const assessments = d.assessments || [];

        if (!assessments.length) {
            c.innerHTML = `<div class="card bg-base-200 shadow text-center">
                <div class="card-body items-center text-center py-14">
                <h3 class="card-title text-[var(--text-primary)] mb-2">No assessments yet</h3>
                <p>Run your first SOC maturity assessment to establish a baseline.</p>
                <button class="btn btn-primary mt-3.5" data-click-action="matStartNew">Start Assessment</button>
            </div></div>`;
            return;
        }

        let html = '<div class="alert alert-info mb-4"><span><strong>Assessment History</strong> — track your SOC maturity progression over time.</span></div>';
        html += '<div class="card bg-base-200 shadow overflow-x-auto"><table class="table table-sm"><thead><tr><th>Date</th><th>Title</th><th>Score</th><th>Level</th><th>Business</th><th>People</th><th>Process</th><th>Technology</th><th>Services</th><th></th></tr></thead><tbody>';
        for (const a of assessments) {
            const s = a.scores || {};
            const lvlBadge = a.overall_score >= 5 ? 'badge-success' : a.overall_score >= 4 ? 'badge-info' : a.overall_score >= 3 ? 'badge-warning' : 'badge-error';
            html += `<tr>
                <td>${a.created_at ? new Date(a.created_at).toLocaleDateString() : '-'}</td>
                <td>${matEsc(a.title)}</td>
                <td><strong data-ion-style="color:${scoreColor(a.overall_score)}">${a.overall_score}/5</strong></td>
                <td><span class="badge ${lvlBadge}">${matEsc(a.overall_level)}</span></td>
                <td>${(s.business||{}).score||'-'}</td>
                <td>${(s.people||{}).score||'-'}</td>
                <td>${(s.process||{}).score||'-'}</td>
                <td>${(s.technology||{}).score||'-'}</td>
                <td>${(s.services||{}).score||'-'}</td>
                <td><button class="btn btn-ghost btn-sm btn-error py-0.5 px-2 text-[.7rem]" data-click-action="matDelete" data-args='[${a.id}]'>Delete</button></td>
            </tr>`;
        }
        html += '</tbody></table></div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = `<div class="alert alert-error text-[var(--sev-critical)]">${matEsc(e.message)}</div>`;
    }
}

async function matDelete(id) {
    if (!confirm('Delete this assessment?')) return;
    await fetch(MAT_API + '/assessments/' + id, {method: 'DELETE', credentials: 'include'});
    matShowHistory();
}

document.addEventListener('DOMContentLoaded', matShowHistory);
</script>
{% endblock %}

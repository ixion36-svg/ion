{% extends "base.html" %}

{% block title %}Service Accounts - ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<section class="flex flex-wrap items-end justify-between gap-6 mb-8 rise d-1">
<div class="basis-full md:basis-auto md:flex-1">
  <div class="flex items-center gap-3 mb-4">
    <svg class="w-4 h-4 text-ion-amber"><use href="#i-lock"/></svg>
    <span class="label-tiny text-ion-amber">Machine identities</span>
  </div>
  <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">Service Accounts</h1>
  <p class="mt-3 max-w-2xl text-[15px] text-base-content/60">API keys and non-human identities.</p>
</div>
<div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" data-click-action="saLoad">Refresh</button>
    </div>
</section>

<div id="sa-risk-summary"></div>
<div id="sa-content"><div class="text-center p-10 text-[var(--text-secondary)]"><span class="loading loading-spinner loading-sm text-primary"></span> Loading service accounts...</div></div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
const API = '/api/service-accounts';
function $(id){return document.getElementById(id)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function saLoad(){
    try {
        const [accounts, summary] = await Promise.all([
            fetch(API).then(r=>r.json()),
            fetch(API+'/risk-summary').then(r=>r.json()),
        ]);
        renderSummary(summary);
        renderAccounts(accounts.accounts || []);
    } catch(e) {
        $('sa-content').innerHTML = '<div role="alert" class="alert alert-error _ion-s-76283a27ef">Failed to load service accounts</div>';
    }
}

function renderSummary(s) {
    const byRisk = s.by_risk || {};
    let html = '<div class="stats stats-vertical lg:stats-horizontal w-full bg-base-200 shadow mb-6">';
    html += `<div class="stat"><div class="stat-title">Total Accounts</div><div class="stat-value text-primary">${s.total||0}</div></div>`;
    html += `<div class="stat"><div class="stat-title">Critical Risk</div><div class="stat-value ${byRisk.critical?'text-error':'text-primary'}">${byRisk.critical||0}</div></div>`;
    html += `<div class="stat"><div class="stat-title">High Risk</div><div class="stat-value ${byRisk.high?'text-error':'text-primary'}">${byRisk.high||0}</div></div>`;
    html += `<div class="stat"><div class="stat-title">Stale Passwords</div><div class="stat-value ${s.stale_count?'text-warning':'text-primary'}">${s.stale_count||0}</div></div>`;
    html += `<div class="stat"><div class="stat-title">Never Expires</div><div class="stat-value ${s.never_expires_count?'text-warning':'text-primary'}">${s.never_expires_count||0}</div></div>`;
    html += '</div>';
    $('sa-risk-summary').innerHTML = html;
}

function renderAccounts(accounts) {
    if (!accounts.length) {
        $('sa-content').innerHTML = '<div class="card bg-base-200 shadow"><div class="card-body"><div role="alert" class="alert alert-info _ion-s-4076d22ca4">No service accounts tracked yet. Add accounts via the API or settings.</div></div></div>';
        return;
    }

    let html = '<div class="card bg-base-200 shadow"><div class="card-body p-0"><div class="overflow-x-auto"><table class="table table-sm"><thead><tr><th>Account</th><th>Type</th><th>Owner</th><th>Department</th><th>Risk</th><th>Password Age</th><th>Status</th><th>Systems</th></tr></thead><tbody>';
    for (const a of accounts) {
        const pwAge = a.password_age_days != null ? a.password_age_days : null;
        const pwCls = pwAge === null ? '' : pwAge > 180 ? 'text-error font-bold' : pwAge > 90 ? 'text-warning' : 'text-success';
        const pwText = pwAge !== null ? pwAge + 'd' : 'Unknown';
        const risk = (a.risk_level || '').toLowerCase();
        const riskBadge = risk === 'critical' ? 'badge-error' : risk === 'high' ? 'badge-warning' : risk === 'medium' ? 'badge-info' : risk === 'low' ? 'badge-success' : 'badge-ghost';
        const statusBadge = a.status === 'active' ? 'badge-success' : 'badge-error';

        let systemsList = '';
        try { systemsList = JSON.parse(a.systems||'[]').slice(0,3).join(', '); } catch(e) { systemsList = a.systems||''; }

        html += `<tr>
            <td><strong>${esc(a.account_name)}</strong>${a.display_name ? '<br><span class="_ion-s-d04e38ecf5">'+esc(a.display_name)+'</span>' : ''}</td>
            <td class="_ion-s-f63147b2ed">${esc(a.account_type)}</td>
            <td class="_ion-s-f63147b2ed">${esc(a.owner_name||'-')}</td>
            <td class="_ion-s-f63147b2ed">${esc(a.department||'-')}</td>
            <td><span class="badge badge-sm uppercase ${riskBadge}">${esc(a.risk_level)}</span></td>
            <td><span class="font-mono text-sm ${pwCls}">${pwText}</span>${a.password_never_expires ? '<br><span class="_ion-s-b4dbcad03d">NEVER EXPIRES</span>' : ''}</td>
            <td><span class="badge badge-sm uppercase ${statusBadge}">${esc(a.status)}</span></td>
            <td class="_ion-s-5f051a8760">${esc(systemsList||'-')}</td>
        </tr>`;
    }
    html += '</tbody></table></div></div></div>';
    $('sa-content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', saLoad);
</script>
{% endblock %}

<header class="mb-4">
  <h2 class="card-title text-base">First data source</h2>
  <p class="text-sm text-base-content/60">
    One source to start. Add more later from the Sources tab.
  </p>
</header>

<form hx-post="/api/cyab/onboard/{{ wid }}/step/3"
      hx-target="#wizard-step-content"
      hx-swap="innerHTML"
      method="post"
      action="/api/cyab/onboard/{{ wid }}/step/3"
      class="grid grid-cols-1 md:grid-cols-2 gap-4">

  <fieldset class="fieldset p-0">
    <legend class="fieldset-legend">Source name <span class="text-error">*</span></legend>
    <input name="name" type="text" required
           value="{{ state.source.name or state.identity.hostname or '' }}"
           class="input w-full">
  </fieldset>

  <fieldset class="fieldset p-0">
    <legend class="fieldset-legend">Source type</legend>
    <select name="data_source_type" class="select w-full">
      {% for opt in ['windows-evtx', 'generic-syslog', 'linux-auditd', 'aws-cloudtrail',
                     'office365', 'okta', 'azure-ad', 'edr-generic'] %}
        <option value="{{ opt }}" {% if state.source.data_source_type == opt %}selected{% endif %}>{{ opt }}</option>
      {% endfor %}
    </select>
  </fieldset>

  <fieldset class="fieldset p-0 md:col-span-2">
    <legend class="fieldset-legend">Sub-profile</legend>
    <select name="subprofile_id" class="select w-full">
      <option value="">— pick a sub-profile —</option>
      {% for s in (subprofiles or []) %}
        <option value="{{ s.id }}"
                {% if state.source.subprofile_id == s.id or state.identity.subprofile_id == s.id %}selected{% endif %}>
          {{ s.label or s.name }}
        </option>
      {% endfor %}
    </select>
  </fieldset>

  <div class="md:col-span-2 flex flex-wrap items-center justify-between gap-3 mt-2">
    <a href="/cyab/onboard?wid={{ wid }}&step=2" class="btn btn-ghost btn-sm">← Back</a>
    <div class="flex flex-wrap gap-2">
      <a href="/cyab/systems" class="btn btn-ghost btn-sm">Save & exit</a>
      <button type="submit" class="btn btn-primary">
        Continue → Doc placeholders
      </button>
    </div>
  </div>
</form>

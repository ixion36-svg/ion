<header class="mb-4">
  <h2 class="text-white text-[16px] font-semibold">First data source</h2>
  <p class="text-slate-400 text-[12px]">
    One source to start. Add more later from the Sources tab.
  </p>
</header>

<form hx-post="/api/cyab/onboard/{{ wid }}/step/3"
      hx-target="#wizard-step-content"
      hx-swap="innerHTML"
      method="post"
      action="/api/cyab/onboard/{{ wid }}/step/3"
      class="grid grid-cols-2 gap-4 text-[12.5px]">

  <label class="flex flex-col gap-1">
    <span class="text-slate-400">Source name <span class="text-rose-400">*</span></span>
    <input name="name" type="text" required
           value="{{ state.source.name or state.identity.hostname or '' }}"
           class="px-2 py-1 bg-slate-900 border border-slate-700 rounded">
  </label>

  <label class="flex flex-col gap-1">
    <span class="text-slate-400">Source type</span>
    <select name="data_source_type" class="px-2 py-1 bg-slate-900 border border-slate-700 rounded">
      {% for opt in ['windows-evtx', 'generic-syslog', 'linux-auditd', 'aws-cloudtrail',
                     'office365', 'okta', 'azure-ad', 'edr-generic'] %}
        <option value="{{ opt }}" {% if state.source.data_source_type == opt %}selected{% endif %}>{{ opt }}</option>
      {% endfor %}
    </select>
  </label>

  <label class="col-span-2 flex flex-col gap-1">
    <span class="text-slate-400">Sub-profile</span>
    <select name="subprofile_id" class="px-2 py-1 bg-slate-900 border border-slate-700 rounded">
      <option value="">— pick a sub-profile —</option>
      {% for s in (subprofiles or []) %}
        <option value="{{ s.id }}"
                {% if state.source.subprofile_id == s.id or state.identity.subprofile_id == s.id %}selected{% endif %}>
          {{ s.label or s.name }}
        </option>
      {% endfor %}
    </select>
  </label>

  <div class="col-span-2 flex justify-between items-center mt-2">
    <a href="/cyab/onboard?wid={{ wid }}&step=2" class="text-slate-500 text-[11px]">← Back</a>
    <div class="flex gap-2">
      <a href="/cyab/systems" class="text-slate-500 text-[11px] py-1">Save & exit</a>
      <button type="submit" class="px-4 py-1.5 bg-cyan-700 text-white text-[12.5px] rounded">
        Continue → Doc placeholders
      </button>
    </div>
  </div>
</form>

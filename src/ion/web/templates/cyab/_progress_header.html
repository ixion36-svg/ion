<div class="onboarding-progress sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 py-2 px-4 flex items-center gap-3 text-[12.5px]">
  <span class="text-slate-400 uppercase tracking-wider text-[10px]">Onboarding</span>

  <div class="flex items-center gap-2 flex-1 max-w-md">
    <div class="h-1.5 flex-1 bg-slate-800 rounded-full overflow-hidden">
      <div class="h-full bg-gradient-to-r from-cyan-400 to-emerald-500"
           style="width: {{ progress.completion_pct }}%"></div>
    </div>
    <span class="text-cyan-300 font-medium">{{ progress.done }} / {{ progress.total }}</span>
  </div>

  {% if progress.critical_missing %}
    <span class="text-rose-400 bg-rose-950/40 px-2 py-0.5 rounded">
      {{ progress.critical_missing|length }} critical missing
    </span>
  {% else %}
    <span class="text-emerald-400 text-[11px]">all critical items done</span>
  {% endif %}

  {% if system.updated_at %}
    <span class="text-slate-500 ml-auto text-[11px]">
      last edited {{ system.updated_at.strftime('%Y-%m-%d %H:%M') }}
    </span>
  {% endif %}
</div>

{% extends "base.html" %}

{% block title %}Course · ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1100px] w-full px-4 sm:px-6 py-10 md:py-14">

  <a href="/courses" class="btn btn-ghost btn-sm mb-4">← Back to courses</a>

  <div id="cd-root">
    <div class="flex justify-center items-center gap-2 py-14 text-center opacity-50">
      <span class="loading loading-spinner loading-sm text-primary"></span> Loading…
    </div>
  </div>
</div>
</div>

<script nonce="{{ csp_nonce }}">
const SLUG = {{ slug | tojson }};

function escHtml(s) { if (s == null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function md(s) {
  if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') return escHtml(s);
  return DOMPurify.sanitize(marked.parse(s || ''));
}

async function loadCourse() {
  try {
    const r = await fetch('/api/courses/' + encodeURIComponent(SLUG));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const c = await r.json();
    render(c);
  } catch (e) {
    document.getElementById('cd-root').innerHTML =
      '<div role="alert" class="alert alert-error"><span>Failed to load course: ' + escHtml(e.message) + '</span></div>';
  }
}

function render(c) {
  // Aggregate progress numbers across all lessons
  let total = 0, completed = 0, inProgress = 0;
  (c.modules || []).forEach(m => {
    (m.lessons || []).forEach(l => {
      total++;
      if (l.user_status === 'completed') completed++;
      else if (l.user_status === 'in_progress' || l.user_status === 'failed') inProgress++;
    });
  });
  const pct = total ? Math.round(100 * completed / total) : 0;

  const levelBadge = c.level === 'L1' ? 'badge-success'
    : c.level === 'L2' ? 'badge-info'
    : c.level === 'L3' ? 'badge-warning'
    : c.level === 'L4' ? 'badge-error'
    : 'badge-ghost';

  let modulesHtml = (c.modules || []).map((m, mIdx) => {
    const lessonsHtml = (m.lessons || []).map(l => {
      const status = l.user_status || 'not_started';
      const statusBadge = status === 'completed' ? 'badge-success'
        : status === 'in_progress' ? 'badge-warning'
        : status === 'failed' ? 'badge-error'
        : 'badge-ghost';
      const typeBadge = l.lesson_type === 'quiz' ? 'badge-info'
        : l.lesson_type === 'lab'  ? 'badge-warning'
        : 'badge-ghost';
      const scoreLabel = (l.user_score != null) ? `<span class="font-mono text-xs opacity-60">${l.user_score}%</span>` : '';
      return `<a class="flex flex-wrap items-center gap-2 p-3 mt-2 rounded-box bg-base-300 border border-base-300 no-underline text-inherit hover:border-primary hover:bg-primary/10 transition" href="/lessons/${l.id}">
        <span class="badge badge-sm ${statusBadge}" title="${escHtml(status)}">${escHtml(status)}</span>
        <span class="basis-full md:basis-auto md:flex-1 font-medium text-sm">${escHtml(l.title)}</span>
        <span class="badge badge-sm ${typeBadge}">${escHtml(l.lesson_type)}</span>
        <span class="font-mono text-xs opacity-60" title="duration">~${l.duration_min}m</span>
        ${scoreLabel}
      </a>`;
    }).join('');
    return `<div class="card bg-base-200 shadow mt-6">
      <div class="card-body">
      <div class="flex flex-wrap items-baseline gap-2 mb-2">
        <span class="font-mono text-xs font-bold opacity-50">Module ${mIdx + 1}</span>
        <h2 class="card-title text-base basis-full md:basis-auto md:flex-1">${escHtml(m.title)}</h2>
        <span class="text-xs opacity-50">~${m.estimated_minutes}m</span>
      </div>
      ${m.description_md ? `<div class="prose-md text-sm opacity-70 mb-2">${md(m.description_md)}</div>` : ''}
      ${lessonsHtml}
      </div>
    </div>`;
  }).join('');

  const enrolBtn = c.enrolment.enrolled
    ? (c.enrolment.completed_at
        ? `<span class="flex flex-wrap items-center gap-2">
             <span class="badge badge-success">✓ Completed${c.enrolment.score_pct != null ? ' · ' + c.enrolment.score_pct + '%' : ''}</span>
             <a href="/api/courses/${encodeURIComponent(c.slug)}/certificate.pdf" target="_blank" rel="noopener" class="btn btn-primary btn-sm" title="Download your PDF certificate">
               <svg class="w-3.5 h-3.5"><use href="#i-file-text"/></svg>
               Download certificate
             </a>
           </span>`
        : `<span class="badge badge-ghost">Enrolled</span>`
      )
    : `<button data-click-action="enrol" data-args='[${c.id}]' class="btn btn-primary btn-sm">Enrol</button>`;

  document.getElementById('cd-root').innerHTML = `
    <div class="flex flex-wrap items-start justify-between gap-4 mb-4">
      <div class="basis-full md:basis-auto md:flex-1">
        <span class="badge badge-sm ${levelBadge} uppercase tracking-wider">${escHtml(c.level)}</span>
        <h1 class="text-2xl font-bold tracking-tight mt-2">${escHtml(c.title)}</h1>
      </div>
      <div class="_ion-s-690f054c4e">${enrolBtn}</div>
    </div>
    <div class="stats stats-vertical sm:stats-horizontal bg-base-200 shadow-sm mb-4 w-full">
      <div class="stat py-3 px-4">
        <div class="stat-title">Duration</div>
        <div class="stat-value text-lg">~${c.estimated_hours}h</div>
      </div>
      <div class="stat py-3 px-4">
        <div class="stat-title">Pass mark</div>
        <div class="stat-value text-lg">${c.pass_threshold}%</div>
        <div class="stat-desc">minimum to pass</div>
      </div>
      <div class="stat py-3 px-4">
        <div class="stat-title">Progress</div>
        <div class="stat-value text-lg">${pct}%</div>
        <div class="stat-desc">${completed}/${total} lessons</div>
      </div>
    </div>
    <div class="h-1.5 rounded-full bg-base-300 overflow-hidden mt-1.5 _ion-s-16884469a8"><div class="h-full bg-gradient-to-r from-primary to-secondary transition-[width] duration-300" data-ion-style="width:${pct}%"></div></div>
    <div class="prose-md text-sm leading-relaxed">${md(c.description_md || '')}</div>
    ${modulesHtml}
  `;
}

async function enrol(courseId) {
  try {
    const r = await fetch('/api/courses/' + courseId + '/enrol', { method: 'POST' });
    if (!r.ok) {
      const e = await r.json();
      throw new Error(e.detail || ('HTTP ' + r.status));
    }
    showToast('Enrolled!', 'success');
    loadCourse();
  } catch (e) {
    showToast('Enrol failed: ' + e.message, 'error');
  }
}
window.enrol = enrol;

document.addEventListener('DOMContentLoaded', loadCourse);
</script>
{% endblock %}

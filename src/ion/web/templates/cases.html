{% extends "base.html" %}

{% block title %}Cases · ION{% endblock %}

{% block head_css %}
{# The page's own rules. Its inline <style> block moves here when this
   page converts for the styled column; the colours the view model used
   to carry are here already. #}
<link rel="stylesheet" href="/static/css/cases-page.css?v={{ ion_version }}">
{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-slate-200 overflow-x-hidden" data-alert-detail-v2="{{ '1' if alert_detail_v2 else '0' }}" data-alert-field-pins="{{ '1' if alert_field_pins else '0' }}" data-bob-templates="{{ '1' if bob_custom_templates else '0' }}">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">

  <!-- Header row -->
  <section class="ion-page-header flex-wrap gap-6 mb-8 rise d-1">
    <div class="basis-full md:basis-auto md:flex-1 min-w-0">
      <div class="flex items-center gap-3 mb-4">
        <span class="h-1.5 w-1.5 rounded-full bg-ion-cyan pulse-cyan"></span>
        <span class="label-tiny text-ion-cyan">Investigation workflow</span>
      </div>
      <h1 class="ion-ph-title font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">Cases</h1>
      <p class="ion-ph-sub mt-3 max-w-2xl text-[15px]">Visual workflow tracking for security investigations.</p>
    </div>
    <button data-click-action="showCreateCaseModal" class="ion-btn ion-btn-primary">
      <svg class="w-3.5 h-3.5"><use href="#i-plus"/></svg>
      New Case
    </button>
  </section>

  <!-- Attention Banner (JS-populated) -->
  <div id="attn-banner" class="mb-4 rounded-[12px] border border-ion-amber/30 bg-ion-amber/5 px-5 py-4 flex flex-col gap-3 hidden">
    <div class="attn-banner-header flex items-center justify-between">
      <span class="flex items-center gap-2 text-[13px] text-ion-amber font-medium">
        <svg class="w-4 h-4"><use href="#i-alert-triangle"/></svg>
        <span id="attn-count">—</span> attention reasons in displayed cases
      </span>
      <button data-click-action="dismissAttentionBanner" class="text-slate-400 hover:text-white transition" title="Dismiss">
        <svg class="w-4 h-4"><use href="#i-x"/></svg>
      </button>
    </div>
    <div id="attn-list" class="attn-banner-list flex flex-wrap gap-2"></div>
  </div>

  <!-- Stats bar. Server-rendered by /ui/cases/summary, which also fills the
       Management Analytics panel out of band. Re-requested when loadAllCases()
       dispatches cases-changed on the body after a status change. -->
  <div id="cases-stats" class="grid grid-cols-2 sm:grid-cols-4 xl:grid-cols-8 gap-3 mb-8 rise d-2"
       hx-get="/ui/cases/summary"
       hx-trigger="load, cases-changed from:body"
       hx-swap="innerHTML">
    {# Placeholders, not zeros: a tile reading 0 before the read answers
       is the same glyph as a measured zero. #}
    {% for label in ("Open Cases", "Acknowledged", "Critical Active", "Avg Resolution",
                     "MTTR · 30d", "Closure rate · 7d", "Created / Closed · 7d", "Unassigned") %}
    <div class="ion-metric">
      <div class="ion-metric-label">{{ label }}</div>
      <div class="ion-metric-value text-base-content/40" aria-busy="true">&hellip;</div>
    </div>
    {% endfor %}
  </div>
  <!-- Outside #cases-stats and #analytics-panel-body on purpose: the retry
       control a failed render offers must not live inside what it refreshes.
       Replaced out of band by the fragment. The hidden control inside is
       for the request itself failing, when nothing out of band arrives;
       the listener at the end of the script reveals it. -->
  <div id="cases-summary-retry" class="mb-4">
    <div class="hidden" data-summary-retry>
      <div role="alert" class="alert alert-error flex items-center justify-between gap-3">
        <span>The stat tiles and the analytics could not be requested. Nothing here has been measured.</span>
        <button type="button" class="btn btn-sm" hx-get="/ui/cases/summary" hx-target="#cases-stats" hx-swap="innerHTML">Retry</button>
      </div>
    </div>
  </div>

<!-- Filled by _fragments/cases_board.html through an hx-swap-oob, so the
     board never silently shows a subset of the cases (review 2026-10-08,
     stage 5). This said renderCaseLoadNotice() filled it; that function
     went when the board moved to /ui/cases/board, and the notice is the
     server's to write now, as are #cases-total and #cases-shown. -->
<div id="cases-load-notice" class="mb-4"></div>

<!-- Filters Bar -->
<div class="flex flex-col sm:flex-row gap-3 mb-4">
    <input type="text" id="filter-search" class="flex-1 px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content placeholder:text-base-content/50 focus:outline-none focus:border-primary" placeholder="Search case number or title..." data-input-action="debouncedFilter">
    <select id="filter-severity" class="min-w-[150px] px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="reloadCaseBoard">
        <option value="">All Severities</option>
        <option value="critical">Critical</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>
    {# status filter. /api/cases already returns open, acknowledged
       AND closed — the board just had no way to narrow to one of them, so a
       closed case could only be found by scrolling past the live ones. #}
    <select id="filter-status" class="min-w-[150px] px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="reloadCaseBoard">
        <option value="">All Statuses</option>
        <option value="open">Open</option>
        <option value="acknowledged">Acknowledged</option>
        <option value="closed">Closed</option>
    </select>
    <select id="filter-assignee" class="min-w-[150px] px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="reloadCaseBoard">
        <option value="">All Assignees</option>
    </select>
</div>

<!-- Board toolbar (sort + page-size + showing count) -->
<div class="flex flex-wrap items-center gap-3 mb-4">
    <div class="text-xs text-base-content/60 tabular-nums">Showing <b id="cases-shown" class="text-base-content font-mono">—</b> of <b id="cases-total" class="text-base-content font-mono">—</b> cases</div>
    <span class="flex-1"></span>
    <label class="flex items-center gap-2 text-xs text-base-content/60">
        <span>Sort</span>
        <select id="cases-sort" class="min-w-0 px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="changeSort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="severity">Severity</option>
            <option value="alerts">Most alerts</option>
        </select>
    </label>
    <label class="flex items-center gap-2 text-xs text-base-content/60">
        <span>Page size</span>
        <select id="cases-pagesize" class="min-w-0 px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="changePageSize">
            <option value="12">12 at a time</option>
            <option value="24" selected>24 at a time</option>
            <option value="48">48 at a time</option>
        </select>
    </label>
</div>

<!-- Case widget board (replaces the drag-drop Kanban; status changes now on
     each widget's inline control — same PATCH path the Kanban drop used). -->
<div class="grid grid-cols-[repeat(auto-fill,minmax(380px,1fr))] max-[640px]:grid-cols-1 gap-4 items-start" id="cases-board"></div>

<!-- Load-more cap -->
<div class="flex flex-col items-center gap-2.5 mt-[26px]" id="cases-loadmore" hidden>
    <button type="button" class="font-semibold text-[13px] text-primary bg-primary/[0.12] border border-primary/40 rounded-[10px] px-[22px] py-[11px] cursor-pointer transition hover:bg-primary/20" data-click-action="loadMoreCases">Load more cases</button>
    <p class="text-[11.5px] text-base-content/50 text-center max-w-[56ch] m-0">Widgets render in pages of your chosen size, so a queue of hundreds of
        cases opens instantly. The rest stay ready until requested.</p>
</div>

<!-- Management Analytics Panel -->
<div class="analytics-toggle" data-click-action="toggleAnalyticsPanel">
    <h3>Management Analytics</h3>
    <span class="chevron" id="analytics-chevron"><i class="icon-chevron-down"></i></span>
</div>
<div class="analytics-panel" id="analytics-panel-body">
    <!-- Filled out of band by /ui/cases/summary. The collapsed state is a
         class on this element, which an innerHTML swap does not touch. -->
    <p class="text-[0.8rem] text-[var(--text-secondary)]" aria-busy="true">Loading analytics&hellip;</p>
</div>

<!-- Case Detail Slide-out Panel -->
<div class="case-panel-overlay" id="case-panel-overlay" data-click-action="closeCasePanel"></div>
<div class="case-panel" id="case-panel">
    <div class="case-panel-header">
        <div>
            <span class="case-panel-number" id="panel-case-number"></span>
            <span class="case-panel-title" id="panel-case-title"></span>
        </div>
        <button class="case-panel-close" data-click-action="closeCasePanel">&times;</button>
    </div>
    <div class="case-panel-body" id="case-panel-body">
        <!-- Populated dynamically -->
    </div>
</div>

<!-- Create Case Modal -->
<div class="cases-modal-overlay hidden" id="create-case-overlay" data-click-action="closeCreateCaseModal" data-only-self-click>
    <div class="bg-base-200 border border-base-300 rounded-lg w-[90%] max-w-[480px] max-h-[80vh] overflow-auto shadow-[0_2px_8px_rgba(0,0,0,.15)]">
        <div class="flex justify-between items-center px-5 py-4 border-b border-base-300">
            <h3 class="m-0 text-[1.05rem]">Create New Case</h3>
            <button class="bg-transparent border-0 text-[1.5rem] leading-none text-base-content/60 hover:text-base-content cursor-pointer" data-click-action="closeCreateCaseModal">&times;</button>
        </div>
        <div class="p-5">
            <div class="mb-3">
                <label class="block text-[0.85rem] font-medium text-base-content mb-1">Title *</label>
                <input type="text" id="new-case-title" class="form-control" placeholder="Case title...">
            </div>
            <div class="mb-3">
                <label class="block text-[0.85rem] font-medium text-base-content mb-1">Description</label>
                <textarea id="new-case-description" class="form-control resize-y" rows="3" placeholder="Describe the investigation..."></textarea>
            </div>
            <div class="flex gap-3">
                <div class="mb-3 flex-1">
                    <label class="block text-[0.85rem] font-medium text-base-content mb-1">Severity</label>
                    <select id="new-case-severity" class="form-control">
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="mb-3 flex-1">
                    <label class="block text-[0.85rem] font-medium text-base-content mb-1">Assign To</label>
                    <select id="new-case-assignee" class="form-control">
                        <option value="">Unassigned</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-base-300">
            <button class="btn" data-click-action="closeCreateCaseModal">Cancel</button>
            <button class="btn btn-primary" data-click-action="submitCreateCase">Create Case</button>
        </div>
    </div>
</div>

<!-- Closure Modal -->
<div class="cases-modal-overlay hidden" id="closure-modal-overlay" data-click-action="cancelClosure" data-only-self-click>
    <div class="bg-base-200 border border-base-300 rounded-lg w-[90%] max-w-[480px] max-h-[80vh] overflow-auto shadow-[0_2px_8px_rgba(0,0,0,.15)]">
        <div class="flex justify-between items-center px-5 py-4 border-b border-base-300">
            <h3 id="closure-modal-title" class="m-0 text-[1.05rem]">Close Case</h3>
            <button class="bg-transparent border-0 text-[1.5rem] leading-none text-base-content/60 hover:text-base-content cursor-pointer" data-click-action="cancelClosure">&times;</button>
        </div>
        <div class="p-5">
            <div class="mb-3">
                <label class="block text-[0.85rem] font-medium text-base-content mb-1">Closure Reason *</label>
                <select id="closure-reason" class="form-control">
                    <option value="">Select reason...</option>
                    <option value="true_positive">True Positive</option>
                    <option value="false_positive">False Positive</option>
                    <option value="benign_true_positive">Benign True Positive</option>
                    <option value="duplicate">Duplicate</option>
                    <option value="insufficient_data">Insufficient Data</option>
                    <option value="not_applicable">Not Applicable</option>
                </select>
            </div>
            <div class="mb-3">
                <div class="flex items-center justify-between gap-2">
                    <label class="block text-[0.85rem] font-medium text-base-content mb-1">Closure Notes</label>
                    <button type="button" class="inline-flex items-center gap-[0.3rem] bg-transparent border border-primary text-primary rounded-[6px] text-[0.72rem] px-2 py-[0.15rem] cursor-pointer transition hover:bg-primary/10 disabled:opacity-55 disabled:cursor-progress" id="closure-ai-rewrite"
                            data-click-action="rewriteClosureNotes"
                            title="Use AI to tighten your closing comment into a clear, defensible rationale">
                        <i class="icon-sparkles text-[0.8rem]"></i> AI rewrite
                    </button>
                </div>
                <textarea id="closure-notes" class="form-control resize-y" rows="3" placeholder="Closure details..."></textarea>
            </div>
        </div>
        <div class="flex justify-end gap-2 px-5 py-3 border-t border-base-300">
            <button class="btn" data-click-action="cancelClosure">Cancel</button>
            <button class="btn btn-primary" data-click-action="confirmClosure">Confirm</button>
        </div>
    </div>
</div>

<div id="case-assignees-read" hidden></div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
{% include "_fragments/ion_fragment_client.html" %}
<script src="/static/js/ion-fragments.js?v={{ ion_version }}"></script>
{% if initial_case_id %}<script nonce="{{ csp_nonce }}">window.__initialCaseId = {{ initial_case_id }};</script>{% endif %}
<script nonce="{{ csp_nonce }}">
// =============================================================================
// Cases Board — State
// =============================================================================
let allCases = [];
let usersCache = [];
let pendingClosure = null; // { caseId, targetStatus }
let attentionDismissed = false;
let casesLoaded = false;

// widget-grid board: sort + page-size + progressive load-more cap.
let boardSort = 'newest';
let boardPageSize = 24;
let boardShown = 0;
let boardReadFailed = false;
let boardRequestSequence = 0;

const closureReasonLabels = {
    true_positive: 'TP',
    false_positive: 'FP',
    benign_true_positive: 'BTP',
    duplicate: 'DUP',
    insufficient_data: 'N/D',
    not_applicable: 'N/A',
};

// Full-word status + verdict labels for the case/alert widgets.
const statusLabels = { open: 'Open', acknowledged: 'Acknowledged', closed: 'Closed' };
const verdictLabels = {
    true_positive: 'True Positive', benign_true_positive: 'Benign TP',
    false_positive: 'False Positive', duplicate: 'Duplicate',
    insufficient_data: 'Insufficient', not_applicable: 'N/A',
};
const _sevRank = { critical: 0, high: 1, medium: 2, low: 3 };

// =============================================================================
// Helpers
// =============================================================================
function esc(s) {
    if (!s) return '';
    const d = document.createElement('div');
    d.textContent = s;
    // textContent→innerHTML escapes & < > ; also encode both quote characters
    // so values remain safe inside single- or double-quoted HTML attributes.
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}



const _filterDebounce = debounce(() => reloadCaseBoard(), 200);
function debouncedFilter() { _filterDebounce(); }

// =============================================================================
// Data Loading
// =============================================================================
async function reloadCaseBoard() {
    boardShown = 0;
    allCases = [];
    boardReadFailed = false;
    document.getElementById('attn-list').replaceChildren();
    document.getElementById('attn-banner').style.display = 'none';
    return renderBoard();
}

async function loadAllCases() {
    const wasLoaded = casesLoaded;
    const loaded = await reloadCaseBoard();
    // Later closure/deep-link/navigation code still uses allCases. It is a
    // cache of requested board rows plus the explicitly selected case,
    // never a second client-side copy of the whole case table.
    const selected = window.__initialCaseId || new URLSearchParams(location.search).get('selected');
    if (selected && !allCases.some(c => String(c.id) === String(selected) || c.case_number === selected)) {
        try {
            const url = /^\d+$/.test(String(selected)) ? '/api/cases/' + selected
                : '/api/cases?' + new URLSearchParams({q:selected,limit:24,offset:0});
            const response = await fetch(url);
            if (response.ok) {
                const payload = await response.json();
                const rows = Array.isArray(payload.cases) ? payload.cases : [payload];
                const row = rows.find(c => String(c.id) === String(selected) || c.case_number === selected);
                if (row) allCases.push(row);
            }
        } catch (error) { console.log('Selected case could not be cached', error); }
    }
    casesLoaded = true;
    if (wasLoaded) document.body.dispatchEvent(new CustomEvent('cases-changed'));
    return loaded;
}



/* Counts come from the server's aggregate queries, not from the loaded
   array. Deriving them client side only worked while the array was the
   whole table -- once the load is capped, a client-side count reports the
   size of the page and the dashboard quietly understates the backlog. */
async function loadCaseFacets() {
    try {
        const resp = await fetch('/api/cases/facets');
        if (!resp.ok) return null;
        return await resp.json();
    } catch (e) {
        return null;
    }
}

async function loadUsers() {
    return populateAssigneeDropdowns();
}

async function populateAssigneeDropdowns() {
    const loaded = await ionLoadFragment('/ui/cases/assignees', 'case-assignees-read', 'Loading assignees...');
    const carrier = document.querySelector('#case-assignees-read [data-case-users]');
    usersCache = loaded && carrier ? JSON.parse(carrier.dataset.caseUsers) || [] : [];
    if (!loaded) for (const id of ['filter-assignee','new-case-assignee']) {
        const select = document.getElementById(id);
        select.disabled = true;
        ionMessage(select, 'Assignees unavailable');
    }
}

// =============================================================================
// Filtering & Rendering
// =============================================================================


// Read one server-filtered page; load more appends only on request.
async function renderBoard(append = false) {
    const sequence = ++boardRequestSequence;
    const parameters = new URLSearchParams({mode:boardSort,limit:boardPageSize,offset:append ? boardShown : 0});
    for (const [id,key] of [['filter-search','q'],['filter-severity','severity'],['filter-status','status'],['filter-assignee','assigned_to_id']]) {
        const element = document.getElementById(id);
        const value = element && !element.disabled ? element.value.trim() : "";
        if (value) parameters.set(key,value);
    }
    document.querySelectorAll('#cases-loadmore button').forEach(button => button.disabled = true);
    const loaded = await ionLoadFragment('/ui/cases/board' + '?' + parameters, 'cases-board', 'Loading cases...', {swap:append ? 'beforeend' : 'innerHTML'});
    if (sequence !== boardRequestSequence) return false;
    const carriers = document.querySelectorAll('#cases-board [data-case-page]');
    const carrier = carriers[carriers.length-1];
    const view = loaded && carrier ? JSON.parse(carrier.dataset.casePage) : null;
    boardReadFailed = !view || view.state === 'failed';
    if (!boardReadFailed) {
        document.querySelectorAll('[data-case-board-failed], [data-attention-failed]').forEach(node => node.remove());
        for (const row of view.cache) {
            const index = allCases.findIndex(c => c.id === row.id);
            if (index < 0) allCases.push(row); else allCases[index] = row;
        }
        boardShown = view.next_offset;
    } else {
        if (!append) boardShown = 0;
        for (const id of ['cases-total','cases-shown']) document.getElementById(id).textContent = '—';
        if (!append) document.getElementById('attn-list').textContent = 'Attention could not be read.';
        const more = document.getElementById('cases-loadmore');
        more.hidden = false;
        const retry = more.querySelector('button');
        retry.disabled = false;
        retry.textContent = append ? 'Retry next page' : 'Retry cases';
        more.querySelector('p').textContent = append ? 'The next page could not be read. Previously loaded cases are retained.' : 'The cases could not be read.';
    }
    computeAttentionAlerts();
    return !boardReadFailed;
}

function changeSort() {
    boardSort = document.getElementById('cases-sort').value;
    reloadCaseBoard();
}

function changePageSize() {
    boardPageSize = parseInt(document.getElementById('cases-pagesize').value, 10);
    reloadCaseBoard();
}

function loadMoreCases() {
    return boardShown ? renderBoard(true) : reloadCaseBoard();
}



// =============================================================================
// Case Status Updates
// =============================================================================
async function updateCaseStatus(caseId, status, closureReason, closureNotes) {
    // returns true on success, false on failure so callers can
    // decide whether to close the panel / clear pendingClosure. Previously
    // the function swallowed the result, which made it impossible to keep
    // the closure modal open when the PATCH failed.
    try {
        const body = { status: status };
        if (closureReason) body.closure_reason = closureReason;
        if (closureNotes) body.closure_notes = closureNotes;

        const resp = await fetch('/api/cases/' + caseId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || 'Update failed');
        }

        showToast('Case status updated', 'success');
        await loadAllCases();

        // (panel-close bug): the v0.23.x conditional gated the
        // panel refresh on `openCase` being present in allCases. allCases
        // could be momentarily empty (network race or list-endpoint
        // failure), which made the gate silently fail and leave the panel
        // showing pre-close state — the bug the user reported as "closing
        // via the dropdown sometimes seems not to close the case".
        //
        // Fix: read the case id straight off `panel.dataset.caseId`, set
        // by openCaseDetail. No allCases dependency. For the close path
        // on the panel's own case, auto-close the panel (mirroring the
        // kanban experience). For other status changes on that case,
        // refresh the panel directly. Status changes targeting a
        // different case (kanban drag while a different case's panel is
        // open) do not touch the panel.
        const panel = document.getElementById('case-panel');
        if (panel && panel.classList.contains('open')) {
            const panelCaseId = parseInt(panel.dataset.caseId || '0', 10);
            if (panelCaseId === caseId) {
                if (status === 'closed') {
                    closeCasePanel();
                } else {
                    openCaseDetail(caseId);
                }
            }
        }
        return true;
    } catch (e) {
        showToast('Failed to update case: ' + e.message, 'error');
        return false;
    }
}

// Reset the AI-rewrite button to its idle state whenever the closure modal
// opens, so a stale "Revert" label / cached draft from a prior close doesn't
// leak into a fresh one.
// Clone one of the page's <template> elements. The closure button's
// three labels were innerHTML assignments from string literals, so an
// icon and its wording lived where no stylesheet sweep reaches them.
function ionCaseTpl(id) {
    const tpl = document.getElementById(id);
    return tpl ? tpl.content.cloneNode(true) : document.createDocumentFragment();
}

function resetClosureAiButton() {
    const btn = document.getElementById('closure-ai-rewrite');
    if (!btn) return;
    delete btn.dataset.original;
    delete btn.dataset.rewritten;
    btn.disabled = false;
    btn.replaceChildren(ionCaseTpl('tpl-closure-ai-idle'));
}

// AI-polish the analyst's draft closing comment. Sends the current draft +
// selected closure reason (+ case title for context) to the LLM and replaces
// the textarea with the tightened version. The original draft is preserved on
// the button's dataset so a second click can revert.
async function rewriteClosureNotes() {
    const btn = document.getElementById('closure-ai-rewrite');
    const ta = document.getElementById('closure-notes');
    if (!ta || !btn) return;

    // Toggle back to the pre-rewrite draft if we already rewrote once.
    if (btn.dataset.original !== undefined && ta.value === (btn.dataset.rewritten || '')) {
        ta.value = btn.dataset.original;
        delete btn.dataset.original;
        delete btn.dataset.rewritten;
        btn.replaceChildren(ionCaseTpl('tpl-closure-ai-idle'));
        return;
    }

    const reason = document.getElementById('closure-reason').value;
    const draft = ta.value.trim();
    const caseId = pendingClosure ? pendingClosure.caseId : null;
    const theCase = caseId ? allCases.find(c => c.id === caseId) : null;

    const orig = ta.value;
    btn.disabled = true;
    btn.replaceChildren(ionCaseTpl('tpl-closure-ai-busy'));
    try {
        const resp = await fetch('/api/ai/closure/rewrite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                draft: draft,
                reason: reason,
                case_title: theCase ? (theCase.title || '') : '',
                case_id: caseId,
            }),
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
        const rewritten = (data.content || '').trim();
        if (!rewritten) throw new Error('Empty response from AI');
        ta.value = rewritten;
        btn.dataset.original = orig;
        btn.dataset.rewritten = rewritten;
        btn.replaceChildren(ionCaseTpl('tpl-closure-ai-revert'));
        showToast('Closing comment rewritten — review before confirming', 'success');
    } catch (e) {
        // prevLabel was always the idle label, captured one line
        // before it was overwritten.
        btn.replaceChildren(ionCaseTpl('tpl-closure-ai-idle'));
        showToast('AI rewrite failed: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
    }
}

async function confirmClosure() {
    if (!pendingClosure) return;

    const reason = document.getElementById('closure-reason').value;
    if (!reason) {
        showToast('Closure reason is required', 'warning');
        return;
    }

    const notes = document.getElementById('closure-notes').value.trim();
    const caseId = pendingClosure.caseId;
    const targetStatus = pendingClosure.targetStatus;

    // await the PATCH and only hide the modal + clear pendingClosure
    // when it succeeds. If the PATCH errors (e.g., server returns 400 on a
    // bad closure_reason, or a 5xx), the modal stays open so the analyst
    // can fix the issue and retry, instead of silently losing the close
    // intent and leaving the dropdown stuck on "closed" with no real close
    // on the server.
    const ok = await updateCaseStatus(caseId, targetStatus, reason, notes);
    if (ok) {
        document.getElementById('closure-modal-overlay').style.display = 'none';
        pendingClosure = null;
    }
}

function cancelClosure() {
    // reset the panel's status <select> back to the case's actual
    // status. Without this, the select stays stuck on "closed" after
    // cancel, and a subsequent re-pick of "closed" does NOT fire onchange
    // (same-value transitions don't dispatch). That bug presented as
    // "closing via dropdown sometimes does nothing" — the user thought
    // they were starting a new close, but the browser ignored the click.
    //
    // the panel's selects no longer carry an inline onchange=
    // attribute (CSP migration); they carry data-args='[caseId,"field","$value"]'
    // instead. Match the status select by parsing that.
    if (pendingClosure) {
        const caseObj = allCases.find(c => c.id === pendingClosure.caseId);
        if (caseObj) {
            // Reset both the panel's status select AND the board widget's
            // per-widget status select back to the case's real status, so a
            // cancelled close doesn't leave either dropdown stuck on "closed"
            // (a same-value re-pick wouldn't re-fire change).
            document.querySelectorAll('.cpanel-meta-grid select, .cw-status-select').forEach(sel => {
                let parsed = null;
                try { parsed = JSON.parse(sel.getAttribute('data-args') || ''); }
                catch (e) { /* not our select */ }
                if (Array.isArray(parsed) && parsed[0] === pendingClosure.caseId && parsed[1] === 'status') {
                    sel.value = caseObj.status;
                }
            });
        }
    }
    document.getElementById('closure-modal-overlay').style.display = 'none';
    pendingClosure = null;
}

/* Outbound sync health for one case.

   Every Kibana/IRIS mirror used to fail into a log line, so this panel
   showed a case whose notes ION believed were mirrored and were not. The
   journal makes each failure a durable row; this surfaces it where the
   analyst is already looking. "Still retrying" and "given up" are shown
   separately because they call for different actions. */
async function loadCaseSyncStatus(caseId) {
    return ionLoadFragment('/ui/cases/' + encodeURIComponent(caseId) + '/sync-status', 'case-sync-status', 'Loading sync status...', {failure:'Sync status could not be read. Counts are unknown.'});
}

// GET /ui/cases/{id}/panel renders the panel. The ten lazy sections still
// load from here after it paints.
//
// The /api/cases/{id} read stays, for its data rather than its markup.
// _railAlerts needs the full alert objects, because selectCaseAlert hands
// one to the shared alert-detail component without a refetch, and
// loadResponseActions needs c.observables.
//
// What it no longer does is derive the rail's order. renderPanelContent
// sorted c.alerts in place so that reading c.alerts[0] here agreed with
// the rail; the fragment decides the order now and names the first one in
// data-first-alert-id, so the two cannot disagree.
//
// The old catch wrapped renderPanelContent, applyConfidenceMeters,
// switchPanelTab and selectCaseAlert together, and its own comment
// admitted a throw in any of them landed indistinguishably on a request
// that returned 200. A render failure is a 500 with a traceback now.
async function openCaseDetail(caseId) {
    // The case view lives at its own URL. Outside page mode this function is
    // reached from list cards, attention rows, SLA rows and related-case
    // links -- all of them navigate; only /cases/{id} renders in place.
    const panelEl = document.getElementById('case-panel');
    if (!panelEl.classList.contains('page-mode')) {
        window.location.assign('/cases/' + caseId);
        return;
    }
    if (window.history && String(window.__initialCaseId) !== String(caseId)) {
        window.history.replaceState(null, '', '/cases/' + caseId);
        window.__initialCaseId = caseId;
    }
    const panel = document.getElementById('case-panel');
    const body = document.getElementById('case-panel-body');

    panel.classList.add('open');

    await htmx.ajax('GET', '/ui/cases/' + caseId + '/panel', {
        source: body, target: body, swap: 'innerHTML',
    });
    renderCaseMarkdown(body);
    applyConfidenceMeters(body);
    // Re-apply the active tab after each render so a status or severity
    // change does not bump the analyst back to the first tab.
    switchPanelTab(_currentPanelTab);

    let c = null;
    try {
        const resp = await fetch('/api/cases/' + caseId);
        if (resp.ok) c = await resp.json();
    } catch (e) {
        console.error('openCaseDetail(' + caseId + ') state read failed:', e);
    }
    if (!c) return;

    document.getElementById('panel-case-number').textContent = c.case_number || '';
    document.getElementById('panel-case-title').textContent = c.title || '';
    // Stash the open case id on the panel so a later status change can
    // identify the case the panel is on without going through allCases,
    // which may be momentarily empty during a reload.
    panel.dataset.caseId = String(c.id);

    (c.alerts || []).forEach(function (a) {
        _railAlerts[a.es_alert_id || 'unknown'] = a;
    });

    // Which alert the rail selected, read from the rail rather than from a
    // second guess at the sort.
    const workspace = body.querySelector('.cpanel-workspace');
    const firstAlertId = workspace && workspace.dataset.firstAlertId;
    if (firstAlertId) {
        selectCaseAlert(firstAlertId, 0, c.id);
    }

    if (c.kibana_case_id) loadKibanaComments(c.kibana_case_id);
    loadCaseTimeline(c.id);
    loadResponseActions(c.id, c.observables || []);
    loadAttackPath(c.id);
    loadSimilarCases(c.id);
    loadSimilarObservables(c.id);
    loadWorkbench(c.id);
    loadAnnotations(c.id);
    // Failed outbound sync, shown beside the case it affects rather than
    // left in a log line (review 2026-10-08, stage 3).
    loadCaseSyncStatus(c.id);
}

// ── Priority / status colors ───────────────────────────────
const priorityColors = {

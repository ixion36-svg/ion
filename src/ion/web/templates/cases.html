// the case-detail alert workspace.
// Alerts keyed by es_alert_id, stashed while the panel renders so selecting a
// row in the rail can hand the whole alert object straight to the shared
// component with no refetch.
const _railAlerts = {};
let _selectedRailAlert = null;

/**
 * Render one of the case's alerts into the right-hand column, using the SAME
 * component /alerts uses — in its stacked layout, so every section is open.
 *
 * This is the click that replaced eight: parsed fields, rule guide and process
 * tree used to be three separate accordions, on top of the panel's own tabs.
 */
function selectCaseAlert(alertId, idx, caseId) {
    const alert = _railAlerts[alertId];
    const host = document.getElementById('cpanel-alert-workspace');
    if (!alert || !host) return;

    document.querySelectorAll('.cpanel-rail-alert').forEach(el => el.classList.remove('selected'));
    const row = document.getElementById('rail-alert-' + idx);
    if (row) row.classList.add('selected');
    _selectedRailAlert = alertId;

    if (typeof window.ionAlertDetail === 'undefined') {
        host.replaceChildren(ionCaseTpl('tpl-alert-detail-failed'));
        return;
    }

    // The alert rows the case API returns use es_alert_id; the shared component
    // (and every /api/elasticsearch/alerts/... endpoint it calls) expects `id`.
    // Normalising here rather than inside the component keeps the component's
    // contract identical for both pages.
    const forDetail = Object.assign({}, alert, {
        id: alertId,
        title: alert.rule_name || alert.title || String(alertId).substring(0, 24)
    });

    // Tabs load on demand: two requests on open rather than nine. The triage
    // bar is omitted because its loader lives in alerts.html and nothing here
    // fills it; case status and notes are in the case panel above.
    window.ionAlertDetail.mount(host, forDetail, {
        layout: 'tabs',
        sections: ['related', 'timeline', 'comments', 'sequence', 'autoinvestigate', 'fields', 'rawdata'],
        triageBar: false,
        aiAvailable: true,
        discussEnabled: false,
        arkimeEnabled: !!window.__ionArkimeEnabled,
        detailV2: document.querySelector('[data-alert-detail-v2]')?.dataset.alertDetailV2 === '1',
        fieldPins: document.querySelector('[data-alert-field-pins]')?.dataset.alertFieldPins === '1',
        bobTemplates: document.querySelector('[data-bob-templates]')?.dataset.bobTemplates === '1',
        classPrefix: 'cpanel-alert',
        caseId: caseId
    });

    // Case-only extras the shared component has no business knowing about:
    // pinning this alert as case evidence, and the two lazy panels that used to
    // be accordions. They append as further stacked sections.
    _appendCaseOnlySections(host, alertId, caseId, alert);
}

// The guide's three sections are tpl-alert-guide. They were a string with
// two generated ids in it, and the pin button's arguments went through
// esc() into a single-quoted data-args:
//
//   data-args='[' + caseId + ',"' + esc(alertId) + '","'
//           + esc(pinTitle) + '","' + esc(pinSev) + '"]'
//
// esc turns a double quote into &quot;, which is right for an attribute
// and wrong for JSON inside one: the parser decodes it back and the array
// ends early, so a rule name containing a quote truncated the button's
// arguments. The playbook Start button had the identical bug.
//
// Setting dataset.args from JSON.stringify removes the question: a DOM
// property assignment stores the value literally, with no HTML escaping
// between the JSON and the handler that parses it.
function _appendCaseOnlySections(host, alertId, caseId, alert) {
    const rgId = 'rule-guide-' + _railSeq;
    const ptId = 'proc-tree-' + _railSeq;
    _railSeq += 1;

    const node = ionCaseTpl('tpl-alert-guide');
    node.querySelector('[data-rule-guide]').id = rgId;
    node.querySelector('[data-proc-tree]').id = ptId;
    node.querySelector('.cpanel-pin-btn').dataset.args = JSON.stringify([
        caseId,
        alertId,
        alert.rule_name || String(alertId).substring(0, 24),
        alert.priority || '',
    ]);

    // Replaces the previous alert's guide, so selecting a second alert
    // does not leave the first one's sections behind. Falls back to the
    // detail column when the side panel is absent.
    const aside = document.getElementById('cpanel-alert-guide');
    if (aside) {
        aside.replaceChildren(node);
    } else {
        host.appendChild(node);
    }

    // Shares the component's coalesced /raw request -- no extra round trip.
    if (typeof loadRuleGuideInto === 'function') loadRuleGuideInto(alertId, rgId);
    if (typeof loadProcessTreeInto === 'function') loadProcessTreeInto(alertId, ptId, caseId);
}
let _railSeq = 0;

// Flatten a nested alert _source into dot-path key:value pairs (arrays of
// scalars are joined; arrays of objects are indexed).
// the linked-alert parsed-fields dropdown lived here: flattenAlertFields,
// _alertFieldsTable, _extractedValuesBlock, renderFlatAlertFields,
// toggleAllAlertFields, addFieldsAsEvidence, toggleAlertFields.
//
// All seven are gone. The first three were verbatim copies of functions in
// alerts.html (the copies had already drifted apart on class names), and the
// dropdown they powered is now the shared component's "Fields" section, open by
// default rather than behind a toggle. static/js/alert-detail.js owns them and
// exposes flattenAlertFields globally, which is what renderRuleGuide below
// still calls.


// ── Rule guide ──────────────────────────────────────────────────────────────
// Surfaces the detection rule's description + investigation guide (Kibana rule
// `note`, markdown) to the analyst — the same context now fed to Bob. The guide
// is rendered through safeMarkdown (marked + DOMPurify); description is esc()'d.
function renderRuleGuide(raw) {
    const flat = (typeof flattenAlertFields === 'function') ? flattenAlertFields(raw) : (raw || {});
    const desc = flat['kibana.alert.rule.description'] || flat['signal.rule.description']
        || flat['rule.description'] || '';
    const guide = flat['kibana.alert.rule.note'] || flat['kibana.alert.rule.parameters.note']
        || flat['signal.rule.note'] || flat['rule.note'] || '';
    if (!desc && !guide) {
        return '<div class="cpanel-alert-fields-empty">No rule description or investigation guide on this alert.</div>';
    }
    let h = '';
    if (desc) h += '<div class="cpanel-rule-desc">' + esc(String(desc)) + '</div>';
    if (guide) {
        const md = (typeof safeMarkdown === 'function') ? safeMarkdown(String(guide)) : esc(String(guide));
        h += '<div class="cpanel-rule-guide-label">Investigation guide</div>'
           + '<div class="cpanel-note-markdown cpanel-rule-guide">' + md + '</div>';
    }
    return h;
}

async function loadRuleGuideInto(alertId, rgId) {
    const el = document.getElementById(rgId);
    if (!el || el.dataset.loaded === '1') return;
    let raw = null;
    let state = 'failed';
    try {
        if (typeof window.ionAlertDetailFetchRaw === 'function') {
            raw = await window.ionAlertDetailFetchRaw(alertId);
        } else {
            const response = await fetch('/api/elasticsearch/alerts/' + encodeURIComponent(alertId) + '/raw');
            if (!response.ok) throw new Error('Raw alert read failed');
            raw = (await response.json()).raw_data;
        }
        state = raw ? 'data' : 'empty';
    } catch (error) { state = 'failed'; }
    const loaded = await ionLoadFragment('/ui/cases/detail/rule-guide', el, 'Loading rule guide...', {
        method:'POST', values:{state,raw:JSON.stringify(raw)}, failure:'Failed to load rule guide.'
    });
    if (!loaded) return;
    const markdown = el.querySelector('[data-case-rule-markdown]');
    const guide = el.querySelector('[data-case-rule-guide]');
    if (markdown && guide) {
        if (typeof safeMarkdown === 'function') {
            const parsed = new DOMParser().parseFromString(safeMarkdown(markdown.value), 'text/html');
            guide.replaceChildren(...parsed.body.childNodes);
        } else { guide.textContent = markdown.value; }
        markdown.remove();
    }
    if (el.querySelector('[data-case-rule-state]')?.dataset.caseRuleState !== 'failed') el.dataset.loaded = '1';
}


// ── Process explorer ────────────────────────────────────────────────────────
// Renders the alert-local process hierarchy (grandparent → parent → THIS ALERT)
// returned by /api/elasticsearch/alerts/{id}/process-tree. ION queries the
// alerts index only, so depth is bounded by the alert doc; truncated_ancestors
// reports how many earlier ancestors exist by entity-id but aren't named here.
// Command lines stashed by key so the Copy action never has to round-trip
// quote-heavy text through a data-* attribute.
const _procCmdById = {};

function _procNodeHtml(n, idx, isChild, caseId) {
    let cls = 'cpanel-proc-node';
    if (n.is_alert) cls += ' is-alert';
    if (isChild || n.role === 'child') cls += ' is-child';
    const roleLabel = n.is_alert ? 'this alert'
        : (n.role === 'grandparent' ? 'ancestor'
        : (n.role === 'child' ? 'child' : (n.role || 'process')));
    const meta = [];
    if (n.pid !== null && n.pid !== undefined && n.pid !== '') meta.push('PID ' + esc(String(n.pid)));
    if (n.user) meta.push(esc(String(n.user)));
    let h = '<div class="' + cls + '">';
    h += '<div class="cpanel-proc-node-head">';
    if (idx > 0) h += '<i class="icon-corner-down-right cpanel-proc-branch"></i>';
    h += '<i class="icon-cpu cpanel-proc-ic"></i>';
    h += '<span class="cpanel-proc-name">' + esc(n.name || n.executable || '(unknown)') + '</span>';
    h += '<span class="cpanel-proc-role">' + esc(roleLabel) + '</span>';
    if (meta.length) h += '<span class="cpanel-proc-meta">' + meta.join(' &middot; ') + '</span>';
    // Node actions: pin the process as case evidence, copy its command line.
    const acts = [];
    if (caseId) {
        const label = n.name || n.executable || 'process';
        const pinTitle = ('Process: ' + label + (n.pid != null && n.pid !== '' ? ' (PID ' + n.pid + ')' : ''))
            .replace(/["'\\]/g, '');
        acts.push('<button type="button" class="cpanel-proc-act" title="Pin as case evidence" '
            + 'data-click-action="pinProcessToCase" data-args=\'[' + caseId + ',"' + esc(pinTitle) + '"]\'>'
            + '<i class="icon-bookmark"></i></button>');
    }
    if (n.command_line) {
        const key = 'pc-' + (isChild ? 'c' : 'n') + '-' + idx;
        _procCmdById[key] = String(n.command_line);
        acts.push('<button type="button" class="cpanel-proc-act" title="Copy command line" '
            + 'data-click-action="copyProcCmd" data-args=\'["' + key + '"]\'>'
            + '<i class="icon-copy"></i></button>');
    }
    if (acts.length) h += '<span class="cpanel-proc-actions">' + acts.join('') + '</span>';
    h += '</div>';
    if (n.command_line) h += '<div class="cpanel-proc-cmd">' + esc(String(n.command_line)) + '</div>';
    h += '</div>';
    return h;
}

function renderProcessTree(data, caseId) {
    if (!data || !data.available || !((data.nodes || []).length)) {
        return '<div class="cpanel-alert-fields-empty">No process context on this alert.</div>';
    }
    let h = '';
    const tr = data.truncated_ancestors || 0;
    if (tr > 0) {
        h += '<div class="cpanel-proc-trunc">+' + tr + ' earlier ancestor'
           + (tr !== 1 ? 's' : '') + ' (entity IDs only — not in alert data)</div>';
    }
    data.nodes.forEach((n, i) => { h += _procNodeHtml(n, i, false, caseId); });
    const kids = data.children || [];
    if (kids.length) {
        const base = data.nodes.length;
        kids.forEach((c, j) => { h += _procNodeHtml(c, base + j, true, caseId); });
    }
    return h;
}

// Toggle (and lazy-load) a linked alert's process tree. No leading event param
// (event-delegation.js applies data-args directly).
async function loadProcessTreeInto(alertId, ptId, caseId) {
    const el = document.getElementById(ptId);
    if (!el || el.dataset.loaded === '1') return;
    const query = caseId ? '?' + new URLSearchParams({case_id:caseId}) : '';
    const loaded = await ionLoadFragment('/ui/cases/detail/process-tree/' + encodeURIComponent(alertId) + query, el, 'Loading process tree...', {failure:'Failed to load process tree.'});
    if (!loaded) return;
    const carrier = el.querySelector('[data-case-process-commands]');
    if (!carrier) return;
    Object.assign(_procCmdById, JSON.parse(carrier.dataset.caseProcessCommands));
    if (carrier.dataset.caseProcessState !== 'failed' || carrier.dataset.caseProcessUnavailable === 'true') el.dataset.loaded = '1';
}


// Pin a process node to the case workbench as evidence (reuses the pins API).
async function pinProcessToCase(caseId, title) {
    try {
        const resp = await fetch('/api/alert-cases/' + caseId + '/pins', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source_type: 'note', source_ref: '', title: title, severity: null }),
        });
        if (!resp.ok) throw new Error('pin failed');
        if (typeof loadWorkbench === 'function') loadWorkbench(caseId);
        if (typeof showToast === 'function') showToast('Pinned process as evidence');
    } catch (e) {
        if (typeof showToast === 'function') showToast('Pin failed', 'error');
        else alert('Pin failed');
    }
}

// Copy a process node's command line to the clipboard.
function copyProcCmd(key) {
    const cmd = _procCmdById[key];
    if (!cmd) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cmd).then(
            () => { if (typeof showToast === 'function') showToast('Command line copied'); },
            () => { if (typeof showToast === 'function') showToast('Copy failed', 'error'); }
        );
    }
}

// Apply the confidence-meter widths after the panel HTML is inserted
// (CSSOM, not an inline style attribute — the strict CSP blocks the latter).
function applyConfidenceMeters(root) {
    (root || document).querySelectorAll('.awx-fillb[data-pct]').forEach(el => {
        el.style.width = (parseFloat(el.getAttribute('data-pct')) || 0) + '%';
    });
}

// The one thing that could not move to the server: these render markdown,
// and ui/template_render.py records why it stays here -- ION has no HTML
// sanitiser in its dependencies. The fragment sends the raw text in
// data-note-raw and this renders it.
//
// Through DOMPurify's RETURN_DOM_FRAGMENT and replaceChildren rather than
// innerHTML, so the one unavoidable client render is not a runtime write
// and a stylesheet sweep still reaches the markup around it.


function renderCaseMarkdown(root) {
    (root || document).querySelectorAll('[data-note-raw]').forEach(function (el) {
        const raw = el.getAttribute('data-note-raw') || '';
        // safeMarkdownFragment is in app.js, with the policy. This used to
        // call DOMPurify.sanitize here. It did pass ION_SANITIZE_CONFIG, so
        // it was not a bypass, but it was a second place assembling the
        // policy, and test_ithc_hardening holds the invariant that there is
        // one: a bare sanitize() loses FORBID_ATTR, and an attacker-set id
        // is a DOM-clobbering primitive on a stored cross-user case note.
        const fragment = (typeof safeMarkdownFragment === 'function')
            ? safeMarkdownFragment(raw) : null;
        // Null means it could not sanitise, so the raw text is shown as
        // text. Never as markup.
        if (fragment) el.replaceChildren(fragment); else el.textContent = raw;
    });
}

// ── Load Similar Cases (pgvector-backed) ──────────────────
// GET /ui/cases/{id}/similar renders the cards. The panel lives in the
// detail body, which this page still builds as a string, so the fragment is
// fetched with htmx.ajax rather than an hx-get the container would need
// htmx to have processed. Same shape as the 44 call sites on /alerts.
//
// What moved to the server, beyond the markup: a payload that is not the
// expected shape now reads as "Similarity unavailable" rather than "No
// similar closed cases yet", a row with no similarity says so instead of
// printing 0%, the closure colours are in cases-page.css where a theme can
// reach them, data-args goes through tojson, and the case number is no
// longer a javascript: href that this CSP blocks.
function loadSimilarCases(caseId) {
    const container = document.getElementById('similar-cases-container');
    if (!container) return Promise.resolve();
    return htmx.ajax('GET', '/ui/cases/' + encodeURIComponent(caseId) + '/similar', {
        source: container, target: container, swap: 'innerHTML',
    });
}

// ═════════════════════════════════════════════════════════
// Attack Path (Bob Pathfinding) — Phase 1 kill-chain graph
// ─────────────────────────────────────────────────────────
// Renders the deterministic Phase-0 endpoint
//   GET /api/cases/{id}/attack-path   (case:read)
// as a tactic-laned left→right DAG. Lanes = phases[] in rank order (MITRE
// kill-chain recon→impact); each node card sits in the earliest phase whose
// node_ids contains it, bordered by threat_level (reusing the --sev-* tokens).
// Edges are an absolutely-positioned <svg> overlay whose coordinates are
// computed from each card's getBoundingClientRect AFTER layout, coloured by
// edge type with a per-type arrowhead marker. All geometry is set via
// setAttribute (no inline style= — strict CSP); colours come from CSS classes
// that resolve --tokens. Redrawn on ResizeObserver + when the tab is shown.
//
// DOM-id / class contracts:
//   #attack-path-container   the section body loadAttackPath() paints into
//   .apg-graph               position:relative scroll container (edge coords
//                            are computed relative to this element)
//   .apg-svg                 the connector overlay (first child of .apg-graph)
//   .apg-node[data-apg-node] one card per node; data-apg-node = node id, the
//                            key drawAttackPathEdges() joins edges on
//   _apgState                module-level { redraw } handle switchPanelTab and
//                            the ResizeObserver call to repaint edges

// Edge type → CSS suffix (colour + arrowhead marker are keyed off this).
const _APG_EDGE_TYPES = ['process_lineage', 'network_flow', 'auth_presence', 'shared_observable'];
// Node type → short glyph label shown on the card.

// Module-level handle so switchPanelTab / ResizeObserver can trigger a repaint
// without re-fetching. Reset on every load.
let _apgState = { redraw: null, ro: null };


// GET /ui/cases/{id}/attack-path renders the stats strip, the legend and
// the lanes. Only the edge overlay stays here: drawAttackPathEdges places
// each curve from getBoundingClientRect and the graph's scroll offsets,
// so it needs a laid-out DOM, and it draws SVG with createElementNS
// rather than markup, so there is nothing in it a stylesheet sweep could
// reach.
//
// `data.nodes || []` then `if (nodes.length === 0)` rendered "No attack
// path derived yet" for a 200 whose body was the wrong shape. The HTTP
// failures were handled; that one was not, and it is the sentence that
// says this case has no established chain of activity.
//
// The edges ride back on .apg-graph in data-apg-edges, so the overlay
// does not fetch them again. An edge missing an endpoint is already
// dropped server side, which is what this function would do anyway, for
// the right reason: skip, never fabricate.
async function loadAttackPath(caseId) {
    const container = document.getElementById('attack-path-container');
    if (!container) return;
    // Tear down any prior ResizeObserver from a previously-open case.
    if (_apgState.ro) { try { _apgState.ro.disconnect(); } catch (e) {} }
    _apgState = { redraw: null, ro: null };

    await htmx.ajax('GET', '/ui/cases/' + caseId + '/attack-path', {
        source: container, target: container, swap: 'innerHTML',
    });

    const graph = container.querySelector('.apg-graph');
    if (!graph) return;

    let edges = [];
    try { edges = JSON.parse(graph.dataset.apgEdges || '[]'); }
    catch (e) { edges = []; }

    const cardMap = {};
    graph.querySelectorAll('.apg-node[data-apg-node]').forEach(function (el) {
        cardMap[el.getAttribute('data-apg-node')] = el;
    });

    const redraw = function () { drawAttackPathEdges(graph, edges, cardMap); };
    _apgState.redraw = redraw;
    // First paint on rAF so layout has settled. If the tab is hidden the
    // rects are zero and switchPanelTab repaints on reveal.
    requestAnimationFrame(redraw);

    if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(function () { requestAnimationFrame(redraw); });
        ro.observe(graph);
        _apgState.ro = ro;
    }
}

function drawAttackPathEdges(graph, edges, cardMap) {
    if (!graph) return;
    const SVG_NS = 'http://www.w3.org/2000/svg';
    // Remove a previous overlay before redrawing.
    const prev = graph.querySelector('.apg-svg');
    if (prev) prev.remove();

    const gRect = graph.getBoundingClientRect();
    const w = Math.max(graph.scrollWidth, graph.clientWidth);
    const h = Math.max(graph.scrollHeight, graph.clientHeight);
    if (w === 0 || h === 0) return; // tab hidden — nothing laid out yet

    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'apg-svg');
    svg.setAttribute('width', String(w));
    svg.setAttribute('height', String(h));
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);

    // One arrowhead marker per edge type (coloured via CSS class on the path).
    const defs = document.createElementNS(SVG_NS, 'defs');
    _APG_EDGE_TYPES.forEach(function (t) {
        const marker = document.createElementNS(SVG_NS, 'marker');
        marker.setAttribute('id', 'apg-arrow-' + t);
        marker.setAttribute('markerWidth', '8');
        marker.setAttribute('markerHeight', '8');
        marker.setAttribute('refX', '7');
        marker.setAttribute('refY', '3');
        marker.setAttribute('orient', 'auto');
        marker.setAttribute('markerUnits', 'userSpaceOnUse');
        const tri = document.createElementNS(SVG_NS, 'path');
        tri.setAttribute('d', 'M0,0 L7,3 L0,6 Z');
        tri.setAttribute('class', 'apg-mk apg-mk-' + t);
        marker.appendChild(tri);
        defs.appendChild(marker);
    });
    svg.appendChild(defs);

    // Content-box coordinate of a card (top-left), scroll-compensated.
    function pos(el) {
        const r = el.getBoundingClientRect();
        return {
            x: r.left - gRect.left + graph.scrollLeft,
            y: r.top - gRect.top + graph.scrollTop,
            w: r.width,
            h: r.height,
        };
    }

    (edges || []).forEach(function (e) {
        const s = cardMap[e.source];
        const t = cardMap[e.target];
        if (!s || !t) return; // endpoint not rendered — skip, never fabricate
        const ps = pos(s);
        const pt = pos(t);
        // Source: right-edge centre. Target: left-edge centre. For same-lane
        // or backward edges the cubic control points still yield a clean arc.
        const x1 = ps.x + ps.w;
        const y1 = ps.y + ps.h / 2;
        const x2 = pt.x;
        const y2 = pt.y + pt.h / 2;
        const dx = Math.max(28, Math.abs(x2 - x1) / 2);
        const type = _APG_EDGE_TYPES.indexOf(e.type) >= 0 ? e.type : 'shared_observable';
        const path = document.createElementNS(SVG_NS, 'path');
        path.setAttribute('d', 'M' + x1 + ',' + y1
            + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2);
        path.setAttribute('class', 'apg-edge apg-edge-' + type);
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#apg-arrow-' + type + ')');
        // The fragment resolves this from the legend table,
        // which moved there with the legend markup.
        const lbl = e.label || e.type;
        if (lbl) {
            const titleEl = document.createElementNS(SVG_NS, 'title');
            titleEl.textContent = String(lbl);
            path.appendChild(titleEl);
        }
        svg.appendChild(path);
    });

    // Insert as first child so cards (z-index above) stay clickable/legible.
    graph.insertBefore(svg, graph.firstChild);
}

// ── v0.10.20: Load Attack Story Timeline ─────────────────
// GET /ui/cases/{id}/timeline renders the feed, the counts strip and Bob's
// narrative header. Fetched with htmx.ajax because the container is built
// by renderPanelContent as a string, so htmx has never processed it.
//
// What moved to the server, beyond the markup: a payload that is not the
// expected shape reads "Timeline unavailable" rather than "No events yet";
// a count the payload did not carry says unknown instead of 0; the
// timestamp is formatted from the naive UTC column and labelled UTC, where
// `new Date(iso).toLocaleString()` silently presented it in the viewer's
// zone; an event of an unrecognised kind says UNKNOWN instead of SYSTEM; a
// verdict the build does not know is no longer painted "inconclusive"; and
// a citation value of 0 survives `(c.value || '')`.
function loadCaseTimeline(caseId) {
    const container = document.getElementById('case-timeline-container');
    if (!container) return Promise.resolve();
    return htmx.ajax('GET', '/ui/cases/' + encodeURIComponent(caseId) + '/timeline', {
        source: container, target: container, swap: 'innerHTML',
    });
}


// ── v0.10.19: Load Cross-Case Observable Sightings ────────
// GET /ui/cases/{id}/similar-observables renders the indicators and the
// other cases carrying them. htmx.ajax because renderPanelContent builds
// the container as a string, so htmx has never processed it.
//
// What moved to the server, beyond the markup: a payload that is not the
// expected shape reads unavailable rather than "no matches"; one row
// without a readable observable is skipped instead of throwing into the
// single catch and taking the whole panel with it; a missing sighting
// count says so rather than claiming 1x; data-args goes through tojson;
// and the case number is no longer a javascript: href the CSP blocks.
function loadSimilarObservables(caseId) {
    const container = document.getElementById('similar-observables-container');
    if (!container) return Promise.resolve();
    return htmx.ajax('GET', '/ui/cases/' + encodeURIComponent(caseId) + '/similar-observables', {
        source: container, target: container, swap: 'innerHTML',
    });
}

// ── Load Kibana Comments ───────────────────────────────────
async function loadKibanaComments(kibanaId) {
    const container = document.getElementById('kibana-comments-container');
    if (!container) return;
    const token = {};
    container._ionCommentsRequest = token;
    const loaded = await ionLoadFragment('/ui/cases/kibana/' + encodeURIComponent(kibanaId) + '/comments', container, 'Loading Kibana comments...', {failure:'Could not load Kibana comments'});
    if (container._ionCommentsRequest !== token) return;
    if (!loaded) {
        const badge = document.getElementById('kibana-comment-count');
        if (badge) badge.textContent = '-';
    }
}

// panel tab state. Persisted across panel re-renders (e.g.
// panelUpdateField → openCaseDetail) so changing severity / status
// doesn't bump the analyst back to Overview. Reset on panel close.
// default tab is Alerts. Opening a case to a metadata form was a
// wasted click — the analyst came to look at the alerts.
let _currentPanelTab = 'alerts';

// ── Response Actions (Phase 1) ─────────────────────────────
// Observable type → applicable response action_types (mirrors DEFAULT_ACTIONS).
const _RESPONSE_APPLIES = {
    ip: ['block_ip'], ipv4: ['block_ip'], ipv6: ['block_ip'],
    domain: ['block_domain'], url: ['block_domain'],
    user: ['disable_account', 'reset_password'], username: ['disable_account', 'reset_password'],
    host: ['quarantine_host'], hostname: ['quarantine_host'],
    email: ['block_sender']
};

async function loadResponseActions(caseId, observables) {
    const container = document.getElementById('response-actions-container');
    if (!container) return;
    const loaded = await ionLoadFragment('/ui/cases/' + caseId + '/response-actions', container, 'Loading response actions...', {
        method:'POST', values:{observables:JSON.stringify(observables ?? null)}, failure:'Could not load response actions.'
    });
    if (!loaded) return;
    const state = container.querySelector('[data-response-actions-state]')?.dataset.responseActionsState;
    if (state === 'disabled') {
        document.getElementById('cpanel-actions-tab-btn')?.remove();
        container.closest('.cpanel-section[data-tab="actions"]')?.remove();
        return;
    }
    if (state === 'data' || state === 'empty') return loadResponseActionLog(caseId);
}

async function loadResponseActionLog(caseId) {
    return ionLoadFragment('/ui/cases/' + caseId + '/response-log', 'response-actions-log', 'Loading action log...', {failure:'Could not load action log.'});
}

async function requestResponseAction(actionId, target, caseId) {
    try {
        const r = await fetch('/api/response/actions/request', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action_id: actionId, target: target, case_id: caseId })
        });
        if (!r.ok) {
            const d = await r.json().catch(function () { return {}; });
            window.alert('Request failed: ' + (d.detail || r.status));
            return;
        }
        loadResponseActionLog(caseId);
    } catch (e) { window.alert('Request failed: ' + e.message); }
}

function switchPanelTab(tabName) {
    _currentPanelTab = tabName;
    if (applyPageModeLayout()) return;
    document.querySelectorAll('.cpanel-tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === tabName);
    });
    document.querySelectorAll('.cpanel-section[data-tab]').forEach(s => {
        s.classList.toggle('tab-hidden', s.dataset.tab !== tabName);
    });

    // the Alerts tab hosts the two-column workspace, which scrolls its
    // own columns. The body must drop its own scroll+padding for that tab or
    // the analyst gets two nested scrollbars.
    const body = document.getElementById('case-panel-body');
    if (body) body.classList.toggle('workspace-mode', tabName === 'alerts');
    // The Attack Path SVG connectors are laid out from getBoundingClientRect,
    // which returns zeroes while the section is display:none. Redraw once the
    // tab is actually visible so edges land on their node cards.
    if (tabName === 'attackpath' && typeof _apgState !== 'undefined' && _apgState.redraw) {
        requestAnimationFrame(_apgState.redraw);
    }
}

// ── Page-mode window arrangement (after TIDE v6) ────────────────────────
// Every .cpanel-section is a movable, foldable, hideable unit in three
// columns. ONE arrangement is remembered for all cases
// (ion-case-window-layout-v1); sections a case does not have keep their
// saved place, so arranging a small case never forgets a fuller one.
// v2: alerts moved from the centre track to the full-width row, so saved v1
// layouts have to be dropped or they would pin it back into 609px.
const PM_LAYOUT_KEY = 'ion-case-window-layout-v2';
// `full` is a spanning row rather than a track, so it carries no width here;
// pmFitCols skips it when building grid-template-columns.
const PM_COL_WIDTHS = { left: 'minmax(230px,1fr)', centre: 'minmax(0,1.7fr)', right: 'minmax(220px,0.9fr)' };
// Alerts hosts a whole nested alert-detail view, which needs ~1100px before its
// own two-column layout stops collapsing. The centre track is ~609px on a
// 1600px viewport, so it gets the full-width row instead.
const PM_TAB_COL = { alerts: 'full', timeline: 'centre', attackpath: 'centre',
                     observables: 'left', overview: 'right', actions: 'right', notes: 'right' };
const PM_SLUG_COL = { 'similar-cases': 'left', 'workbench': 'left',
                      'observable-sightings': 'left' };
const PM_PRESETS = {
    triage: null,   // the defaults above
    dossier: function (key, tab) {
        if (tab === 'alerts') return 'full';
        return (tab === 'overview' || tab === 'actions' || tab === 'notes') ? 'right' : 'centre';
    },
    review: function (key, tab) {
        if (tab === 'alerts') return 'full';
        if (tab === 'timeline' || key === 'similar-cases' || tab === 'observables') return 'left';
        if (tab === 'overview' || tab === 'actions') return 'right';
        return 'centre';
    }
};

function pmReadLayout() {
    try { return JSON.parse(localStorage.getItem(PM_LAYOUT_KEY) || 'null'); }
    catch (_) { return null; }
}
function pmWriteLayout(v) {
    try { localStorage.setItem(PM_LAYOUT_KEY, JSON.stringify(v)); } catch (_) { /* blocked */ }
}

function pmKeyFor(sec, seen) {
    const t = sec.querySelector('.cpanel-section-title');
    let base = (t ? t.textContent : (sec.dataset.tab || 'section'))
        .replace(/\(.*?\)/g, '').replace(/[0-9]+/g, '')
        .trim().toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-+|-+$/g, '');
    if (!base) base = sec.dataset.tab || 'section';
    if (seen[base] != null) { seen[base] += 1; base = base + '-' + seen[base]; }
    else { seen[base] = 1; }
    return base;
}

function pmDefaultCol(key, tab) {
    return PM_SLUG_COL[key] || PM_TAB_COL[tab] || 'centre';
}

function pmSections(body) {
    return [...body.querySelectorAll('.pm-col > .cpanel-section[data-section]')];
}

function pmCurrentLayout(body) {
    const cols = {}, hidden = [], collapsed = [];
    body.querySelectorAll('.pm-col').forEach(col => {
        cols[col.dataset.col] = [...col.querySelectorAll(':scope > .cpanel-section')].map(sec => {
            const k = sec.dataset.section;
            if (sec.hidden) hidden.push(k);
            if (sec.classList.contains('pm-collapsed')) collapsed.push(k);
            return k;
        });
    });
    return { cols, hidden, collapsed };
}

// TIDE's merge: keys absent from THIS case keep their saved place and flags.
function pmSaveLayout(body) {
    const now = pmCurrentLayout(body);
    const saved = pmReadLayout();
    const present = {};
    Object.values(now.cols).forEach(list => list.forEach(k => { present[k] = true; }));
    if (saved && saved.cols) {
        Object.keys(saved.cols).forEach(c => {
            const list = now.cols[c] || (now.cols[c] = []);
            (saved.cols[c] || []).forEach((k, i) => {
                if (present[k] || list.includes(k)) return;
                const after = i > 0 ? list.indexOf(saved.cols[c][i - 1]) : -1;
                list.splice(after !== -1 ? after + 1 : Math.min(i, list.length), 0, k);
            });
        });
        (saved.hidden || []).forEach(k => { if (!present[k] && !now.hidden.includes(k)) now.hidden.push(k); });
        (saved.collapsed || []).forEach(k => { if (!present[k] && !now.collapsed.includes(k)) now.collapsed.push(k); });
    }
    pmWriteLayout(now);
}

function pmFitCols(body) {
    const widths = [];
    body.querySelectorAll('.pm-col').forEach(col => {
        const any = [...col.children].some(el =>
            el.classList.contains('cpanel-section') && !el.hidden);
        col.classList.toggle('pm-col--empty', !any && !_pmDragging);
        // The full-width row spans every track (grid-column: 1/-1) rather than
        // being one, so it must not contribute a width or the template would
        // gain a fourth, undefined track.
        if (col.dataset.col === 'full') return;
        if (any || _pmDragging) widths.push(PM_COL_WIDTHS[col.dataset.col]);
    });
    body.querySelector('.pm-cols').style.setProperty('--pm-cols', widths.join(' ') || '1fr');
}

function pmArrange(body, layout) {
    const byKey = {};
    pmSections(body).forEach(sec => { byKey[sec.dataset.section] = sec; });
    body.querySelectorAll('.pm-col').forEach(col => {
        ((layout.cols || {})[col.dataset.col] || []).forEach(k => {
            if (byKey[k]) { col.appendChild(byKey[k]); delete byKey[k]; }
        });
    });
    const hidden = layout.hidden || [], collapsed = layout.collapsed || [];
    pmSections(body).forEach(sec => {
        sec.hidden = hidden.includes(sec.dataset.section);
        sec.classList.toggle('pm-collapsed', collapsed.includes(sec.dataset.section));
    });
    pmFitCols(body);
}

function pmApplyPreset(body, name) {
    const fn = PM_PRESETS[name];
    pmSections(body).forEach(sec => {
        const col = fn ? fn(sec.dataset.section, sec.dataset.tab)
                       : pmDefaultCol(sec.dataset.section, sec.dataset.tab);
        body.querySelector('.pm-col[data-col="' + col + '"]').appendChild(sec);
        sec.hidden = false;
        sec.classList.remove('pm-collapsed');
    });
    pmFitCols(body);
    pmSaveLayout(body);
}

let _pmDragging = null;
const _pmMarker = (() => { const m = document.createElement('div'); m.className = 'pm-drop-marker'; return m; })();

function pmWireDrag(body) {
    body.addEventListener('dragstart', e => {
        const h = e.target.closest && e.target.closest('.pm-handle');
        if (!h) return;
        _pmDragging = h.closest('.cpanel-section');
        _pmDragging.classList.add('pm-dragging');
        body.querySelectorAll('.pm-col').forEach(c => c.classList.add('pm-col--drop'));
        pmFitCols(body);
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setDragImage(_pmDragging, 20, 14); } catch (_) { /* optional */ }
    });
    body.addEventListener('dragover', e => {
        if (!_pmDragging) return;
        const col = e.target.closest && e.target.closest('.pm-col');
        if (!col) return;
        e.preventDefault();
        const after = [...col.querySelectorAll(':scope > .cpanel-section:not(.pm-dragging)')]
            .find(sec => e.clientY < sec.getBoundingClientRect().top + sec.offsetHeight / 2);
        if (after) col.insertBefore(_pmMarker, after); else col.appendChild(_pmMarker);
    });
    body.addEventListener('drop', e => {
        if (!_pmDragging) return;
        e.preventDefault();
        if (_pmMarker.parentElement) _pmMarker.parentElement.insertBefore(_pmDragging, _pmMarker);
    });
    body.addEventListener('dragend', () => {
        if (!_pmDragging) return;
        _pmDragging.classList.remove('pm-dragging');
        _pmDragging = null;
        _pmMarker.remove();
        body.querySelectorAll('.pm-col').forEach(c => c.classList.remove('pm-col--drop'));
        pmFitCols(body);
        pmSaveLayout(body);
    });
}

function pmInjectHeaderTools(body) {
    const header = document.querySelector('.case-panel-header');
    if (!header || header.querySelector('.pm-tools')) return;
    const tools = document.createElement('span');
    tools.className = 'pm-tools';

    // prev / next case, from the already-loaded list order
    const mkNav = (label, delta, title) => {
        const b = document.createElement('button');
        b.className = 'pm-tool-btn';
        b.textContent = label;
        b.title = title;
        b.addEventListener('click', () => {
            const cur = String(window.__initialCaseId);
            const ids = (allCases || []).map(c => String(c.id));
            const i = ids.indexOf(cur);
            if (i === -1 || !ids.length) return;
            const next = ids[(i + delta + ids.length) % ids.length];
            if (next && next !== cur) window.location.assign('/cases/' + next);
        });
        return b;
    };
    tools.appendChild(mkNav('\u2190', -1, 'Previous case'));
    tools.appendChild(mkNav('\u2192', 1, 'Next case'));

    const btn = document.createElement('button');
    btn.className = 'pm-tool-btn';
    btn.textContent = 'Sections \u25BE';
    const menu = document.createElement('div');
    menu.className = 'pm-menu';

    function rebuild() {
        menu.textContent = '';
        const presets = document.createElement('div');
        presets.className = 'pm-preset-row';
        [['triage', 'Triage'], ['dossier', 'Dossier'], ['review', 'Review']].forEach(([k, label]) => {
            const pb = document.createElement('button');
            pb.className = 'pm-tool-btn';
            pb.textContent = label;
            pb.addEventListener('click', () => { pmApplyPreset(body, k); rebuild(); });
            presets.appendChild(pb);
        });
        menu.appendChild(presets);
        menu.appendChild(document.createElement('hr'));
        pmSections(body).forEach(sec => {
            const label = document.createElement('label');
            const box = document.createElement('input');
            box.type = 'checkbox';
            box.checked = !sec.hidden;
            box.addEventListener('change', () => {
                sec.hidden = !box.checked;
                pmFitCols(body);
                pmSaveLayout(body);
            });
            label.appendChild(box);
            const t = sec.querySelector('.cpanel-section-title');
            label.appendChild(document.createTextNode(
                (t ? t.textContent : sec.dataset.section).replace(/\s+/g, ' ').trim()));
            menu.appendChild(label);
        });
        menu.appendChild(document.createElement('hr'));
        const reset = document.createElement('button');
        reset.className = 'pm-reset';
        reset.textContent = 'Reset arrangement';
        reset.addEventListener('click', () => {
            try { localStorage.removeItem(PM_LAYOUT_KEY); } catch (_) { /* blocked */ }
            pmApplyPreset(body, 'triage');
            menu.classList.remove('pm-open');
        });
        menu.appendChild(reset);
    }
    btn.addEventListener('click', e => { e.stopPropagation(); rebuild(); menu.classList.toggle('pm-open'); });
    document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('pm-open'); });

    tools.appendChild(btn);
    tools.appendChild(menu);
    const close = header.querySelector('.case-panel-close');
    header.insertBefore(tools, close);
}

function applyPageModeLayout() {
    const panel = document.getElementById('case-panel');
    if (!panel.classList.contains('page-mode')) return false;
    const body = document.getElementById('case-panel-body');
    body.classList.remove('workspace-mode');
    body.querySelectorAll('.cpanel-section[data-tab]').forEach(sec => sec.classList.remove('tab-hidden'));

    if (!body.querySelector('.pm-cols')) {
        const grid = document.createElement('div');
        grid.className = 'pm-cols';
        ['left', 'centre', 'right', 'full'].forEach(c => {
            const col = document.createElement('div');
            col.className = 'pm-col';
            col.dataset.col = c;
            grid.appendChild(col);
        });

        const seen = {};
        body.querySelectorAll('.cpanel-section[data-tab]').forEach(sec => {
            const key = pmKeyFor(sec, seen);
            sec.dataset.section = key;
            // chrome: handle + fold on the existing title row
            const title = sec.querySelector('.cpanel-section-title');
            const head = document.createElement('div');
            head.className = 'pm-sec-head';
            const handle = document.createElement('button');
            handle.className = 'pm-handle';
            handle.textContent = '\u2261';
            handle.title = 'Drag to move this section';
            handle.draggable = true;
            head.appendChild(handle);
            if (title) head.appendChild(title);
            const fold = document.createElement('span');
            fold.className = 'pm-fold';
            fold.textContent = '\u25BC';
            head.appendChild(fold);
            const bodyWrap = document.createElement('div');
            bodyWrap.className = 'pm-sec-body';
            while (sec.firstChild) bodyWrap.appendChild(sec.firstChild);
            sec.appendChild(head);
            sec.appendChild(bodyWrap);
            head.addEventListener('click', e => {
                if (e.target.closest('button:not(.pm-handle), a, select, input')) return;
                if (e.target === handle) return;
                sec.classList.toggle('pm-collapsed');
                pmSaveLayout(body);
            });
            grid.querySelector('.pm-col[data-col="' + pmDefaultCol(key, sec.dataset.tab) + '"]')
                .appendChild(sec);
        });

        body.appendChild(grid);
        pmWireDrag(body);
        const saved = pmReadLayout();
        if (saved && saved.cols) pmArrange(body, saved); else pmFitCols(body);
        pmInjectHeaderTools(body);
    }

    // the attack path lays edges out from getBoundingClientRect, which is all
    // zeroes until the section is actually visible.
    if (typeof _apgState !== 'undefined' && _apgState.redraw) {
        requestAnimationFrame(_apgState.redraw);
    }
    return true;
}

async function panelUpdateField(caseId, field, value) {
    // If changing status to closed, require closure reason
    if (field === 'status' && value === 'closed') {
        pendingClosure = { caseId: caseId, targetStatus: value };
        document.getElementById('closure-modal-title').textContent = 'Close Case';
        document.getElementById('closure-reason').value = '';
        document.getElementById('closure-notes').value = '';
        resetClosureAiButton();
        document.getElementById('closure-modal-overlay').style.display = 'flex';
        return;
    }

    try {
        const body = {};
        // Coerce empty string → null, and integer-typed fields to int so the
        // PATCH endpoint's Pydantic validators accept the payload (the
        // assigned_to_id picker in particular sends string values from
        // <select>; PATCH expects Optional[int]).
        let coerced = value === '' || value == null ? null : value;
        if (field === 'assigned_to_id' && coerced != null) {
            coerced = parseInt(coerced, 10);
            if (Number.isNaN(coerced)) coerced = null;
        }
        body[field] = coerced;

        const resp = await fetch('/api/cases/' + caseId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });

        if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.detail || 'Update failed');
        }

        showToast('Case updated', 'success');
        await loadAllCases();
    } catch (e) {
        showToast('Failed to update: ' + e.message, 'error');
    }
}

// Translate any case note in place. Second click toggles back
// to the original rendered markdown. Stored on the element via data-*.
async function translateCaseNote(noteId) {
    const el = document.getElementById(noteId);
    if (!el) return;
    if (el.dataset.translated === '1' && el._ionNoteOriginal) {
        el.replaceChildren(...el._ionNoteOriginal.nodes.map(node => node.cloneNode(true)));
        el.dataset.translated = '0';
        return;
    }
    if (!el._ionNoteOriginal) {
        el._ionNoteOriginal = {raw:el.dataset.originalRaw || el.textContent,nodes:[...el.childNodes].map(node => node.cloneNode(true))};
    }
    if (!el._ionNoteOriginal.raw.trim()) return;
    const token = {};
    el._ionTranslationRequest = token;
    el.style.opacity = '0.6';
    try {
        const loaded = await ionLoadFragment('/ui/cases/note-translation', el, 'Translating...', {
            method:'POST', values:{text:el._ionNoteOriginal.raw,source:'auto',target:'en'}, failure:'Translation request failed.'
        });
        if (el._ionTranslationRequest !== token) return;
        const marker = el.querySelector('[data-note-translation]');
        const state = marker ? JSON.parse(marker.dataset.noteTranslation).state : 'failed';
        el.dataset.translated = loaded && state !== 'failed' ? '1' : '0';
        if (!loaded) el.textContent = '[translation failed: request could not be completed]';
    } finally {
        if (el._ionTranslationRequest === token) el.style.opacity = '';
    }
}

// GET /ui/cases/{id}/playbooks renders the browser and does the
// filtering, which is why an unreadable library and a filter that

// "No matching playbooks".
//
// `p.name.toLowerCase()` threw on a nameless playbook, inside the
// filter, so one bad row took the whole browser into the catch and the
// message then blamed the load. `p.description` on the same line was
// guarded. The failure colour was #f44336, a literal in a JavaScript
// string, which is a colour no stylesheet can reach.
function loadCasePlaybookBrowser(caseId, filter) {
    const panel = document.getElementById('case-playbook-browser-' + caseId);
    if (!panel) return;
    return htmx.ajax('GET', '/ui/cases/' + caseId + '/playbooks', {
        source: panel, target: panel, swap: 'innerHTML',
        values: filter ? { filter: filter } : {},
    });
}

    if (panel.style.display === 'block') {

// =============================================================================
// Workbench — pinned evidence + tamper-evident ledger
// =============================================================================
// All Workbench DOM lives inside cpanel-section#workbench-section-{caseId}
// so the openCaseDetail rerender (which replaces case-panel-body innerHTML)
// naturally tears it down — no listeners to clean up.

const WB_COLUMNS = [
    { key: 'triage',    label: 'Triage' },
    { key: 'confirmed', label: 'Confirmed' },
    { key: 'reported',  label: 'Reported' },
];

// GET /ui/cases/{id}/workbench renders the kanban. The verify banner
// stays here: it is a textContent write, it is already right, and a
// tamper check that could not be read must not read as verified.
//
// `pinsResp.ok ? (await pinsResp.json()).pins || [] : []` drew three
// columns each reading "no pins" when the read returned 403 or 500. The
// workbench is the case's evidence board and the ledger behind it is
// tamper-evident, so "nothing has been pinned" is a claim about an
// investigation, and it was being made on a failed read.
//
// A pin whose finding_status is none of the three columns belonged to no
// column and vanished from the board; it gets one of its own now.
async function loadWorkbench(caseId) {
    const kanban = document.getElementById('workbench-kanban-' + caseId);
    if (kanban) {
        htmx.ajax('GET', '/ui/cases/' + caseId + '/workbench', {
            source: kanban, target: kanban, swap: 'innerHTML',
        });
    }
    // The ledger verify is a separate read so a slow verify does not hold
    // up the pins, which is why it is not part of that fragment.
    try {
        const resp = await fetch('/api/alert-cases/' + caseId + '/ledger/verify');
        renderWorkbenchVerifyBanner(caseId, resp.ok ? await resp.json() : null);
    } catch (e) {
        renderWorkbenchVerifyBanner(caseId, null);
    }
}

function renderWorkbenchVerifyBanner(caseId, verify) {
    const banner = document.getElementById('workbench-verify-banner-' + caseId);
    if (!banner) return;
    if (!verify) {
        banner.className = 'workbench-verify-banner wb-verify-unknown';
        banner.textContent = 'verify unavailable';
        return;
    }
    if (verify.is_valid) {
        banner.className = 'workbench-verify-banner wb-verify-ok';
        banner.textContent = 'chain ok · ' + (verify.seq_count || 0) + ' entries';
    } else {
        banner.className = 'workbench-verify-banner wb-verify-bad';
        banner.textContent = 'chain BROKEN at seq ' + (verify.first_break_seq || '?');
        banner.title = verify.error || 'unknown error';
    }
}

async function loadAnnotations(caseId) {
    const body = document.getElementById('annotations-body-' + caseId);
    if (!body) return;
    const token = {};
    body._ionAnnotationsRequest = token;
    const loaded = await ionLoadFragment('/ui/cases/' + caseId + '/annotations', body, 'Loading annotations...', {failure:'Failed to load annotations'});
    if (body._ionAnnotationsRequest !== token) return;
    if (!loaded) {
        const count = document.getElementById('annotations-count-' + caseId);
        if (count) count.textContent = '-';
    }
    // The form arrives closed from the fragment, which carries the hidden
    // class. This used to force it shut with an inline display:none,
    // because the fragment had dropped that class. An inline declaration
    // beats a class, so leaving both in would have made the form
    // impossible to open.
}



// The form carries `hidden` from the fragment, so the toggle has to be the
// same class. It was `style.display`, which starts empty and therefore read
// as open on the first click: the fragment that replaced the string renderer
// dropped the `hidden` the string had, and the mismatch left the form open
// on load with the add button closing it.
function toggleAnnotationForm(caseId) {
    var form = document.getElementById('annotation-form-' + caseId);
    if (!form) return;
    var opened = form.classList.toggle('hidden') === false;
    if (opened) {
        var tsEl = document.getElementById('ann-ts-' + caseId);
        if (tsEl && !tsEl.value) {
            // datetime-local wants the viewer's wall clock, so the offset is
            // applied deliberately here. It is the one place on this page
            // that should read local, because the analyst is typing it.
            var now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            tsEl.value = now.toISOString().slice(0, 16);
        }
    }
}

async function submitAnnotation(caseId) {
    var tsEl = document.getElementById('ann-ts-' + caseId);
    var bodyEl = document.getElementById('ann-body-' + caseId);
    if (!tsEl || !bodyEl) return;
    var tsVal = (tsEl.value || '').trim();
    var bodyVal = (bodyEl.value || '').trim();
    if (!tsVal) { tsEl.focus(); return; }
    if (!bodyVal) { bodyEl.focus(); return; }
    var tsIso = tsVal.length === 16 ? tsVal + ':00' : tsVal;
    try {
        var resp = await fetch('/api/alert-cases/' + caseId + '/annotations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ timeline_ts: tsIso, body: bodyVal }),
        });
        if (!resp.ok) { var err = await resp.json().catch(function(){return {};}); alert('Failed: ' + (err.detail || resp.status)); return; }
        bodyEl.value = ''; tsEl.value = '';
        loadAnnotations(caseId);
    } catch (e) { alert('Failed to save annotation'); }
}

async function editAnnotation(caseId, annId) {
    var card = document.getElementById('ann-card-' + caseId + '-' + annId);
    // Was querySelectorAll('div')[1], which was the shape of the string

    var bodyDiv = card ? card.querySelector('[data-annotation-body]') : null;
    var currentBody = bodyDiv ? bodyDiv.textContent : '';
    var newBody = prompt('Edit annotation:', currentBody);

    try {
        var resp = await fetch('/api/alert-cases/' + caseId + '/annotations/' + annId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },

        if (!resp.ok) { var err = await resp.json().catch(function(){return {};}); alert('Failed: ' + (err.detail || resp.status)); return; }
        loadAnnotations(caseId);
    } catch (e) { alert('Failed to update annotation'); }
}

async function deleteAnnotation(caseId, annId) {

        if (panel) panel.classList.add('collapsed');
        if (chevron) chevron.classList.add('collapsed');
    }

    // deep-link support — `?selected=<case_number>` (or numeric
    // id) auto-opens that case's detail panel. Drives the
    // /cases/{row_id} redirect from `_observable_link` AND the alerts
    // page's cases-sidebar "open in /cases" links so the analyst lands
    // on the standard /cases panel UX (status dropdown → closure
    // modal with full CaseClosureReason enum) instead of the compact
    // centered modal that used to live on /alerts.
    const params = new URLSearchParams(window.location.search);
    const selected = params.get('selected');
    if (selected && !window.__initialCaseId) {
        const match = allCases.find(c => c.case_number === selected)
            || allCases.find(c => String(c.id) === selected);
        if (match) {
            openCaseDetail(match.id);   // navigates to /cases/{id}
        }
    }
});

// /cases/{id} — render the panel as the page. The list chrome around it is
// hidden, the panel joins the document flow, and the overlay never mounts.
if (window.__initialCaseId) {
    document.addEventListener('DOMContentLoaded', () => {
        const panel = document.getElementById('case-panel');
        panel.classList.add('page-mode', 'open');
        // style.display, not the .hidden utility: page chrome like
        // .ion-page-header carries its own display:flex that outranks the
        // utility class in the cascade. The dialogs stay untouched -- the
        // closure modal must still open from page mode.
        for (const sibling of panel.parentElement.children) {
            if (sibling === panel) { continue; }
            if (sibling.id === 'create-case-overlay' || sibling.id === 'closure-modal-overlay') { continue; }
            if (sibling.tagName === 'STYLE' || sibling.tagName === 'SCRIPT') { continue; }
            sibling.style.display = 'none';
        }
        openCaseDetail(window.__initialCaseId);
    });
}
</script>

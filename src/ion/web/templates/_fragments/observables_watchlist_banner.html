{% if state == 'failed' %}<span class="error">Watchlist alerts unavailable.</span>{% elif state == 'data' %}<span>You have {{ total }} unread watchlist alert{{ 's' if total != 1 else '' }}</span><button class="btn btn-sm" data-click-action="showWatchlistAlerts">View alerts</button><button class="btn btn-sm" data-click-action="dismissWatchlistBanner" aria-label="Dismiss watchlist banner">×</button>{% endif %}

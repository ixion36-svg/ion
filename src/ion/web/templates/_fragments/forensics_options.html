<div><template data-forensic-options='{{ {'enums':enums,'playbooks':playbooks,'can_create':can_create,'can_update':can_update,'can_close':can_close,'can_manage_playbooks':can_manage_playbooks}|tojson }}'></template></div>
{% for id in ['filter-type','pb-filter-type','nc-type','pb-type'] %}<select id="{{ id }}" hx-swap-oob="outerHTML" class="{{ 'ion-select sm:min-w-[150px] sm:w-auto' if id in ['filter-type','pb-filter-type'] else 'select w-full' }}"{% if id == 'filter-type' %} data-change-action="loadCases"{% elif id == 'pb-filter-type' %} data-change-action="loadPlaybooks"{% endif %}{% if enums_state == 'failed' %} disabled{% endif %}>
{% if enums_state == 'failed' %}<option>Investigation types unavailable</option>{% else %}{% if id in ['filter-type','pb-filter-type','pb-type'] %}<option value="">{{ 'Any' if id == 'pb-type' else 'All Types' }}</option>{% endif %}{% for type in enums.investigation_types %}<option value="{{ type }}">{{ type|replace('_',' ')|title }}</option>{% endfor %}{% endif %}</select>{% endfor %}
<select id="nc-playbook" class="select w-full" hx-swap-oob="outerHTML" data-change-action="onPlaybookSelect"{% if playbooks_state == 'failed' %} disabled{% endif %}>{% if playbooks_state == 'failed' %}<option>Playbooks unavailable</option>{% else %}<option value="">-- No Playbook (blank investigation) --</option>{% for playbook in playbooks %}<option value="{{ playbook.id }}">{{ playbook.name }}{% if playbook.investigation_type %} ({{ playbook.investigation_type|replace('_',' ')|title }}){% endif %}</option>{% endfor %}{% endif %}</select>
{% for id,key in [('ae-type','evidence_types'),('cust-action','custody_actions'),('cd-status-select','case_statuses')] %}<select id="{{ id }}" class="select w-full" hx-swap-oob="outerHTML"{% if id == 'cd-status-select' %} data-change-action="updateCaseStatus" data-forensic-permission="forensic:update"{% if not can_update %} hidden disabled{% endif %}{% endif %}{% if enums_state == 'failed' %} disabled{% endif %}>{% if enums_state == 'failed' %}<option>Options unavailable</option>{% else %}{% for value in enums[key] %}<option value="{{ value }}">{{ value|replace('_',' ')|title }}</option>{% endfor %}{% endif %}</select>{% endfor %}
{% for id in ['nc-lead','cust-received-by'] %}<select id="{{ id }}" class="select w-full" hx-swap-oob="outerHTML"{% if users_state in ['withheld','failed'] %} disabled{% endif %}>{% if users_state == 'withheld' %}<option>Analyst options withheld: user permission required</option>{% elif users_state == 'failed' %}<option>Analyst options unavailable</option>{% else %}<option value="">{{ 'Unassigned' if id == 'nc-lead' else 'N/A' }}</option>{% for user in users %}<option value="{{ user.id }}">{{ user.display_name or user.username }}</option>{% endfor %}{% if users_state == 'empty' %}<option disabled>No analysts found</option>{% endif %}{% endif %}</select>{% endfor %}

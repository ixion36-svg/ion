{% if state == 'failed' %}<option value="" disabled selected>Destinations unavailable</option>{% else %}<option value=""{% if not active %} selected{% endif %}>All destinations{% if total is not none %} ({{ total }}){% endif %}</option>{% if unlisted_active %}<option value="{{ unlisted_active }}" selected>{{ unlisted_active.split('|', 1)[-1] }} on any SIEM (saved setting)</option>{% endif %}{% for destination in destinations %}<option value="{{ destination.key }}"{% if destination.key == active %} selected{% endif %}>{{ (destination.get('kind') or 'elastic')|title }} · {{ destination.get('siem_id') or 'any SIEM' }} / {{ destination.space }} ({{ destination.get('rule_count') if destination.get('rule_count') is not none else 'Unknown' }})</option>{% endfor %}{% endif %}

<template data-case-users='{{ users|tojson }}'></template>
{% for id in ['filter-assignee','new-case-assignee'] %}<select id="{{ id }}"{% if id == 'filter-assignee' %} class="min-w-[150px] px-3 py-2 bg-base-200 border border-base-300 rounded text-[0.85rem] text-base-content focus:outline-none focus:border-primary" data-change-action="reloadCaseBoard"{% else %} class="form-control"{% endif %} hx-swap-oob="outerHTML"{% if state in ['withheld','failed'] %} disabled{% endif %}>
{% if state == 'withheld' %}<option value="">Assignees withheld: alert permission required</option>{% elif state == 'failed' %}<option value="">Assignees unavailable</option>{% else %}<option value="">{{ 'All Assignees' if id == 'filter-assignee' else 'Unassigned' }}</option>{% for user in users %}<option value="{{ user.id }}">{{ user.display_name or user.username }}{% if id == 'new-case-assignee' and user.has_elastic_profile is sameas false %} (no Kibana profile){% endif %}</option>{% endfor %}{% endif %}</select>{% endfor %}

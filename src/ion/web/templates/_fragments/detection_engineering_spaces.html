{% if state == 'failed' %}<option value="" disabled selected>Spaces unavailable</option>{% elif state == 'empty' %}<option value="default" selected>default</option>{% else %}{% for space in spaces %}<option value="{{ space.space }}"{% if space.space == active %} selected{% endif %}>{{ space.space }} ({{ space.get('rule_count') if space.get('rule_count') is not none else 'Unknown' }})</option>{% endfor %}{% endif %}

{% if state == 'failed' %}<p class="loading">Environment information unavailable.</p>{% elif state == 'empty' %}<p class="loading">No ION environment variables set</p>{% else %}{% for item in items %}<div class="env-var-item"><span class="env-var-name">{{ item.name }}</span><span class="env-var-value">{{ item.value }}</span></div>{% endfor %}{% endif %}

{% extends "base.html" %}
{% block title %}Social Hub - ION{% endblock %}
{% block content %}
<div class="ion-tw ion-tw-page text-slate-200 overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<style nonce="{{ csp_nonce }}">
/* JS toggles .active on .social-filter-pill, not daisyUI .btn-active. Bridge the two. */
.social-filter-pill.active {
    background-color: var(--color-primary);
    color: var(--color-primary-content);
    border-color: var(--color-primary);
    font-weight: 600;
}

/* JS innerHTML: feed cards. Category accents map onto daisyUI slots
   (warning = ION amber = former --neon-orange; secondary = ION iris =
   former --neon-purple). */
.social-post {
    background: var(--color-base-200);
    border: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
    border-radius: var(--radius-box, 0.5rem);
    margin-bottom: 1rem;
    overflow: hidden;
}
.social-post.pinned { border-color: var(--color-warning); }
.social-post-accent { height: 3px; width: 100%; }
.social-post-accent.announcement { background: var(--color-warning); }
.social-post-accent.good_work { background: var(--color-primary); }
.social-post-accent.certification { background: var(--color-secondary); }
.social-post-accent.general { background: var(--color-base-300); }

.social-post-body { padding: 1rem 1.25rem; }
.social-post-meta {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem;
}
.social-post-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: color-mix(in oklab, var(--color-primary) 15%, transparent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--color-primary); font-size: 0.85rem; flex-shrink: 0;
}
.social-post-author { font-weight: 600; color: var(--color-base-content); }
.social-post-time { color: color-mix(in oklab, var(--color-base-content) 45%, transparent); }
.social-post-pin { color: var(--color-warning); font-size: 0.75rem; font-weight: 600; }
.social-category-badge {
    display: inline-flex; align-items: center; padding: 0.125rem 0.625rem;
    border-radius: var(--radius-selector, 0.25rem);
    font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
}
.social-category-badge.announcement {
    background: color-mix(in oklab, var(--color-warning) 15%, transparent);
    color: var(--color-warning);
}
.social-category-badge.good_work {
    background: color-mix(in oklab, var(--color-primary) 15%, transparent);
    color: var(--color-primary);
}
.social-category-badge.certification {
    background: color-mix(in oklab, var(--color-secondary) 15%, transparent);
    color: var(--color-secondary);
}
.social-category-badge.general {
    background: var(--color-base-300);
    color: color-mix(in oklab, var(--color-base-content) 55%, transparent);
}

.social-post-title { font-size: 1.05rem; font-weight: 700; color: var(--color-base-content); margin: 0.5rem 0 0.375rem; }
.social-post-content { color: color-mix(in oklab, var(--color-base-content) 75%, transparent); font-size: 0.9rem; line-height: 1.6; }
.social-post-content p { margin: 0 0 0.5rem; }

/* JS querySelector('.social-post-actions') / .social-post-admin-actions;
   innerHTML rebuilds reaction buttons with .reacted. */
.social-post-actions {
    display: flex; align-items: center; gap: 0.25rem; padding: 0.5rem 1.25rem 0.75rem;
    border-top: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
    flex-wrap: wrap;
}
.social-react-btn {
    padding: 0.25rem 0.625rem; border-radius: 1rem;
    border: 1px solid color-mix(in oklab, var(--color-base-content) 12%, transparent);
    background: var(--color-base-200); cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; gap: 0.25rem;
    color: color-mix(in oklab, var(--color-base-content) 70%, transparent);
}
.social-react-btn:hover { border-color: var(--color-primary); }
.social-react-btn.reacted {
    background: color-mix(in oklab, var(--color-primary) 15%, transparent);
    border-color: var(--color-primary); color: var(--color-primary);
}
.social-react-btn .count { font-weight: 600; }
.social-comment-toggle {
    margin-left: auto; padding: 0.25rem 0.75rem; border-radius: 1rem;
    border: 1px solid color-mix(in oklab, var(--color-base-content) 12%, transparent);
    background: var(--color-base-200); cursor: pointer; font-size: 0.8rem;
    color: color-mix(in oklab, var(--color-base-content) 50%, transparent);
}
.social-comment-toggle:hover { border-color: var(--color-primary); color: var(--color-base-content); }
.social-post-admin-actions { margin-left: 0.5rem; display: flex; gap: 0.25rem; }
.social-admin-btn {
    padding: 0.25rem 0.5rem; border-radius: var(--radius-field, 0.25rem);
    border: none; background: none; cursor: pointer; font-size: 0.75rem;
    color: color-mix(in oklab, var(--color-base-content) 50%, transparent);
}
.social-admin-btn:hover { color: var(--color-primary); background: var(--color-base-300); }

/* JS classList toggles .show on .social-comments, not daisyUI / Tailwind .hidden. */
.social-comments { padding: 0 1.25rem 1rem; display: none; }
.social-comments.show { display: block; }
.social-comment-item {
    display: flex; gap: 0.5rem; padding: 0.5rem 0;
    border-bottom: 1px solid color-mix(in oklab, var(--color-base-content) 8%, transparent);
}
.social-comment-item:last-child { border-bottom: none; }
.social-comment-avatar {
    width: 24px; height: 24px; border-radius: 50%; background: var(--color-base-300);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem; font-weight: 700;
    color: color-mix(in oklab, var(--color-base-content) 50%, transparent); flex-shrink: 0;
}
.social-comment-body { flex: 1; }
.social-comment-author { font-weight: 600; font-size: 0.8rem; color: var(--color-base-content); }
.social-comment-text { font-size: 0.85rem; color: color-mix(in oklab, var(--color-base-content) 75%, transparent); margin-top: 2px; }
.social-comment-time { font-size: 0.65rem; color: color-mix(in oklab, var(--color-base-content) 45%, transparent); margin-top: 2px; }
.social-comment-delete { background: none; border: none; color: color-mix(in oklab, var(--color-base-content) 50%, transparent); cursor: pointer; font-size: 0.7rem; }
.social-comment-delete:hover { color: var(--color-error); }

/* JS innerHTML: comment composer is a bare <input> + <button>, no daisyUI classes. */
.social-comment-form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
.social-comment-form input {
    flex: 1; padding: 0.5rem 0.75rem;
    border: 1px solid color-mix(in oklab, var(--color-base-content) 12%, transparent);
    border-radius: var(--radius-field, 0.25rem);
    background: var(--color-base-200); color: var(--color-base-content); font-size: 0.85rem;
}
.social-comment-form input:focus { outline: none; border-color: var(--color-primary); }
.social-comment-form button {
    padding: 0.5rem 1rem; background: var(--color-primary); color: var(--color-primary-content);
    border: none; border-radius: var(--radius-field, 0.25rem); cursor: pointer;
    font-size: 0.85rem; font-weight: 600;
}

/* JS innerHTML: empty feed uses .social-empty (no daisyUI class on that node). */
.social-empty { text-align: center; padding: 3rem 1rem; color: color-mix(in oklab, var(--color-base-content) 50%, transparent); }
.social-empty i { font-size: 3rem; display: block; margin-bottom: 0.75rem; }
</style>

<div class="max-w-[800px] mx-auto">
    <section class="mb-8 rise d-1">
      <div class="flex items-center gap-3 mb-4">
        <svg class="w-4 h-4 text-ion-iris"><use href="#i-users"/></svg>
        <span class="label-tiny text-ion-iris">Team space</span>
      </div>
      <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] text-white tracking-[-0.02em]">Social Hub</h1>
      <p class="mt-3 max-w-2xl text-[15px] text-slate-400">Announcements, shoutouts and team channels.</p>
    </section>

    <!-- Compose -->
    <div class="card bg-base-200 shadow mb-5">
        <div class="card-body gap-3">
            <div class="flex flex-wrap gap-3">
                <input type="text" id="social-title" class="input w-full md:flex-1 md:w-auto" placeholder="Post title...">
                <select id="social-category" class="select w-full md:w-auto">
                    <option value="general">General</option>
                    <option value="announcement">Announcement</option>
                    <option value="good_work">Good Work</option>
                    <option value="certification">Certification</option>
                </select>
            </div>
            <textarea id="social-body" class="textarea w-full min-h-20 resize-y" placeholder="Share an update, shoutout, or announcement... (supports markdown)"></textarea>
            <div class="card-actions justify-end">
                <button class="btn btn-primary" data-click-action="createSocialPost">Post</button>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-5">
        <button class="btn btn-sm social-filter-pill active" data-cat="" data-click-action="filterPosts" data-args='["$target", ""]'>All</button>
        <button class="btn btn-sm social-filter-pill" data-cat="announcement" data-click-action="filterPosts" data-args='["$target", "announcement"]'>Announcements</button>
        <button class="btn btn-sm social-filter-pill" data-cat="good_work" data-click-action="filterPosts" data-args='["$target", "good_work"]'>Good Work</button>
        <button class="btn btn-sm social-filter-pill" data-cat="certification" data-click-action="filterPosts" data-args='["$target", "certification"]'>Certifications</button>
        <button class="btn btn-sm social-filter-pill" data-cat="general" data-click-action="filterPosts" data-args='["$target", "general"]'>General</button>
    </div>

    <!-- Feed -->
    <div id="social-feed">
        <div class="social-empty"><i class="icon-megaphone"></i>No posts yet. Be the first!</div>
    </div>
</div>

<script nonce="{{ csp_nonce }}" src="/static/js/marked.min.js"></script>
<script nonce="{{ csp_nonce }}" src="/static/js/purify.min.js"></script>
<script nonce="{{ csp_nonce }}">
const EMOJI_MAP = {
    thumbsup: String.fromCodePoint(0x1F44D),
    clap: String.fromCodePoint(0x1F44F),
    fire: String.fromCodePoint(0x1F525),
    heart: String.fromCodePoint(0x2764, 0xFE0F),
    rocket: String.fromCodePoint(0x1F680),
    trophy: String.fromCodePoint(0x1F3C6),
};
const CATEGORY_LABELS = {
    announcement: 'Announcement', good_work: 'Good Work',
    certification: 'Certification', general: 'General'
};
let currentFilter = '';
let socialPosts = [];
let isAdminOrLead = false;

document.addEventListener('DOMContentLoaded', async () => {
    await loadCurrentUser();
    if (currentUserData) {
        const roles = currentUserData.roles || [];
        isAdminOrLead = roles.includes('admin') || roles.includes('lead');
    }
    loadFeed();
});

async function loadFeed() {
    try {
        const url = currentFilter ? '/api/social/?category=' + currentFilter : '/api/social/';
        const data = await api.get(url);
        socialPosts = data.posts || [];
        renderFeed(socialPosts);
    } catch (e) {
        console.error('Failed to load feed:', e);
    }
}

function renderFeed(posts) {
    const feed = document.getElementById('social-feed');
    if (!posts.length) {
        feed.innerHTML = '<div class="social-empty"><i class="icon-megaphone"></i>No posts yet. Be the first!</div>';
        return;
    }

    feed.innerHTML = posts.map(p => {
        const avatar = (p.author_display || p.author || '?').charAt(0).toUpperCase();
        const pinHtml = p.is_pinned ? '<span class="social-post-pin">PINNED</span>' : '';
        const pinnedClass = p.is_pinned ? ' pinned' : '';
        const catBadge = '<span class="social-category-badge ' + p.category + '">' + (CATEGORY_LABELS[p.category] || p.category) + '</span>';
        const bodyHtml = safeMarkdown(p.body);
        const time = formatSocialTime(p.created_at);

        // Reactions
        let reactHtml = '';
        for (const [emoji, info] of Object.entries(p.reactions || {})) {
            const icon = EMOJI_MAP[emoji] || emoji;
            const cls = info.reacted ? ' reacted' : '';
            reactHtml += '<button class="social-react-btn' + cls + '" data-click-action="toggleReaction" data-args=\'[' + p.id + ', ' + JSON.stringify(emoji) + ']\'>' + icon + ' <span class="count">' + info.count + '</span></button>';
        }
        // Add reaction buttons for emojis not yet used
        for (const [key, icon] of Object.entries(EMOJI_MAP)) {
            if (!p.reactions || !p.reactions[key]) {
                reactHtml += '<button class="social-react-btn" data-click-action="toggleReaction" data-args=\'[' + p.id + ', ' + JSON.stringify(key) + ']\'>' + icon + '</button>';
            }
        }

        const commentBtn = `<button class="social-comment-toggle" data-click-action="toggleComments" data-args='[${p.id}]'>\ud83d\udcac ${p.comment_count} comments</button>`;

        // Admin actions
        let adminHtml = '';
        if (isAdminOrLead) {
            adminHtml += `<button class="social-admin-btn" data-click-action="togglePin" data-args='[${p.id}]' title="${p.is_pinned ? 'Unpin' : 'Pin'}">\ud83d\udccc</button>`;
        }
        const isMine = currentUserData && p.user_id === currentUserData.id;
        if (isMine || isAdminOrLead) {
            adminHtml += `<button class="social-admin-btn" data-click-action="deletePost" data-args='[${p.id}]' title="Delete">\ud83d\uddd1\ufe0f</button>`;
        }

        return '<div class="social-post' + pinnedClass + '" id="social-post-' + p.id + '">' +
            '<div class="social-post-accent ' + p.category + '"></div>' +
            '<div class="social-post-body">' +
                '<div class="social-post-meta">' +
                    '<div class="social-post-avatar">' + escapeHtml(avatar) + '</div>' +
                    '<span class="social-post-author">' + escapeHtml(p.author_display) + '</span>' +
                    '<span class="social-post-time">' + time + '</span>' +
                    pinHtml + catBadge +
                '</div>' +
                '<div class="social-post-title">' + escapeHtml(p.title) + '</div>' +
                '<div class="social-post-content">' + bodyHtml + '</div>' +
            '</div>' +
            '<div class="social-post-actions">' +
                reactHtml + commentBtn +
                (adminHtml ? '<div class="social-post-admin-actions">' + adminHtml + '</div>' : '') +
            '</div>' +
            '<div class="social-comments" id="comments-' + p.id + '"></div>' +
        '</div>';
    }).join('');
}

function formatSocialTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const diff = Math.floor((now - d) / 60000);
    if (diff < 1) return 'just now';
    if (diff < 60) return diff + 'm ago';
    const hrs = Math.floor(diff / 60);
    if (hrs < 24) return hrs + 'h ago';
    const days = Math.floor(hrs / 24);
    if (days < 7) return days + 'd ago';
    return d.toLocaleDateString();
}

async function createSocialPost() {
    const title = document.getElementById('social-title').value.trim();
    const body = document.getElementById('social-body').value.trim();
    const category = document.getElementById('social-category').value;

    if (!title || !body) {
        showToast('Title and body are required', 'error');
        return;
    }

    try {
        await api.post('/api/social/', { title, body, category });
        document.getElementById('social-title').value = '';
        document.getElementById('social-body').value = '';
        showToast('Post created!', 'success');
        loadFeed();
    } catch (e) {
        showToast(e.message || 'Failed to create post', 'error');
    }
}

function filterPosts(btn, category) {
    document.querySelectorAll('.social-filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = category;
    loadFeed();
}

async function toggleReaction(postId, emoji) {
    try {
        const result = await api.post('/api/social/' + postId + '/reactions', { emoji });

        // Update the local data optimistically instead of reloading entire feed
        const post = socialPosts.find(p => p.id === postId);
        if (post) {
            if (!post.reactions) post.reactions = {};
            if (result.action === 'added') {
                if (!post.reactions[emoji]) post.reactions[emoji] = { count: 0, reacted: false };
                post.reactions[emoji].count++;
                post.reactions[emoji].reacted = true;
            } else if (result.action === 'removed') {
                if (post.reactions[emoji]) {
                    post.reactions[emoji].count = Math.max(0, post.reactions[emoji].count - 1);
                    post.reactions[emoji].reacted = false;
                    if (post.reactions[emoji].count === 0) delete post.reactions[emoji];
                }
            }
            // Re-render just the actions bar for this post
            const postEl = document.getElementById('social-post-' + postId);
            if (postEl) {
                const actionsEl = postEl.querySelector('.social-post-actions');
                if (actionsEl) {
                    let reactHtml = '';
                    for (const [emojiKey, info] of Object.entries(post.reactions || {})) {
                        const icon = EMOJI_MAP[emojiKey] || emojiKey;
                        const cls = info.reacted ? ' reacted' : '';
                        reactHtml += '<button class="social-react-btn' + cls + '" data-click-action="toggleReaction" data-args=\'[' + postId + ', ' + JSON.stringify(emojiKey) + ']\'>' + icon + ' <span class="count">' + info.count + '</span></button>';
                    }
                    for (const [key, icon] of Object.entries(EMOJI_MAP)) {
                        if (!post.reactions || !post.reactions[key]) {
                            reactHtml += '<button class="social-react-btn" data-click-action="toggleReaction" data-args=\'[' + postId + ', ' + JSON.stringify(key) + ']\'>' + icon + '</button>';
                        }
                    }
                    const commentBtn = `<button class="social-comment-toggle" data-click-action="toggleComments" data-args='[${postId}]'>\ud83d\udcac ${post.comment_count} comments</button>`;
                    const adminBtns = actionsEl.querySelector('.social-post-admin-actions');
                    actionsEl.innerHTML = reactHtml + commentBtn + (adminBtns ? adminBtns.outerHTML : '');
                }
            }
        }
    } catch (e) {
        console.error('Reaction failed:', e);
        showToast('Failed to react: ' + (e.message || 'Unknown error'), 'error');
    }
}

async function togglePin(postId) {
    try {
        const result = await api.post('/api/social/' + postId + '/pin');
        showToast(result.is_pinned ? 'Post pinned' : 'Post unpinned', 'success');
        loadFeed();
    } catch (e) {
        showToast(e.message || 'Failed to pin', 'error');
    }
}

async function deletePost(postId) {
    if (!confirm('Delete this post?')) return;
    try {
        await api.delete('/api/social/' + postId);
        showToast('Post deleted', 'success');
        loadFeed();
    } catch (e) {
        showToast(e.message || 'Failed to delete', 'error');
    }
}

async function toggleComments(postId) {
    const el = document.getElementById('comments-' + postId);
    if (!el) return;
    if (el.classList.contains('show')) {
        el.classList.remove('show');
        return;
    }
    el.classList.add('show');
    await loadComments(postId);
}

async function loadComments(postId) {
    const el = document.getElementById('comments-' + postId);
    if (!el) return;
    try {
        const data = await api.get('/api/social/' + postId);
        const comments = data.comments || [];
        let html = comments.map(c => {
            const av = (c.author_display || c.author || '?').charAt(0).toUpperCase();
            const isMine = currentUserData && c.user_id === currentUserData.id;
            const delBtn = (isMine || isAdminOrLead)
                ? ` <button class="social-comment-delete" data-click-action="deleteComment" data-args='[${postId}, ${c.id}]'>delete</button>`
                : '';
            return '<div class="social-comment-item">' +
                '<div class="social-comment-avatar">' + escapeHtml(av) + '</div>' +
                '<div class="social-comment-body">' +
                    '<span class="social-comment-author">' + escapeHtml(c.author_display) + '</span>' + delBtn +
                    '<div class="social-comment-text">' + escapeHtml(c.content) + '</div>' +
                    '<div class="social-comment-time">' + formatSocialTime(c.created_at) + '</div>' +
                '</div>' +
            '</div>';
        }).join('');

        html += `<div class="social-comment-form">
            <input type="text" id="comment-input-${postId}" placeholder="Add a comment..." data-enter-key-action="addComment" data-args='[${postId}]'>
            <button data-click-action="addComment" data-args='[${postId}]'>Post</button>
        </div>`;

        el.innerHTML = html;
    } catch (e) {
        el.innerHTML = '<div class="_ion-s-c3be19bb5e">Failed to load comments</div>';
    }
}

async function addComment(postId) {
    const input = document.getElementById('comment-input-' + postId);
    if (!input) return;
    const content = input.value.trim();
    if (!content) return;
    try {
        await api.post('/api/social/' + postId + '/comments', { content });
        input.value = '';
        await loadComments(postId);
        // Update comment count in feed
        loadFeed();
    } catch (e) {
        showToast('Failed to add comment', 'error');
    }
}

async function deleteComment(postId, commentId) {
    try {
        await api.delete('/api/social/' + postId + '/comments/' + commentId);
        await loadComments(postId);
        loadFeed();
    } catch (e) {
        showToast('Failed to delete comment', 'error');
    }
}
</script>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

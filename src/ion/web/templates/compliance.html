{% extends "base.html" %}

{% block title %}Compliance Posture - ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<section class="flex flex-wrap items-end justify-between gap-6 mb-8 rise d-1">
<div class="basis-full md:basis-auto md:flex-1">
  <div class="flex items-center gap-3 mb-4">
    <svg class="w-4 h-4 text-ion-lime"><use href="#i-shield"/></svg>
    <span class="label-tiny text-ion-lime">Control coverage</span>
  </div>
  <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">Compliance</h1>
  <p class="mt-3 max-w-2xl text-[15px] text-base-content/60">Mapped controls across frameworks and evidence capture.</p>
</div>
<div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" data-click-action="cmpRefresh">Refresh</button>
    </div>
</section>

<div id="cmp-content"><div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Loading frameworks...</div></div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
<style nonce="{{ csp_nonce }}">
/* auto-fit minmax has no daisyUI grid equivalent; do not approximate with breakpoints. */
.cmp-fw-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
}

/* JS toggles .selected on framework cards — daisyUI card has no selected slot.
   Left accent stripe and hover lift have no daisyUI equivalent. */
.cmp-fw {
    cursor: pointer;
    border-left: 4px solid var(--color-base-300);
    transition: transform .12s, border-color .12s;
}
.cmp-fw:hover {
    transform: translateY(-2px);
    border-color: var(--color-primary);
}
.cmp-fw.selected {
    border-left-color: var(--color-primary);
    background: color-mix(in oklab, var(--color-primary) 6%, var(--color-base-200));
}

/* JS-computed bar width/colour via data-ion-style; fill height is not a compiled utility. */
.cmp-fw-bar {
    height: 4px;
    background: color-mix(in oklab, var(--color-base-content) 12%, transparent);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
}
.cmp-fw-bar-fill { height: 100%; }
</style>
<script nonce="{{ csp_nonce }}">
const CMP_API = '/api/compliance';
let _cmpAll = null;
let _cmpSelected = null;

function cmpEsc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

async function cmpRefresh() {
    const c = document.getElementById('cmp-content');
    c.innerHTML = '<div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Computing per-framework coverage...</div>';
    try {
        const r = await fetch(`${CMP_API}/posture`);
        if (!r.ok) throw new Error('Compliance fetch failed');
        _cmpAll = await r.json();
        cmpRender();
    } catch (e) {
        c.innerHTML = `<div role="alert" class="alert alert-error _ion-s-3c9b2ebd4d">${cmpEsc(e.message)}</div>`;
    }
}

function cmpScoreClass(score) {
    if (score >= 80) return 'text-success';
    if (score >= 40) return 'text-warning';
    return 'text-error';
}

function cmpScoreColor(score) {
    if (score >= 80) return 'var(--mitre-covered,#3fb950)';
    if (score >= 40) return 'var(--sev-medium,#d29922)';
    return 'var(--sev-critical,#f85149)';
}

function cmpStateBadge(state) {
    if (state === 'covered') return 'badge-success';
    if (state === 'partial') return 'badge-warning';
    if (state === 'blind') return 'badge-error';
    return 'badge-ghost';
}

function cmpRender() {
    const c = document.getElementById('cmp-content');
    const frameworks = (_cmpAll && _cmpAll.frameworks) || [];

    let banner = '';
    if (_cmpAll && _cmpAll.error) {
        banner = `<div role="alert" class="alert alert-warning mb-4"><span><strong>${cmpEsc(_cmpAll.error)}.</strong> Configure TIDE in <a class="_ion-s-0510f285a6" href="/settings#tide">Settings</a> to compute live coverage.</span></div>`;
    }

    let html = banner + `<div role="alert" class="alert alert-info mb-4">
        <span>ION computes detection coverage per framework by mapping each control to the MITRE ATT&CK techniques
        an attacker would use against it, then asking the live TIDE rule catalog whether any enabled rule
        detects those techniques. Click a framework card to drill into its controls.</span>
    </div>`;

    if (!frameworks.length) {
        html += '<div class="flex justify-center items-center py-14 text-center opacity-50">No framework data.</div>';
        c.innerHTML = html;
        return;
    }

    html += '<div class="cmp-fw-list">';
    for (const f of frameworks) {
        const cls = cmpScoreClass(f.overall_score || 0);
        const isSel = _cmpSelected === f.framework_id ? 'selected' : '';
        const s = f.summary || {};
        html += `<div class="card bg-base-200 shadow cmp-fw ${isSel}" data-click-action="cmpSelect" data-args='["${cmpEsc(f.framework_id)}"]'>
            <div class="card-body p-4 gap-1">
            <h2 class="card-title text-base">${cmpEsc(f.framework)}</h2>
            <p class="text-xs uppercase tracking-wide opacity-50">${cmpEsc(f.version || '')}</p>
            <div class="flex justify-between items-center mt-2">
                <div class="stat-value font-mono text-2xl ${cls}">${f.overall_score||0}%</div>
                <div class="stat-desc text-right">${s.fully_covered||0} / ${s.total_controls||0} controls<br>${s.partial||0} partial &middot; ${s.no_coverage||0} blind</div>
            </div>
            <div class="cmp-fw-bar"><div class="cmp-fw-bar-fill" data-ion-style="width:${f.overall_score||0}%; background:${cmpScoreColor(f.overall_score||0)}"></div></div>
            </div>
        </div>`;
    }
    html += '</div>';

    if (_cmpSelected) {
        const f = frameworks.find(x => x.framework_id === _cmpSelected);
        if (f) html += cmpRenderDetail(f);
    } else {
        html += '<div class="flex justify-center items-center py-14 text-center opacity-50">Select a framework above to see per-control coverage.</div>';
    }

    c.innerHTML = html;
}

function cmpRenderDetail(f) {
    const s = f.summary || {};
    let html = `<div class="card bg-base-200 shadow">
        <div class="flex flex-wrap items-center justify-between gap-4 px-5 py-3 border-b border-base-300">
            <div class="basis-full md:basis-auto md:flex-1">
                <h2 class="card-title text-base">${cmpEsc(f.framework)}</h2>
                <div class="text-xs opacity-50 mt-1">${cmpEsc(f.version)} &middot; <a class="_ion-s-1cdc0f83d3" href="${cmpEsc(f.url||'#')}" target="_blank" rel="noopener noreferrer">official spec &rarr;</a></div>
            </div>
            <div class="flex flex-wrap gap-4 text-sm">
                <span class="opacity-70"><strong class="font-mono">${f.overall_score||0}%</strong> overall</span>
                <span class="text-success">covered <strong class="font-mono">${s.fully_covered||0}</strong></span>
                <span class="text-warning">partial <strong class="font-mono">${s.partial||0}</strong></span>
                <span class="text-error">blind <strong class="font-mono">${s.no_coverage||0}</strong></span>
            </div>
        </div>
        <div class="overflow-x-auto"><table class="table table-sm"><thead><tr><th class="_ion-s-c6fffdfe96">Control</th><th>Name</th><th class="_ion-s-ec6626e1ed">Score</th><th class="_ion-s-8573bae381">State</th><th>Techniques</th></tr></thead><tbody>`;
    for (const ctl of (f.controls || [])) {
        const tids = [];
        for (const t of (ctl.covered_techniques||[])) tids.push(`<span class="badge badge-sm badge-outline badge-success font-mono">${cmpEsc(t)}</span>`);
        for (const t of (ctl.gap_techniques||[]))     tids.push(`<span class="badge badge-sm badge-outline badge-error font-mono">${cmpEsc(t)}</span>`);
        html += `<tr>
            <td><span class="font-mono font-semibold text-primary">${cmpEsc(ctl.control_id)}</span></td>
            <td>${cmpEsc(ctl.name)}</td>
            <td><span class="_ion-s-d0c0aa23fa" data-ion-style="color:${cmpScoreColor(ctl.score||0)}">${ctl.score||0}%</span></td>
            <td><span class="badge badge-sm ${cmpStateBadge(ctl.state)}">${cmpEsc(ctl.state)}</span></td>
            <td><div class="flex flex-wrap gap-1">${tids.join('')}</div></td>
        </tr>`;
    }
    html += '</tbody></table></div></div>';
    return html;
}

function cmpSelect(fid) {
    _cmpSelected = fid;
    cmpRender();
}

document.addEventListener('DOMContentLoaded', cmpRefresh);
</script>
{% endblock %}

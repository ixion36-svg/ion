{% extends "base.html" %}

{% block title %}SOC Health - ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<section class="flex flex-wrap items-end justify-between gap-6 mb-8 rise d-1">
<div class="basis-full md:basis-auto md:flex-1">
  <div class="flex items-center gap-3 mb-4">
    <svg class="w-4 h-4 text-ion-lime"><use href="#i-activity"/></svg>
    <span class="label-tiny text-ion-lime">Operational metrics</span>
  </div>
  <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">SOC Health</h1>
  <p class="mt-3 max-w-2xl text-[15px] text-base-content/60">Cluster, ingest and SOC-wide KPIs.</p>
</div>
<div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" data-click-action="shLoad">Refresh</button>
    </div>
</section>

<div id="sh-content"><div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Computing scorecard...</div></div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
<style nonce="{{ csp_nonce }}">
/* Conic-gradient score ring: daisyUI radial-progress needs a CSS custom
   property set as a raw attribute, which CSP refuses. Geometry and inner
   disc have no utility equivalent. */
.sh-grade-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.sh-grade-inner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--color-base-200);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* auto-fit minmax has no daisyUI grid equivalent; do not approximate with breakpoints. */
.sh-dims {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}

/* JS-computed bar width; 0.5s fill is not a compiled utility. */
.sh-dim-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .5s;
}

/* An unmeasured dimension used to render as a bar at width 0, which is
   the same picture as a dimension measured at zero. Hatching is the one
   thing on this card that a real score can never produce, so the two
   cannot be confused at a glance or in a screenshot. Full width on
   purpose: the track is not "none of it", it is "nobody looked". */
.sh-dim-bar-unmeasured {
    width: 100%;
    height: 100%;
    border-radius: 3px;
    background: repeating-linear-gradient(
        135deg,
        rgba(145, 158, 171, 0.55) 0 4px,
        transparent 4px 9px
    );
}

/* daisyUI sets `.stat-desc{white-space:nowrap}` because its stat
   component expects a short one-line caption. ION puts a key/value list
   in there instead, so every line ran off the card and was cut by the
   card's overflow-hidden. Four of the five cards were losing the end of
   their detail text, including "reason:", which is the field that says
   WHY a dimension scored what it did. */
.sh-dims .stat-desc,
.sh-dims .stat-title {
    white-space: normal;
}
.sh-dims .stat-desc > div {
    overflow-wrap: anywhere;
}

/* stat-value is sized for a two or three digit score. The words that
   replace a missing score overflow it, so they get their own size rather
   than being abbreviated to something ambiguous like "n/a". */
.sh-value-text {
    font-size: 20px;
    line-height: 1.2;
    white-space: normal;
}

/* Basis stated per card, rather than left to be inferred from a colour.
   The dashed rule survives greyscale and colour blindness. */
.sh-basis {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 2px;
}
.sh-basis-measured { color: var(--sev-low); }
.sh-basis-unmeasured {
    color: var(--sev-medium);
    border-bottom: 1px dashed currentColor;
}

/* A recommendation about something ION cannot see. Dashed, matching the
   unmeasured card, so it is not read as a ranked finding alongside the
   ones measured against real data. */
.sh-rec-unseen {
    background: transparent;
    border: 1px dashed var(--sev-medium);
    color: var(--ion-text);
}
.sh-badge-unseen {
    background: transparent;
    border: 1px dashed var(--sev-medium);
    color: var(--sev-medium);
}

/* Permanent furniture, not a tooltip. A reader should not have to hover
   to learn that hatching means nobody checked. */
.sh-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 12px;
}
.sh-legend-swatch {
    display: inline-block;
    width: 22px;
    height: 8px;
    border-radius: 2px;
    vertical-align: middle;
    margin-right: 7px;
}
.sh-legend-hatch {
    background: repeating-linear-gradient(
        135deg,
        rgba(145, 158, 171, 0.55) 0 4px,
        transparent 4px 9px
    );
}
</style>
<script nonce="{{ csp_nonce }}">
const API = '/api/soc-health';
function $(id){return document.getElementById(id)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function shLoad(){
    $('sh-content').innerHTML = '<div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Computing scorecard...</div>';
    try {
        const r = await fetch(API+'/scorecard');
        if(!r.ok) throw new Error('Failed');
        renderScorecard(await r.json());
    } catch(e) {
        $('sh-content').innerHTML = `<div role="alert" class="alert alert-error text-[var(--sev-critical)]">${esc(e.message)}</div>`;
    }
}

function gradeColor(score) {
    if (score >= 80) return 'var(--mitre-covered)';
    if (score >= 65) return 'var(--quality-good)';
    if (score >= 50) return 'var(--sev-medium)';
    if (score >= 35) return 'var(--sev-high)';
    return 'var(--sev-critical)';
}

// A dimension with no inputs reports score null rather than a neutral or
// zero number, so every read here has to tell "not measured" apart from
// "measured badly". `${null}` would otherwise render the text "null".
function shHasScore(v) { return v !== null && v !== undefined; }

function renderScorecard(d) {
    let html = '';
    const scored = shHasScore(d.overall_score);
    const color = scored ? gradeColor(d.overall_score) : 'var(--text-muted)';
    const pct = scored ? d.overall_score : 0;
    const shownOverall = scored ? (d.overall_score + '/100') : 'Not assessed';

    // How much of the weighting the overall score actually rests on.
    const unavailable = d.unavailable_dimensions || [];
    const basisNote = unavailable.length
        ? `Weighted over ${Math.round((d.weight_basis || 0) * 100)}% of the scorecard; `
          + `${unavailable.length} dimension${unavailable.length > 1 ? 's' : ''} `
          + `could not be measured (${unavailable.map(x => esc(x.replace(/_/g, ' '))).join(', ')}).`
        : 'All five dimensions measured.';

    // Overall grade
    html += `<div class="card bg-base-200 shadow mb-6">
        <div class="card-body flex-col sm:flex-row items-center gap-6">
        <div class="sh-grade-ring" data-ion-style="background:conic-gradient(${color} ${pct}%, rgba(99,110,123,.2) ${pct}%)">
            <div class="sh-grade-inner">
                <div class="font-mono text-4xl font-bold" data-ion-style="color:${color}">${esc(d.grade || '—')}</div>
                <div class="text-xs opacity-60">${scored ? d.overall_score + '/100' : 'n/a'}</div>
            </div>
        </div>
        <div>
            <div class="stat-title">SOC Maturity Score</div>
            <div class="stat-value">${shownOverall}</div>
            <div class="stat-desc">${scored ? `Grade <strong data-ion-style="color:${color}">${esc(d.grade)}</strong> — ${
                d.overall_score >= 80 ? 'Excellent maturity across all dimensions' :
                d.overall_score >= 65 ? 'Good maturity with some areas for improvement' :
                d.overall_score >= 50 ? 'Moderate maturity — several areas need attention' :
                d.overall_score >= 35 ? 'Below average — significant improvement needed' :
                'Critical — immediate action required across multiple dimensions'
            }` : 'No dimension could be measured, so no overall score is shown.'}</div>
            <div class="stat-desc opacity-60 mt-1">${basisNote}</div>
        </div>
        </div>
    </div>`;

    // Dimension cards
    const dims = d.dimensions || {};
    const dimOrder = ['detection_coverage', 'operational_efficiency', 'team_readiness', 'knowledge_completeness', 'integration_health'];
    const dimIcons = {
        detection_coverage: 'shield', operational_efficiency: 'zap',
        team_readiness: 'users', knowledge_completeness: 'book-open',
        integration_health: 'plug'
    };

    html += `<div class="sh-legend">
        <span><span class="sh-legend-swatch" data-ion-style="background:${gradeColor(100)}"></span>measured</span>
        <span><span class="sh-legend-swatch sh-legend-hatch"></span>not measured, which is not the same as zero</span>
    </div>`;
    html += '<div class="sh-dims">';
    for (const key of dimOrder) {
        const dim = dims[key];
        if (!dim) continue;
        const dimScored = shHasScore(dim.score);
        const dc = dimScored ? gradeColor(dim.score) : 'var(--text-muted)';
        const details = dim.details || {};
        let detailHtml = '';
        for (const [k, v] of Object.entries(details)) {
            if (v === null || v === undefined || v === '') continue;
            // Details now carry definitions and nested breakdowns. Render
            // them readably, and escape: these values reach the DOM.
            let shown;
            if (typeof v === 'object') {
                shown = Object.entries(v).map(([ik, iv]) => esc(ik) + ': ' + esc(String(iv))).join(', ');
            } else if (typeof v === 'boolean') {
                shown = v ? 'yes' : 'no';
            } else {
                shown = esc(String(v));
            }
            detailHtml += `<div><strong>${esc(k.replace(/_/g,' '))}:</strong> ${shown}</div>`;
        }
        // A measured zero and an unmeasured dimension must not render the
        // same. The score reads "not measured" rather than "n/a", which is
        // ambiguous, and the bar is hatched across its full width rather
        // than filled to 0%, which was indistinguishable from a real zero.
        const bar = dimScored
            ? `<div class="sh-dim-bar-fill" data-ion-style="width:${dim.score}%; background:${dc}"></div>`
            : '<div class="sh-dim-bar-unmeasured"></div>';
        const basis = dimScored
            ? '<div class="sh-basis sh-basis-measured">measured</div>'
            : '<div class="sh-basis sh-basis-unmeasured">not measured</div>';

        html += `<div class="card bg-base-200 shadow relative overflow-hidden" data-ion-style="--dim-color:${dc}">
            <div class="absolute top-0 left-0 right-0 h-[3px]" data-ion-style="background:${dc}"></div>
            <div class="stat">
                <div class="stat-title"><i class="icon-${dimIcons[key] || 'circle'}"></i> ${esc(dim.label)}</div>
                <div class="stat-value font-mono${dimScored ? '' : ' sh-value-text'}" data-ion-style="color:${dc}">${dimScored ? dim.score : 'not measured'}</div>
                ${basis}
                <div class="h-1.5 bg-base-300 rounded overflow-hidden my-2">${bar}</div>
                <div class="stat-desc">${detailHtml}</div>
            </div>
        </div>`;
    }
    html += '</div>';

    // Recommendations
    const recs = d.recommendations || [];
    if (recs.length) {
        html += '<div class="card bg-base-200 shadow"><div class="card-body"><h2 class="card-title text-sm uppercase tracking-wide opacity-60"><i class="icon-zap"></i> Improvement Recommendations</h2>';
        for (const rec of recs) {
            // A visibility gap is not a low-priority improvement. It says ION
            // cannot see the thing at all, so it carries the same dashed
            // treatment as the unmeasured card rather than a severity colour
            // that would rank it against findings ION actually measured.
            const unseen = rec.priority === 'visibility';
            const recKind = rec.priority === 'high' ? 'error'
                          : rec.priority === 'medium' ? 'warning' : 'info';
            html += `<div role="alert" class="alert ${unseen ? 'sh-rec-unseen' : 'alert-' + recKind}">
                <span class="badge badge-sm ${unseen ? 'sh-badge-unseen' : 'badge-' + recKind}">${esc(rec.area)}</span>
                <span>${esc(rec.message)}</span>
            </div>`;
        }
        html += '</div></div>';
    }

    $('sh-content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', shLoad);
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}SOC Health - ION{% endblock %}

{% block content %}
<div class="ion-tw ion-tw-page text-base-content overflow-x-hidden">
<div class="relative z-10 mx-auto max-w-[1920px] w-full px-4 sm:px-6 lg:px-10 xl:px-14 py-10 md:py-14">
<section class="flex flex-wrap items-end justify-between gap-6 mb-8 rise d-1">
<div class="basis-full md:basis-auto md:flex-1">
  <div class="flex items-center gap-3 mb-4">
    <svg class="w-4 h-4 text-ion-lime"><use href="#i-activity"/></svg>
    <span class="label-tiny text-ion-lime">Operational metrics</span>
  </div>
  <h1 class="font-sans font-semibold text-[36px] md:text-[44px] xl:text-[52px] leading-[1.05] tracking-[-0.02em]">SOC Health</h1>
  <p class="mt-3 max-w-2xl text-[15px] text-base-content/60">Cluster, ingest and SOC-wide KPIs.</p>
</div>
<div class="flex items-center gap-2 flex-wrap">
        <button class="btn btn-primary" data-click-action="shLoad">Refresh</button>
    </div>
</section>

<div id="sh-content"><div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Computing scorecard...</div></div>

</div><!-- /ion-tw inner -->
</div><!-- /ion-tw -->
{% endblock %}

{% block scripts %}
<style nonce="{{ csp_nonce }}">
/* Conic-gradient score ring: daisyUI radial-progress needs a CSS custom
   property set as a raw attribute, which CSP refuses. Geometry and inner
   disc have no utility equivalent. */
.sh-grade-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.sh-grade-inner {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--color-base-200);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* auto-fit minmax has no daisyUI grid equivalent; do not approximate with breakpoints. */
.sh-dims {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}

/* JS-computed bar width; 0.5s fill is not a compiled utility. */
.sh-dim-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width .5s;
}
</style>
<script nonce="{{ csp_nonce }}">
const API = '/api/soc-health';
function $(id){return document.getElementById(id)}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function shLoad(){
    $('sh-content').innerHTML = '<div class="flex justify-center items-center gap-2 py-14 text-center opacity-50"><span class="loading loading-spinner loading-sm text-primary"></span> Computing scorecard...</div>';
    try {
        const r = await fetch(API+'/scorecard');
        if(!r.ok) throw new Error('Failed');
        renderScorecard(await r.json());
    } catch(e) {
        $('sh-content').innerHTML = `<div role="alert" class="alert alert-error text-[var(--sev-critical)]">${esc(e.message)}</div>`;
    }
}

function gradeColor(score) {
    if (score >= 80) return 'var(--mitre-covered)';
    if (score >= 65) return 'var(--quality-good)';
    if (score >= 50) return 'var(--sev-medium)';
    if (score >= 35) return 'var(--sev-high)';
    return 'var(--sev-critical)';
}

function renderScorecard(d) {
    let html = '';
    const color = gradeColor(d.overall_score);

    // Overall grade
    html += `<div class="card bg-base-200 shadow mb-6">
        <div class="card-body flex-col sm:flex-row items-center gap-6">
        <div class="sh-grade-ring" data-ion-style="background:conic-gradient(${color} ${d.overall_score}%, rgba(99,110,123,.2) ${d.overall_score}%)">
            <div class="sh-grade-inner">
                <div class="font-mono text-4xl font-bold" data-ion-style="color:${color}">${esc(d.grade)}</div>
                <div class="text-xs opacity-60">${d.overall_score}/100</div>
            </div>
        </div>
        <div>
            <div class="stat-title">SOC Maturity Score</div>
            <div class="stat-value">${d.overall_score}/100</div>
            <div class="stat-desc">Grade <strong data-ion-style="color:${color}">${esc(d.grade)}</strong> — ${
                d.overall_score >= 80 ? 'Excellent maturity across all dimensions' :
                d.overall_score >= 65 ? 'Good maturity with some areas for improvement' :
                d.overall_score >= 50 ? 'Moderate maturity — several areas need attention' :
                d.overall_score >= 35 ? 'Below average — significant improvement needed' :
                'Critical — immediate action required across multiple dimensions'
            }</div>
        </div>
        </div>
    </div>`;

    // Dimension cards
    const dims = d.dimensions || {};
    const dimOrder = ['detection_coverage', 'operational_efficiency', 'team_readiness', 'knowledge_completeness', 'integration_health'];
    const dimIcons = {
        detection_coverage: 'shield', operational_efficiency: 'zap',
        team_readiness: 'users', knowledge_completeness: 'book-open',
        integration_health: 'plug'
    };

    html += '<div class="sh-dims">';
    for (const key of dimOrder) {
        const dim = dims[key];
        if (!dim) continue;
        const dc = gradeColor(dim.score);
        const details = dim.details || {};
        let detailHtml = '';
        for (const [k, v] of Object.entries(details)) {
            if (v != null) detailHtml += `<div><strong>${k.replace(/_/g,' ')}:</strong> ${v}</div>`;
        }
        html += `<div class="card bg-base-200 shadow relative overflow-hidden" data-ion-data-ion-style="--dim-color:${dc}">
            <div class="absolute top-0 left-0 right-0 h-[3px]" data-ion-style="background:${dc}"></div>
            <div class="stat">
                <div class="stat-title"><i class="icon-${dimIcons[key] || 'circle'}"></i> ${esc(dim.label)}</div>
                <div class="stat-value font-mono" data-ion-style="color:${dc}">${dim.score}</div>
                <div class="h-1.5 bg-base-300 rounded overflow-hidden my-2"><div class="sh-dim-bar-fill" data-ion-style="width:${dim.score}%; background:${dc}"></div></div>
                <div class="stat-desc">${detailHtml}</div>
            </div>
        </div>`;
    }
    html += '</div>';

    // Recommendations
    const recs = d.recommendations || [];
    if (recs.length) {
        html += '<div class="card bg-base-200 shadow"><div class="card-body"><h2 class="card-title text-sm uppercase tracking-wide opacity-60"><i class="icon-zap"></i> Improvement Recommendations</h2>';
        for (const rec of recs) {
            const recKind = rec.priority === 'high' ? 'error' : rec.priority === 'medium' ? 'warning' : 'info';
            html += `<div role="alert" class="alert alert-${recKind}">
                <span class="badge badge-sm badge-${recKind}">${esc(rec.area)}</span>
                <span>${esc(rec.message)}</span>
            </div>`;
        }
        html += '</div></div>';
    }

    $('sh-content').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', shLoad);
</script>
{% endblock %}

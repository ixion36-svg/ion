<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <style>
      .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <!-- radiating ops-network motif, right -->
  <g opacity="0.55" stroke="#1f2b40" stroke-width="1.5" fill="none">
    <circle cx="1020" cy="330" r="90"/>
    <circle cx="1020" cy="330" r="150"/>
    <circle cx="1020" cy="330" r="210"/>
    <line x1="1020" y1="330" x2="905" y2="195"/><line x1="1020" y1="330" x2="1150" y2="200"/>
    <line x1="1020" y1="330" x2="870" y2="360"/><line x1="1020" y1="330" x2="1175" y2="395"/>
    <line x1="1020" y1="330" x2="925" y2="475"/><line x1="1020" y1="330" x2="1130" y2="480"/>
  </g>
  <g fill="#0f1729" stroke="#26405a" stroke-width="1.5">
    <circle cx="905" cy="195" r="20"/><circle cx="1150" cy="200" r="20"/>
    <circle cx="870" cy="360" r="20"/><circle cx="1175" cy="395" r="20"/>
    <circle cx="925" cy="475" r="20"/><circle cx="1130" cy="480" r="20"/>
  </g>
  <circle cx="1020" cy="330" r="46" fill="#0d233a" stroke="#34d3ee" stroke-width="2.5"/>
  <text x="1020" y="337" text-anchor="middle" class="c mono" font-size="17" font-weight="700">ION</text>

  <!-- title block -->
  <text x="90" y="240" class="c" font-size="15" font-weight="700" letter-spacing="4">EXECUTIVE BRIEF</text>
  <text x="90" y="302" class="t" font-size="58" font-weight="800">ION — Intelligent</text>
  <text x="90" y="366" class="c" font-size="58" font-weight="800">Operating Network</text>
  <rect x="92" y="388" width="150" height="4" fill="#34d3ee"/>
  <text x="90" y="438" class="s" font-size="20">The SOC portal for air-gapped operations — from raw alert</text>
  <text x="90" y="468" class="s" font-size="20">to closed case, on one server-rendered platform.</text>

  <rect x="90" y="510" width="470" height="34" rx="6" fill="#0d233a" stroke="#34d3ee" stroke-width="1.5"/>
  <text x="106" y="533" class="c mono" font-size="14" font-weight="700">ION DRAFTS AND MEASURES · THE ANALYST DECIDES</text>

  <rect x="90" y="560" width="212" height="30" rx="6" fill="#0f1729" stroke="#26405a" stroke-width="1.3"/>
  <text x="106" y="580" class="s mono" font-size="13">A GUARDED GLASS PRODUCT</text>

  <text x="90" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Executive Brief</text>
  <text x="1190" y="688" class="s mono" font-size="13" text-anchor="end">01 / 03</text>
</svg>

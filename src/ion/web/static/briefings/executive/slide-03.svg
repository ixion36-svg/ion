<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .tile{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">THE PROOF</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Why it's trusted</text>
  <text x="64" y="142" class="s" font-size="17">Security posture is engineered and audited, not asserted — and the receipts ship with the product.</text>

  <!-- stat tiles, 2 rows x 3 -->
  <rect class="tile" x="64" y="180" width="368" height="160" rx="12"/>
  <text x="88" y="238" class="c mono" font-size="40" font-weight="800">20</text>
  <text x="88" y="270" class="t" font-size="16" font-weight="700">secure-by-design principles</text>
  <text x="88" y="294" class="s" font-size="14">audited every release — 19 Met,</text>
  <text x="88" y="314" class="s" font-size="14">1 Mostly Met, stated openly.</text>

  <rect class="tile" x="456" y="180" width="368" height="160" rx="12"/>
  <text x="480" y="238" class="c mono" font-size="40" font-weight="800">0</text>
  <text x="480" y="270" class="t" font-size="16" font-weight="700">inline styles or handlers</text>
  <text x="480" y="294" class="s" font-size="14">the whole UI renders under a</text>
  <text x="480" y="314" class="s" font-size="14">strict Content Security Policy.</text>

  <rect class="tile" x="848" y="180" width="368" height="160" rx="12"/>
  <text x="872" y="238" class="c mono" font-size="40" font-weight="800">743</text>
  <text x="872" y="270" class="t" font-size="16" font-weight="700">audited routes · 70 pages</text>
  <text x="872" y="294" class="s" font-size="14">down from 912 and 83 — attack</text>
  <text x="872" y="314" class="s" font-size="14">surface reduced by design review.</text>

  <rect class="tile" x="64" y="364" width="368" height="160" rx="12"/>
  <text x="88" y="422" class="c mono" font-size="40" font-weight="800">11+</text>
  <text x="88" y="454" class="t" font-size="16" font-weight="700">integrations, all local</text>
  <text x="88" y="478" class="s" font-size="14">Elastic, Kibana, TIDE, OpenCTI,</text>
  <text x="88" y="498" class="s" font-size="14">Arkime, Keycloak, GitLab, METIS…</text>

  <rect class="tile" x="456" y="364" width="368" height="160" rx="12"/>
  <text x="480" y="422" class="c mono" font-size="40" font-weight="800">100%</text>
  <text x="480" y="454" class="t" font-size="16" font-weight="700">local AI — no cloud calls</text>
  <text x="480" y="478" class="s" font-size="14">Bob runs on Ollama inside the</text>
  <text x="480" y="498" class="s" font-size="14">boundary; nothing leaves the estate.</text>

  <rect class="tile" x="848" y="364" width="368" height="160" rx="12"/>
  <text x="872" y="422" class="c mono" font-size="40" font-weight="800">sha256</text>
  <text x="872" y="454" class="t" font-size="16" font-weight="700">tamper-evident evidence ledger</text>
  <text x="872" y="478" class="s" font-size="14">pinned workbench evidence chains,</text>
  <text x="872" y="498" class="s" font-size="14">verifiable end to end.</text>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">Shipped privately as a Guarded Glass product — air-gap first, with the same rigour in every release.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Executive Brief</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">03 / 03</text>
</svg>

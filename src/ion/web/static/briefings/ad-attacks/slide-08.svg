<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.r{fill:#ef6a6a}.g{fill:#34d399}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style>
  <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef6a6a"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="56" class="c" font-size="13.5" font-weight="700" letter-spacing="3">STAGE 2 · CREDENTIAL ACCESS</text>
  <text x="62" y="100" class="t" font-size="38" font-weight="800">Password spraying</text>
  <text x="64" y="136" class="s" font-size="16.5">One or two common passwords (Spring2026!, Welcome1) tried across <tspan class="t">many</tspan> accounts — slow enough to dodge lockout.</text>

  <!-- diagram: one password fanning out -->
  <text x="64" y="186" class="t" font-size="17" font-weight="700">How it works</text>
  <rect x="64" y="210" width="170" height="70" rx="10" fill="#1c0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text x="149" y="240" text-anchor="middle" class="t" font-size="14" font-weight="700">Attacker</text>
  <text x="149" y="262" text-anchor="middle" class="r mono" font-size="11">1 password</text>
  <g stroke="#ef6a6a" stroke-width="2" fill="none">
    <line x1="236" y1="232" x2="392" y2="196" marker-end="url(#a8)"/>
    <line x1="236" y1="245" x2="392" y2="245" marker-end="url(#a8)"/>
    <line x1="236" y1="258" x2="392" y2="296" marker-end="url(#a8)"/>
    <line x1="236" y1="262" x2="392" y2="350" marker-end="url(#a8)"/>
  </g>
  <g class="s" font-size="12">
    <rect x="396" y="180" width="120" height="30" rx="6" fill="#0f1828" stroke="#2b4a66"/><text x="456" y="200" text-anchor="middle">alice</text>
    <rect x="396" y="230" width="120" height="30" rx="6" fill="#0f1828" stroke="#2b4a66"/><text x="456" y="250" text-anchor="middle">bob</text>
    <rect x="396" y="280" width="120" height="30" rx="6" fill="#0f1828" stroke="#2b4a66"/><text x="456" y="300" text-anchor="middle">carol</text>
    <rect x="396" y="335" width="120" height="30" rx="6" fill="#10261a" stroke="#34d399"/><text x="456" y="355" text-anchor="middle" class="g" font-weight="700">dave ✓ hit</text>
  </g>
  <text x="64" y="408" class="s" font-size="14">"Low and slow": a handful of tries per account avoids the lockout threshold, so each account looks fine in isolation.</text>
  <text x="64" y="436" class="s" font-size="13.5">MITRE: <tspan class="t mono" font-size="12.5">T1110.003 — Password Spraying</tspan>. The danger is the <tspan class="t">one success</tspan> hiding among the failures.</text>

  <!-- signal card -->
  <rect x="648" y="170" width="562" height="232" rx="12" fill="#0c1322" stroke="#34d3ee" stroke-width="1.5"/>
  <text x="672" y="204" class="c" font-size="14" font-weight="800">WHAT YOU SEE IN THE LOGS</text>
  <rect x="672" y="220" width="130" height="30" rx="6" fill="#0d233a" stroke="#34d3ee"/><text x="737" y="240" text-anchor="middle" class="c mono" font-size="13" font-weight="700">4625</text>
  <text x="812" y="240" class="s" font-size="13.5">failed logon</text>
  <rect x="900" y="220" width="130" height="30" rx="6" fill="#0d233a" stroke="#34d3ee"/><text x="965" y="240" text-anchor="middle" class="c mono" font-size="13" font-weight="700">4771</text>
  <text x="1040" y="240" class="s" font-size="13.5">Kerb pre-auth fail</text>
  <g class="s" font-size="14.5">
    <text x="672" y="284">• Many <tspan class="t" font-weight="700">different accounts</tspan> failing from <tspan class="t" font-weight="700">one source</tspan> in a window.</text>
    <text x="672" y="314">• Low failure count <tspan class="t">per account</tspan> (1–3) — deliberately under lockout.</text>
    <text x="672" y="344">• A <tspan class="g" font-weight="700">success (4624) right after</tspan> the failures = likely spray hit.</text>
    <text x="672" y="374">• Same failure reason / bad-password across the set.</text>
  </g>

  <!-- escalate -->
  <rect x="64" y="470" width="1146" height="150" rx="12" fill="#1a1208" stroke="#f5a524" stroke-width="1.5"/>
  <text x="86" y="508" font-size="15" font-weight="800" fill="#f5a524">ESCALATE WHEN…</text>
  <g class="s" font-size="16">
    <text x="86" y="542">• <tspan class="t" font-weight="700">Many distinct accounts</tspan> fail from a single source IP/host in a short window.</text>
    <text x="86" y="572">• A failure run is <tspan class="t" font-weight="700">followed by a successful logon</tspan> for one of those accounts — treat as a confirmed hit, escalate fast.</text>
    <text x="86" y="602">• Don't judge one account in isolation — pivot on the <tspan class="t" font-weight="700">source</tspan> and count the distinct targets.</text>
  </g>

  <text x="64" y="690" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Active Directory — L1 Field Guide</text>
  <text x="1216" y="690" class="s mono" font-size="13" text-anchor="end">08 / 12</text>
</svg>

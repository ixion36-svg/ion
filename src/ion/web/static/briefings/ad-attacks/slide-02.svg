<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.w{fill:#f5a524}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">THE TARGET</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Active Directory 101 — the crown jewels</text>

  <!-- left: what it is -->
  <text x="64" y="172" class="t" font-size="20" font-weight="700">What it is</text>
  <g class="s" font-size="16.5">
    <text x="64" y="208">The <tspan class="t" font-weight="700">phone book + lock system</tspan> for a Windows</text>
    <text x="64" y="232">network: every user, computer and group, and</text>
    <text x="64" y="256">the rules for who can access what.</text>
    <text x="64" y="300">The <tspan class="c" font-weight="700">Domain Controller (DC)</tspan> is the server that</text>
    <text x="64" y="324">holds it and answers every "can I log in?".</text>
    <text x="64" y="368">Users, computers, groups, policies = <tspan class="t" font-weight="700">objects</tspan>.</text>
  </g>
  <!-- nested hierarchy diagram, right -->
  <g>
    <rect x="690" y="150" width="520" height="300" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
    <text x="710" y="178" class="c mono" font-size="13" font-weight="700">FOREST</text>
    <rect x="712" y="194" width="476" height="234" rx="10" fill="#0f1828" stroke="#2b4a66" stroke-width="1.3"/>
    <text x="730" y="220" class="t mono" font-size="13" font-weight="700">DOMAIN  corp.local</text>
    <rect x="732" y="236" width="210" height="172" rx="8" fill="#111e30" stroke="#314f6b"/>
    <text x="748" y="260" class="s mono" font-size="12">OU: Workstations</text>
    <rect x="748" y="276" width="80" height="40" rx="6" fill="#16273c"/><text x="788" y="301" text-anchor="middle" class="s" font-size="11">PC</text>
    <rect x="846" y="276" width="80" height="40" rx="6" fill="#16273c"/><text x="886" y="301" text-anchor="middle" class="s" font-size="11">PC</text>
    <text x="748" y="346" class="s mono" font-size="12">OU: Users</text>
    <rect x="748" y="358" width="80" height="36" rx="6" fill="#16273c"/><text x="788" y="381" text-anchor="middle" class="s" font-size="11">user</text>
    <rect x="846" y="358" width="80" height="36" rx="6" fill="#16273c"/><text x="886" y="381" text-anchor="middle" class="s" font-size="11">svc</text>
    <!-- DC -->
    <circle cx="1070" cy="322" r="44" fill="#0d233a" stroke="#34d3ee" stroke-width="2.5"/>
    <text x="1070" y="318" text-anchor="middle" class="c mono" font-size="16" font-weight="700">DC</text>
    <text x="1070" y="338" text-anchor="middle" class="s" font-size="11">KDC · LDAP</text>
    <text x="1070" y="392" text-anchor="middle" class="s" font-size="12">holds the directory</text>
  </g>

  <!-- why attackers love it -->
  <rect x="64" y="500" width="1146" height="118" rx="12" fill="#1a1208" stroke="#f5a524" stroke-width="1.5"/>
  <text x="86" y="540" class="w" font-size="16" font-weight="800">WHY ATTACKERS LOVE IT</text>
  <g class="s" font-size="16">
    <text x="86" y="572">• AD is the single source of truth for identity — crack it and you decide who can touch every server, share and mailbox.</text>
    <text x="86" y="600">• One <tspan class="t" font-weight="700">Domain Admin</tspan> account (or the DC itself) = control of the whole estate. "Domain dominance" is the attacker's finish line.</text>
  </g>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Active Directory — L1 Field Guide</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">02 / 12</text>
</svg>

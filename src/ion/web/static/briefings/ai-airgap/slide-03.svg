<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.g{fill:#4ade80}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">REFERENCE ARCHITECTURE</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Everything the AI needs lives inside</text>

  <!-- boundary -->
  <rect x="64" y="140" width="1152" height="440" rx="16" fill="none" stroke="#26405a" stroke-width="2.5" stroke-dasharray="12 7"/>
  <text x="88" y="170" class="s mono" font-size="13" letter-spacing="2">SECURITY BOUNDARY</text>

  <!-- SIEM -->
  <rect x="104" y="220" width="180" height="80" rx="10" fill="#0f1729" stroke="#2b4a66" stroke-width="1.5"/>
  <text x="194" y="255" text-anchor="middle" class="t" font-size="16" font-weight="700">SIEM / telemetry</text>
  <text x="194" y="278" text-anchor="middle" class="s" font-size="12">alerts · pcap · logs</text>

  <!-- App -->
  <rect x="360" y="196" width="330" height="220" rx="12" fill="#0c1322" stroke="#34d3ee" stroke-width="2"/>
  <text x="380" y="228" class="c" font-size="16" font-weight="800">SOC PORTAL (ION)</text>
  <g class="s" font-size="13.5">
    <text x="380" y="258">Prompt assembly — budgeted layers:</text>
    <text x="392" y="282">persona → per-rule guide →</text>
    <text x="392" y="304">RAG (KB / cases / playbooks) →</text>
    <text x="392" y="326"><tspan class="g" font-weight="700">output contract (never dropped)</tspan></text>
    <text x="380" y="358">Server-side validation of every reply;</text>
    <text x="380" y="380">citations checked against real evidence.</text>
  </g>

  <!-- LLM host -->
  <rect x="770" y="196" width="190" height="100" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="2"/>
  <text x="865" y="232" text-anchor="middle" class="c mono" font-size="16" font-weight="700">LOCAL LLM HOST</text>
  <text x="865" y="256" text-anchor="middle" class="s" font-size="12">Ollama · GGUF side-load</text>
  <text x="865" y="276" text-anchor="middle" class="s" font-size="12">generation + embeddings</text>

  <!-- Postgres -->
  <rect x="770" y="330" width="416" height="130" rx="10" fill="#0f1729" stroke="#2b4a66" stroke-width="1.5"/>
  <text x="790" y="362" class="t" font-size="15" font-weight="700">Postgres + pgvector</text>
  <g class="s" font-size="12.5">
    <text x="790" y="386">case vectors · KB chunks · playbook vectors</text>
    <text x="790" y="406">feedback ledger · eval runs · prompt snapshots</text>
    <text x="790" y="430"><tspan class="g" font-weight="700">all local — regenerable or append-only</tspan></text>
  </g>

  <!-- Analyst -->
  <rect x="104" y="470" width="330" height="84" rx="10" fill="#0f1729" stroke="#2b4a66" stroke-width="1.5"/>
  <text x="124" y="502" class="t" font-size="15" font-weight="700">Analysts</text>
  <text x="124" y="526" class="s" font-size="13">advisory output only — a human ratifies</text>
  <text x="124" y="544" class="s" font-size="13">every consequential action</text>

  <!-- arrows -->
  <g stroke="#3a5a78" stroke-width="2" fill="none">
    <line x1="284" y1="260" x2="356" y2="280"/>
    <line x1="690" y1="246" x2="766" y2="246"/>
    <line x1="960" y1="296" x2="960" y2="326"/>
    <line x1="430" y1="416" x2="300" y2="466"/>
  </g>
  <g fill="#3a5a78">
    <polygon points="356,280 344,272 346,286"/>
    <polygon points="766,246 754,239 754,253"/>
    <polygon points="960,326 953,314 967,314"/>
    <polygon points="300,466 313,462 306,475"/>
  </g>

  <text x="640" y="618" text-anchor="middle" class="s" font-size="15">Models arrive as <tspan class="t" font-weight="700">versioned offline artefacts</tspan> — the same supply channel as the application image. No path crosses the boundary.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · AI in Air-Gapped Environments</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">03 / 12</text>
</svg>

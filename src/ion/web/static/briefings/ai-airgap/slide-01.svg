<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <!-- boundary motif, right: model inside a sealed box -->
  <g opacity="0.9">
    <rect x="860" y="180" width="330" height="330" rx="18" fill="#0c1322" stroke="#26405a" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="880" y="212" class="s mono" font-size="12" letter-spacing="2">SECURITY BOUNDARY</text>
    <circle cx="1025" cy="345" r="58" fill="#0d233a" stroke="#34d3ee" stroke-width="2.5"/>
    <text x="1025" y="340" text-anchor="middle" class="c mono" font-size="16" font-weight="700">LLM</text>
    <text x="1025" y="360" text-anchor="middle" class="s" font-size="11">local weights</text>
    <line x1="1190" y1="345" x2="1262" y2="345" stroke="#5b2330" stroke-width="3"/>
    <line x1="1226" y1="325" x2="1250" y2="365" stroke="#e5484d" stroke-width="3"/>
    <line x1="1250" y1="325" x2="1226" y2="365" stroke="#e5484d" stroke-width="3"/>
    <text x="1226" y="392" text-anchor="middle" class="s" font-size="11">no egress</text>
  </g>

  <text x="90" y="240" class="c" font-size="15" font-weight="700" letter-spacing="4">LESSONS LEARNED · BEST PRACTICES</text>
  <text x="90" y="302" class="t" font-size="56" font-weight="800">AI in Air-Gapped</text>
  <text x="90" y="366" class="c" font-size="56" font-weight="800">Environments</text>
  <rect x="92" y="390" width="150" height="4" fill="#34d3ee"/>
  <text x="90" y="438" class="s" font-size="20">Usage, deployment and controls for LLM capability inside a</text>
  <text x="90" y="468" class="s" font-size="20">disconnected security boundary — distilled from ION's development.</text>

  <rect x="90" y="512" width="252" height="34" rx="6" fill="#0d233a" stroke="#34d3ee" stroke-width="1.5"/>
  <text x="106" y="535" class="c mono" font-size="14" font-weight="700">13 PRINCIPLES · 10 INCIDENTS</text>
  <text x="358" y="535" class="s" font-size="15">Every practice was earned in production</text>

  <text x="90" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · AI in Air-Gapped Environments</text>
  <text x="1190" y="688" class="s mono" font-size="13" text-anchor="end">01 / 12</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.r{fill:#ef6a6a}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style>
  <marker id="b6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef6a6a"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="56" class="c" font-size="13.5" font-weight="700" letter-spacing="3">AD CERTIFICATE SERVICES · ESC1</text>
  <text x="62" y="100" class="t" font-size="38" font-weight="800">A certificate as anyone you like</text>
  <text x="64" y="136" class="s" font-size="16.5">A misconfigured certificate template lets a low-priv user request a cert that <tspan class="t">names someone else</tspan> — then log in as them.</text>

  <!-- vulnerable template conditions -->
  <rect x="64" y="178" width="470" height="190" rx="12" fill="#1c0f12" stroke="#ef4444" stroke-width="1.6"/>
  <text x="86" y="210" class="t" font-size="16" font-weight="800">A template is ESC1-vulnerable when ALL hold:</text>
  <g class="s" font-size="15">
    <text x="86" y="246">✓ <tspan class="t">Enrollee Supplies Subject</tspan> — you pick the name (SAN)</text>
    <text x="86" y="276">✓ <tspan class="t">Client Authentication EKU</tspan> — the cert can log in</text>
    <text x="86" y="306">✓ <tspan class="t">Low-priv users can enrol</tspan> (Domain/Authenticated Users)</text>
  </g>
  <text x="86" y="346" class="r" font-size="13.5" font-weight="700">→ request a cert with SAN = Administrator</text>

  <!-- flow -->
  <rect x="566" y="196" width="140" height="60" rx="9" fill="#0c1322" stroke="#26405a"/><text x="636" y="222" text-anchor="middle" class="t" font-size="13" font-weight="700">Low-priv</text><text x="636" y="240" text-anchor="middle" class="s" font-size="11">user</text>
  <line x1="708" y1="226" x2="800" y2="226" stroke="#ef6a6a" stroke-width="2" marker-end="url(#b6)"/>
  <circle cx="858" cy="226" r="40" fill="#0d233a" stroke="#34d3ee" stroke-width="2.5"/><text x="858" y="222" text-anchor="middle" class="c mono" font-size="13" font-weight="700">CA</text><text x="858" y="240" text-anchor="middle" class="s" font-size="10">AD CS</text>
  <line x1="916" y1="226" x2="1010" y2="226" stroke="#ef6a6a" stroke-width="2" marker-end="url(#b6)"/>
  <rect x="1014" y="196" width="196" height="60" rx="9" fill="#2a1116" stroke="#ef4444" stroke-width="1.6"/><text x="1112" y="220" text-anchor="middle" class="t" font-size="13" font-weight="700">cert "as Admin"</text><text x="1112" y="240" text-anchor="middle" class="r" font-size="11">→ PKINIT logon</text>
  <text x="636" y="290" class="s" font-size="12">requests cert,</text><text x="636" y="306" class="s" font-size="12">SAN=Administrator</text>
  <text x="1014" y="290" class="s" font-size="12">certs don't expire on</text><text x="1014" y="306" class="s" font-size="12">password reset → durable</text>

  <text x="64" y="404" class="s" font-size="13.5">MITRE: <tspan class="t mono" font-size="12.5">T1649 — Steal or Forge Authentication Certificates</tspan>. The cert is valid even after the victim changes their password.</text>

  <!-- signal -->
  <rect x="64" y="430" width="1146" height="118" rx="12" fill="#0c1322" stroke="#34d3ee" stroke-width="1.5"/>
  <text x="86" y="462" class="c" font-size="14" font-weight="800">WHAT YOU SEE — CA AUDIT EVENTS</text>
  <rect x="86" y="478" width="130" height="28" rx="6" fill="#0d233a" stroke="#34d3ee"/><text x="151" y="497" text-anchor="middle" class="c mono" font-size="12.5" font-weight="700">4886</text><text x="224" y="497" class="s" font-size="13">cert requested</text>
  <rect x="320" y="478" width="130" height="28" rx="6" fill="#0d233a" stroke="#34d3ee"/><text x="385" y="497" text-anchor="middle" class="c mono" font-size="12.5" font-weight="700">4887</text><text x="458" y="497" class="s" font-size="13">cert issued</text>
  <text x="86" y="534" class="s" font-size="14.5">Red flag: <tspan class="t" font-weight="700">Requester ≠ Subject/SAN</tspan> — the account asking isn't the account the cert is for, especially a <tspan class="t">privileged SAN</tspan>.</text>

  <rect x="64" y="566" width="1146" height="50" rx="10" fill="#1a1208" stroke="#f5a524" stroke-width="1.5"/>
  <text x="640" y="597" text-anchor="middle" class="s" font-size="15"><tspan fill="#f5a524" font-weight="800">ESCALATE: </tspan>a cert issued where <tspan class="t" font-weight="700">requester ≠ subject</tspan>, or a SAN naming a privileged account. (Needs CA auditing 4886/4887 enabled.)</text>

  <text x="64" y="690" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Active Directory — Advanced (L2)</text>
  <text x="1216" y="690" class="s mono" font-size="13" text-anchor="end">06 / 11</text>
</svg>

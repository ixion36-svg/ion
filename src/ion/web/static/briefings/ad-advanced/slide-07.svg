<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.r{fill:#ef6a6a}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style>
  <marker id="b7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef6a6a"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="56" class="c" font-size="13.5" font-weight="700" letter-spacing="3">AD CERTIFICATE SERVICES · ESC8</text>
  <text x="62" y="100" class="t" font-size="38" font-weight="800">ESC8 — relay a DC into a certificate</text>
  <text x="64" y="136" class="s" font-size="16.5">Chain coercion + NTLM relay: force the DC to authenticate, relay it to the AD CS <tspan class="t">web enrollment</tspan> page, and walk away with a DC certificate.</text>

  <!-- chain diagram -->
  <rect x="64" y="190" width="150" height="74" rx="10" fill="#1c0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text x="139" y="222" text-anchor="middle" class="t" font-size="14" font-weight="700">Attacker</text>
  <text x="139" y="242" text-anchor="middle" class="s" font-size="11">relay listener</text>

  <circle cx="400" cy="227" r="46" fill="#0d233a" stroke="#34d3ee" stroke-width="2.5"/>
  <text x="400" y="223" text-anchor="middle" class="c mono" font-size="14" font-weight="700">DC</text>
  <text x="400" y="241" text-anchor="middle" class="s" font-size="10">DC$</text>

  <rect x="606" y="190" width="170" height="74" rx="10" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="691" y="218" text-anchor="middle" class="t" font-size="13.5" font-weight="700">AD CS Web</text>
  <text x="691" y="238" text-anchor="middle" class="s" font-size="11">Enrollment (HTTP)</text>
  <text x="691" y="254" text-anchor="middle" class="s" font-size="10">no HTTPS/EPA</text>

  <rect x="1020" y="190" width="190" height="74" rx="10" fill="#2a1116" stroke="#ef4444" stroke-width="1.6"/>
  <text x="1115" y="218" text-anchor="middle" class="t" font-size="13.5" font-weight="700">DC certificate</text>
  <text x="1115" y="238" text-anchor="middle" class="r" font-size="11.5">→ DCSync → domain</text>

  <!-- step1 coerce -->
  <path d="M214 210 C 280 180, 320 180, 358 205" fill="none" stroke="#ef6a6a" stroke-width="2" marker-end="url(#b7)"/>
  <text x="286" y="172" text-anchor="middle" class="r mono" font-size="11.5">1 · coerce (PetitPotam)</text>
  <!-- step2 DC auth back -->
  <path d="M358 248 C 300 280, 240 280, 200 266" fill="none" stroke="#ef6a6a" stroke-width="2" marker-end="url(#b7)"/>
  <text x="280" y="300" text-anchor="middle" class="r mono" font-size="11.5">2 · DC NTLM auth → attacker</text>
  <!-- step3 relay -->
  <line x1="214" y1="227" x2="600" y2="227" stroke="#475c78" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b7)"/>
  <text x="410" y="338" text-anchor="middle" class="s mono" font-size="11.5">3 · relay that auth to the web enrollment endpoint</text>
  <!-- step4 cert -->
  <line x1="778" y1="227" x2="1016" y2="227" stroke="#ef6a6a" stroke-width="2" marker-end="url(#b7)"/>
  <text x="898" y="217" text-anchor="middle" class="r mono" font-size="11.5">4 · enrol as DC$</text>

  <text x="64" y="392" class="s" font-size="15">A DC certificate authenticates <tspan class="t">as the DC</tspan> — which can DCSync the whole domain. Minutes from low-priv to game over.</text>
  <text x="64" y="420" class="s" font-size="13.5">MITRE: <tspan class="t mono" font-size="12.5">T1187 Forced Authentication + T1557 Relay + T1649 Forge Certificates</tspan>.</text>

  <!-- signal -->
  <rect x="64" y="448" width="1146" height="100" rx="12" fill="#0c1322" stroke="#34d3ee" stroke-width="1.5"/>
  <text x="86" y="480" class="c" font-size="14" font-weight="800">WHAT YOU SEE</text>
  <g class="s" font-size="14.5">
    <text x="86" y="510">• <tspan class="t" font-weight="700">NTLM authentication to the AD CS web endpoint</tspan>, sourced from a host that isn't the real DC (the relay).</text>
    <text x="86" y="536">• <tspan class="t mono" font-size="13.5">4886/4887</tspan> issuing a cert to a <tspan class="t">DC machine account</tspan> at an odd time/source; coercion RPC just beforehand.</text>
  </g>

  <rect x="64" y="566" width="1146" height="50" rx="10" fill="#2a1116" stroke="#ef4444" stroke-width="1.6"/>
  <text x="640" y="597" text-anchor="middle" class="s" font-size="15"><tspan fill="#ef6a6a" font-weight="800">ESCALATE IMMEDIATELY: </tspan>a DC certificate enrolled via web enrollment + a relay/coercion pattern = imminent domain compromise.</text>

  <text x="64" y="690" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Active Directory — Advanced (L2)</text>
  <text x="1216" y="690" class="s mono" font-size="13" text-anchor="end">07 / 11</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .pane{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d3ee"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">OPERATE · P19–P20</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Assume flaws. Plan for them. Keep going.</text>
  <text x="64" y="142" class="s" font-size="17">Security work does not end at release — the operating rhythm is the control.</text>

  <!-- cycle motif -->
  <g transform="translate(1050,360)" fill="none">
    <path d="M 0 -95 A 95 95 0 1 1 -67 67" stroke="#34d3ee" stroke-width="7" stroke-linecap="round"/>
    <polygon points="-78,82 -50,72 -62,98" fill="#34d3ee"/>
    <path d="M 0 -60 A 60 60 0 1 0 42 -42" stroke="#26405a" stroke-width="5" stroke-linecap="round"/>
    <text y="-4" text-anchor="middle" class="t" font-size="15" font-weight="700">release</text>
    <text y="16" text-anchor="middle" class="s" font-size="12">assess · fix · repeat</text>
  </g>

  <rect class="pane" x="64" y="190" width="840" height="160" rx="12"/>
  <text x="88" y="224" class="c mono" font-size="14" font-weight="800">P19 · PLAN FOR SECURITY FLAWS</text>
  <g class="s" font-size="15.5">
    <text x="88" y="256">Flaws are expected, so the machinery for handling them exists before they do: a</text>
    <text x="88" y="280">per-release security assessment that names new surface honestly, a changelog that</text>
    <text x="88" y="304">records regressions and their fixes, and version upgrades that go through CAB</text>
    <text x="88" y="328">change control on the customer side.</text>
  </g>

  <rect class="pane" x="64" y="370" width="840" height="156" rx="12"/>
  <text x="88" y="404" class="c mono" font-size="14" font-weight="800">P20 · CONTINUOUS RISK MANAGEMENT — THROUGH-LIFE</text>
  <g class="s" font-size="15.5">
    <text x="88" y="436">Risk decisions are revisited, not archived: the principles audit re-runs against the</text>
    <text x="88" y="460">code as it is now, open gaps carry owners and closure records, and dependency</text>
    <text x="88" y="484">risk is tracked continuously — the SBOM in every image is what makes a CVE</text>
    <text x="88" y="508">announcement answerable in minutes, offline.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">The gap list shrinking release over release — with receipts — IS the operating model.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Secure by Design</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">08 / 11</text>
</svg>

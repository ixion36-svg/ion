<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .gate{fill:#0f1828;stroke:#2b4a66;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d3ee"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">BUILD &amp; VERIFY · P14–P18</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">The pipeline is part of the product</text>
  <text x="64" y="142" class="s" font-size="17">Code quality, repository integrity and the build chain are security surfaces — and gated like it.</text>

  <!-- pipeline with gates -->
  <g>
    <rect class="gate" x="64" y="200" width="200" height="88" rx="12"/>
    <text x="88" y="234" class="t" font-size="15" font-weight="700">P14 · Clean code</text>
    <text x="88" y="258" class="s" font-size="13">lint + typing + review;</text>
    <text x="88" y="276" class="s" font-size="13">terse, honest comments</text>

    <rect class="gate" x="304" y="200" width="200" height="88" rx="12"/>
    <text x="328" y="234" class="t" font-size="15" font-weight="700">P15 · Secure repo</text>
    <text x="328" y="258" class="s" font-size="13">private, protected main,</text>
    <text x="328" y="276" class="s" font-size="13">no secrets in history</text>

    <rect class="gate" x="544" y="200" width="200" height="88" rx="12"/>
    <text x="568" y="234" class="t" font-size="15" font-weight="700">P16 · Secure build</text>
    <text x="568" y="258" class="s" font-size="13">pinned base images,</text>
    <text x="568" y="276" class="s" font-size="13">SBOM in every image</text>

    <rect class="gate" x="784" y="200" width="200" height="88" rx="12"/>
    <text x="808" y="234" class="t" font-size="15" font-weight="700">P17 · Kill the class</text>
    <text x="808" y="258" class="s" font-size="13">not the bug — the whole</text>
    <text x="808" y="276" class="s" font-size="13">category it came from</text>

    <rect x="1024" y="200" width="192" height="88" rx="12" fill="#0d233a" stroke="#34d3ee" stroke-width="2"/>
    <text x="1048" y="234" class="c" font-size="15" font-weight="700">P18 · Keep testing</text>
    <text x="1048" y="258" class="s" font-size="13">CodeQL + suites on</text>
    <text x="1048" y="276" class="s" font-size="13">every change</text>

    <line x1="266" y1="244" x2="300" y2="244" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="506" y1="244" x2="540" y2="244" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="746" y1="244" x2="780" y2="244" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="986" y1="244" x2="1020" y2="244" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <rect x="64" y="330" width="1152" height="196" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="88" y="364" class="c" font-size="14" font-weight="800">WHAT "ELIMINATE THE CLASS" LOOKS LIKE IN PRACTICE</text>
  <g class="s" font-size="15.5">
    <text x="88" y="398">Inline handlers weren't fixed one XSS at a time — all ~1,150 were retired so the CSP could ban the</text>
    <text x="88" y="422">attribute. Inline styles went the same way: 1,820 migrated to hashed classes, then <tspan class="t mono" font-weight="700">style-src-attr 'none'</tspan>.</text>
    <text x="88" y="446">Weak dependencies get replaced, not patched around. A vulnerability class that cannot recur</text>
    <text x="88" y="470">is worth ten patched instances of it — and the migration tooling ships in the repo, so the</text>
    <text x="88" y="494">next sweep starts from a script instead of a memory.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">A release that fails its checks does not ship — the checker, not the calendar, decides.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Secure by Design</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">06 / 11</text>
</svg>

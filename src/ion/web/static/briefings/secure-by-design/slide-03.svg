<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .row{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">DESIGN I · P4–P8</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">The classical defences, taken literally</text>
  <text x="64" y="142" class="s" font-size="17">Saltzer &amp; Schroeder's principles are fifty years old because they keep being right.</text>

  <!-- concentric rings motif -->
  <g transform="translate(1075,395)" fill="none">
    <circle r="110" stroke="#1f2b40" stroke-width="2"/>
    <circle r="78" stroke="#26405a" stroke-width="2"/>
    <circle r="46" stroke="#2b4a66" stroke-width="2"/>
    <circle r="16" fill="#0d233a" stroke="#34d3ee" stroke-width="2"/>
  </g>
  <text x="1075" y="545" text-anchor="middle" class="s" font-size="12">defence in depth, literally</text>

  <g>
    <rect class="row" x="64" y="184" width="840" height="76" rx="10"/>
    <text x="88" y="214" class="c mono" font-size="13.5" font-weight="800">P4 · ESTABLISH CONTEXT  <tspan class="s" font-weight="400">— know the deployment before designing for it</tspan></text>
    <text x="88" y="242" class="s" font-size="14.5">Air-gapped, siloed, hostile-adjacent networks are the stated context — every feature is judged against it.</text>

    <rect class="row" x="64" y="272" width="840" height="76" rx="10"/>
    <text x="88" y="302" class="c mono" font-size="13.5" font-weight="800">P5 · DEFENCE IN DEPTH  <tspan class="s" font-weight="400">— no single control stands alone</tspan></text>
    <text x="88" y="330" class="s" font-size="14.5">Auth, CSRF, CSP, per-service ownership checks and audit logging layer — a bypass meets the next layer.</text>

    <rect class="row" x="64" y="360" width="840" height="76" rx="10"/>
    <text x="88" y="390" class="c mono" font-size="13.5" font-weight="800">P6 · LEAST PRIVILEGE  <tspan class="s" font-weight="400">— every identity gets the minimum</tspan></text>
    <text x="88" y="418" class="s" font-size="14.5">Role-scoped users, DE's four separate permissions, and METIS's scoped, hard-expiring service token.</text>

    <rect class="row" x="64" y="448" width="840" height="76" rx="10"/>
    <text x="88" y="478" class="c mono" font-size="13.5" font-weight="800">P7 · SECURE DEFAULTS  <tspan class="s" font-weight="400">— safe out of the box, opt IN to risk</tspan></text>
    <text x="88" y="506" class="s" font-size="14.5">Optional AI surfaces ship disabled behind admin toggles; modules absent unless licensed on.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">P8 · Complete mediation — every request re-checks authorisation; nothing rides on a cached "yes".</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Secure by Design</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">03 / 11</text>
</svg>

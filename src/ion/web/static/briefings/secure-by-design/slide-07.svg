<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .pane{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">VERIFICATION IN PRACTICE</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Shrinking the thing an attacker attacks</text>
  <text x="64" y="142" class="s" font-size="17">Verification isn't only tests passing — it's the measured reduction of what exists to be attacked.</text>

  <!-- shrinking bars -->
  <g>
    <text x="64" y="212" class="t" font-size="16" font-weight="700">Routes</text>
    <rect x="64" y="226" width="912" height="30" rx="6" fill="#1f2b40"/>
    <rect x="64" y="226" width="743" height="30" rx="6" fill="#0d233a" stroke="#34d3ee" stroke-width="1.5"/>
    <text x="88" y="247" class="c mono" font-size="14" font-weight="700">743 audited</text>
    <text x="990" y="247" class="s mono" font-size="13">was 912</text>

    <text x="64" y="302" class="t" font-size="16" font-weight="700">Pages</text>
    <rect x="64" y="316" width="830" height="30" rx="6" fill="#1f2b40"/>
    <rect x="64" y="316" width="700" height="30" rx="6" fill="#0d233a" stroke="#34d3ee" stroke-width="1.5"/>
    <text x="88" y="337" class="c mono" font-size="14" font-weight="700">70 pages</text>
    <text x="908" y="337" class="s mono" font-size="13">was 83</text>

    <text x="64" y="392" class="t" font-size="16" font-weight="700">Inline script/style attributes</text>
    <rect x="64" y="406" width="500" height="30" rx="6" fill="#1f2b40"/>
    <rect x="64" y="406" width="4" height="30" rx="2" fill="#34d3ee"/>
    <text x="88" y="427" class="c mono" font-size="14" font-weight="700">0</text>
    <text x="578" y="427" class="s mono" font-size="13">was ~2,970 — CSP now blocks the attribute itself</text>
  </g>

  <rect class="pane" x="64" y="462" width="560" height="80" rx="12"/>
  <text x="88" y="494" class="c" font-size="14" font-weight="800">STATIC ANALYSIS THAT GATES</text>
  <text x="88" y="522" class="s" font-size="14.5">CodeQL runs on every change; findings block, and the fix is reviewed like code — because it is.</text>

  <rect class="pane" x="656" y="462" width="560" height="80" rx="12"/>
  <text x="680" y="494" class="c" font-size="14" font-weight="800">EVIDENCE INTEGRITY</text>
  <text x="680" y="522" class="s" font-size="14.5">The workbench ledger chains evidence with sha256 — an edit after the fact is visible, by design.</text>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">The route audit read every endpoint by hand — and nearly every phase found a bug the tests hadn't.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Secure by Design</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">07 / 11</text>
</svg>

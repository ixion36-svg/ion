<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .pane{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">RETRIEVAL &amp; MEMORY</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Grounded in what this SOC knows</text>
  <text x="64" y="142" class="s" font-size="17">Answers cite local sources — the knowledge base, the playbooks, past cases, and cached threat intel.</text>

  <!-- vector cluster motif, right -->
  <g opacity="0.75">
    <g fill="#1f2b40"><circle cx="1010" cy="240" r="5"/><circle cx="1050" cy="265" r="5"/><circle cx="985" cy="285" r="5"/><circle cx="1090" cy="235" r="5"/><circle cx="1120" cy="290" r="5"/></g>
    <g fill="#34d3ee"><circle cx="1030" cy="255" r="6"/><circle cx="1065" cy="248" r="6"/><circle cx="1045" cy="285" r="6"/></g>
    <circle cx="1046" cy="262" r="46" fill="none" stroke="#34d3ee" stroke-width="1.3" stroke-dasharray="5 5"/>
    <text x="1046" y="335" text-anchor="middle" class="s" font-size="12">nearest neighbours, not keywords</text>
  </g>

  <rect class="pane" x="64" y="196" width="560" height="150" rx="12"/>
  <text x="88" y="228" class="c" font-size="14" font-weight="800">KNOWLEDGE, CHUNKED</text>
  <g class="s" font-size="15">
    <text x="88" y="258">The KB is embedded at <tspan class="t" font-weight="700">chunk level</tspan>, so retrieval</text>
    <text x="88" y="282">returns the paragraph that answers the question,</text>
    <text x="88" y="306">not a 3,000-word article to skim. Playbooks get</text>
    <text x="88" y="330">the same treatment as their own RAG layer.</text>
  </g>

  <rect class="pane" x="64" y="366" width="560" height="150" rx="12"/>
  <text x="88" y="398" class="c" font-size="14" font-weight="800">INVESTIGATION MEMORY</text>
  <g class="s" font-size="15">
    <text x="88" y="428">Closed cases feed back in: how similar alerts were</text>
    <text x="88" y="452">judged, which closures held up, what the SOC's own</text>
    <text x="88" y="476">precedent is. Bob's case analysis reads the same</text>
    <text x="88" y="500">memory the analyst sees.</text>
  </g>

  <rect class="pane" x="656" y="366" width="560" height="150" rx="12"/>
  <text x="680" y="398" class="c" font-size="14" font-weight="800">THREAT INTEL, CACHED LOCALLY</text>
  <g class="s" font-size="15">
    <text x="680" y="428">OpenCTI reports are cached inside the boundary and</text>
    <text x="680" y="452">embedded — TI context arrives in the prompt stack</text>
    <text x="680" y="476">without a live feed, which an air-gapped estate</text>
    <text x="680" y="500">does not have.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">pgvector under everything: case similarity, KB retrieval and TI context are one engine, one database.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">05 / 13</text>
</svg>

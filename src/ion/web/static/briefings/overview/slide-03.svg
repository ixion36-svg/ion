<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .stage{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d3ee"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">THE CORE LOOP</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">From alert to closed case</text>
  <text x="64" y="142" class="s" font-size="17">One shared alert renderer everywhere, and a case surface built from widgets rather than tabs.</text>

  <!-- pipeline -->
  <rect class="stage" x="64" y="196" width="256" height="130" rx="12"/>
  <text x="88" y="230" class="t" font-size="17" font-weight="700">Alerts land</text>
  <text x="88" y="258" class="s" font-size="14">source-driven filters,</text>
  <text x="88" y="278" class="s" font-size="14">per-alert extracted values,</text>
  <text x="88" y="298" class="s" font-size="14">filters drive the aggregates</text>

  <line x1="322" y1="261" x2="368" y2="261" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>

  <rect class="stage" x="372" y="196" width="256" height="130" rx="12"/>
  <text x="396" y="230" class="t" font-size="17" font-weight="700">Cases form</text>
  <text x="396" y="258" class="s" font-size="14">grouped, deduplicated,</text>
  <text x="396" y="278" class="s" font-size="14">observables auto-extracted</text>
  <text x="396" y="298" class="s" font-size="14">and enriched on arrival</text>

  <line x1="630" y1="261" x2="676" y2="261" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>

  <rect class="stage" x="680" y="196" width="256" height="130" rx="12"/>
  <text x="704" y="230" class="t" font-size="17" font-weight="700">Analyst works</text>
  <text x="704" y="258" class="s" font-size="14">wide inset case overlay —</text>
  <text x="704" y="278" class="s" font-size="14">one click to open, the same</text>
  <text x="704" y="298" class="s" font-size="14">alert detail as /alerts</text>

  <line x1="938" y1="261" x2="984" y2="261" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>

  <rect class="stage" x="988" y="196" width="228" height="130" rx="12"/>
  <text x="1012" y="230" class="t" font-size="17" font-weight="700">Case closes</text>
  <text x="1012" y="258" class="s" font-size="14">AI-drafted closure note,</text>
  <text x="1012" y="278" class="s" font-size="14">reviewed and signed by</text>
  <text x="1012" y="298" class="s" font-size="14">the analyst — always</text>

  <!-- supporting row -->
  <rect x="64" y="366" width="560" height="160" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="88" y="400" class="c" font-size="14" font-weight="800">EVIDENCE THAT HOLDS UP</text>
  <g class="s" font-size="15">
    <text x="88" y="432">Pinned evidence in the workbench forms a</text>
    <text x="88" y="456"><tspan class="t mono" font-weight="700">sha256</tspan> chain — tamper-evident, verifiable,</text>
    <text x="88" y="480">and ownership-checked inside the service</text>
    <text x="88" y="504">before every mutation.</text>
  </g>

  <rect x="656" y="366" width="560" height="160" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="680" y="400" class="c" font-size="14" font-weight="800">SIMILAR CASES, INSTANTLY</text>
  <g class="s" font-size="15">
    <text x="680" y="432">Every case is embedded with <tspan class="t mono" font-weight="700">pgvector</tspan> —</text>
    <text x="680" y="456">"have we seen this before?" is one query,</text>
    <text x="680" y="480">surfacing past investigations and their</text>
    <text x="680" y="504">outcomes beside the live case.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">Case open went from eight clicks to one — the redesign was measured, not guessed.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">03 / 13</text>
</svg>

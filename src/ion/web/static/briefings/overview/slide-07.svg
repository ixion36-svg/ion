<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .step{fill:#0f1828;stroke:#2b4a66;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d3ee"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">DETECTION ENGINEERING · OPTIONAL MODULE</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">The SOC improves its own detections</text>
  <text x="64" y="142" class="s" font-size="17">A workflow from noisy reality to better rules — measured, proposed, verified, approved. Never automatic.</text>

  <!-- loop: measure -> quirk -> proposal -> rule -->
  <g>
    <rect class="step" x="80" y="210" width="250" height="96" rx="12"/>
    <text x="104" y="244" class="t" font-size="16" font-weight="700">Measure</text>
    <text x="104" y="268" class="s" font-size="13.5">DE metrics — read-only</text>
    <text x="104" y="288" class="s" font-size="13.5">truth about rule behaviour</text>

    <rect class="step" x="380" y="210" width="250" height="96" rx="12"/>
    <text x="404" y="244" class="t" font-size="16" font-weight="700">Record quirks</text>
    <text x="404" y="268" class="s" font-size="13.5">known-benign behaviour:</text>
    <text x="404" y="288" class="s" font-size="13.5">verified · scoped · expiring</text>

    <rect class="step" x="680" y="210" width="250" height="96" rx="12"/>
    <text x="704" y="244" class="t" font-size="16" font-weight="700">Propose</text>
    <text x="704" y="268" class="s" font-size="13.5">Bob drafts the change;</text>
    <text x="704" y="288" class="s" font-size="13.5">a human owns the proposal</text>

    <rect x="980" y="210" width="236" height="96" rx="12" fill="#0d233a" stroke="#34d3ee" stroke-width="2"/>
    <text x="1004" y="244" class="c" font-size="16" font-weight="700">Verify &amp; approve</text>
    <text x="1004" y="268" class="s" font-size="13.5">separate permissions —</text>
    <text x="1004" y="288" class="s" font-size="13.5">proposer never approves</text>

    <line x1="332" y1="258" x2="376" y2="258" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="632" y1="258" x2="676" y2="258" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="932" y1="258" x2="976" y2="258" stroke="#34d3ee" stroke-width="2" marker-end="url(#ar)"/>
  </g>

  <!-- the guarantee panel -->
  <rect x="64" y="356" width="1152" height="170" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="88" y="390" class="c" font-size="14" font-weight="800">THE ANTI-ABUSE GUARANTEE — ENFORCED, NOT DOCUMENTED</text>
  <g class="s" font-size="15.5">
    <text x="88" y="422">A System Quirk <tspan class="t" font-weight="700">annotates</tspan> matching alerts as advisory context. It can <tspan class="t" font-weight="700">never hide, close, or suppress</tspan> one —</text>
    <text x="88" y="446">the temptation every allowlist system gives an overloaded SOC is designed out. Quirks carry a scope, a</text>
    <text x="88" y="470">human verifier, and an expiry date; an expired quirk stops annotating by itself. The four DE permissions</text>
    <text x="88" y="494">(<tspan class="t mono" font-weight="700">read · propose · verify · approve</tspan>) are distinct, so no single person can walk a change through alone.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">Optional by licence — a SOC that doesn't do detection engineering never sees the module.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">07 / 13</text>
</svg>

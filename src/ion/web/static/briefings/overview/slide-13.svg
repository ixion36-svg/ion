<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <!-- forward chevrons -->
  <g fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M950 260 L1030 360 L950 460" stroke="#1f2b40"/>
    <path d="M1020 260 L1100 360 L1020 460" stroke="#26405a"/>
    <path d="M1090 260 L1170 360 L1090 460" stroke="#34d3ee"/>

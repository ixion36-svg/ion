  <text x="90" y="240" class="c" font-size="15" font-weight="700" letter-spacing="4">WHERE ION GOES</text>
  <text x="90" y="302" class="t" font-size="58" font-weight="800">Shipped quietly,</text>
  <text x="90" y="366" class="c" font-size="58" font-weight="800">improved constantly</text>
  <rect x="92" y="388" width="150" height="4" fill="#34d3ee"/>
  <g class="s" font-size="19">

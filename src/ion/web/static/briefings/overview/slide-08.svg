<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .pane{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#34d3ee"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">DETECTION HEALTH</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Every rule earns its keep</text>
  <text x="64" y="142" class="s" font-size="17">A per-rule performance dashboard, built entirely from data ION already collects at triage time.</text>

  <!-- feedback circle motif -->
  <g transform="translate(985,330)">
    <circle r="120" fill="none" stroke="#1f2b40" stroke-width="10"/>
    <path d="M 0 -120 A 120 120 0 1 1 -104 60" fill="none" stroke="#34d3ee" stroke-width="10" stroke-linecap="round"/>
    <polygon points="-114,78 -86,66 -100,94" fill="#34d3ee"/>
    <text y="-14" text-anchor="middle" class="t" font-size="17" font-weight="700">IR feeds</text>
    <text y="10" text-anchor="middle" class="t" font-size="17" font-weight="700">detection</text>
    <text y="36" text-anchor="middle" class="s" font-size="12">the loop, closed</text>
  </g>

  <rect class="pane" x="64" y="190" width="720" height="160" rx="12"/>
  <text x="88" y="224" class="c" font-size="14" font-weight="800">WHAT EACH RULE SHOWS</text>
  <g class="s" font-size="15.5">
    <text x="88" y="256">Fire volume, true/false-positive balance from real case outcomes,</text>
    <text x="88" y="280">closure reasons, time-to-triage — <tspan class="t" font-weight="700">the AIFeedback ledger</tspan> records the</text>
    <text x="88" y="304">verdict at fire time and again at case close, so the score reflects</text>
    <text x="88" y="328">what analysts actually decided, not what the rule author hoped.</text>
  </g>

  <rect class="pane" x="64" y="370" width="720" height="156" rx="12"/>
  <text x="88" y="404" class="c" font-size="14" font-weight="800">WHAT THE SOC DOES WITH IT</text>
  <g class="s" font-size="15.5">
    <text x="88" y="436">A rule that only ever ends in <tspan class="t mono" font-weight="700">false_positive</tspan> is a tuning candidate;</text>
    <text x="88" y="460">one that never fires is a coverage question. Both become Detection</text>
    <text x="88" y="484">Engineering proposals with the evidence attached — the dashboard</text>
    <text x="88" y="508">is where the DE module finds its work.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">No new agents, no new data — the feedback loop was already in the database, waiting to be read.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">08 / 13</text>
</svg>

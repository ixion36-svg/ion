  <!-- title block -->
  <text x="90" y="240" class="c" font-size="15" font-weight="700" letter-spacing="4">FULL OVERVIEW</text>
  <text x="90" y="302" class="t" font-size="58" font-weight="800">The complete</text>
  <text x="90" y="366" class="c" font-size="58" font-weight="800">capability tour</text>
  <rect x="92" y="388" width="150" height="4" fill="#34d3ee"/>
  <text x="90" y="438" class="s" font-size="20">Server-rendered, no SPA. Air-gapped by design. Postgres +</text>
  <text x="90" y="468" class="s" font-size="20">pgvector, Keycloak OIDC, and a local LLM called Bob.</text>


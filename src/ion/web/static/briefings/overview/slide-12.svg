<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .band{fill:#0f1729;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">PLATFORM &amp; OPERATIONS</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Boring on purpose, observable by default</text>
  <text x="64" y="142" class="s" font-size="17">A deliberately small stack that one team can reason about, ship, and run disconnected.</text>

  <!-- platform cross-section, left -->
  <g>
    <rect class="band" x="64" y="196" width="520" height="62" rx="8"/>
    <text x="88" y="222" class="t" font-size="15" font-weight="700">Server-rendered UI — no SPA</text>
    <text x="88" y="244" class="s" font-size="12.5">Jinja2 templates, strict CSP, zero inline styles or handlers</text>
    <rect class="band" x="64" y="264" width="520" height="62" rx="8"/>
    <text x="88" y="290" class="t" font-size="15" font-weight="700">FastAPI · 4 uvicorn workers</text>
    <text x="88" y="312" class="s" font-size="12.5">leader election via advisory locks for background loops</text>
    <rect class="band" x="64" y="332" width="520" height="62" rx="8"/>
    <text x="88" y="358" class="t" font-size="15" font-weight="700">Postgres + pgvector</text>
    <text x="88" y="380" class="s" font-size="12.5">one database for state, search and embeddings</text>
    <rect class="band" x="64" y="400" width="520" height="62" rx="8"/>
    <text x="88" y="426" class="t" font-size="15" font-weight="700">Docker Compose deployment</text>
    <text x="88" y="448" class="s" font-size="12.5">offline package scripts; delivered by tarball into the air gap</text>
  </g>

  <rect x="632" y="196" width="584" height="128" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="656" y="228" class="c" font-size="14" font-weight="800">OBSERVABLE</text>
  <g class="s" font-size="15">
    <text x="656" y="258"><tspan class="t" font-weight="700">Prometheus metrics</tspan> and <tspan class="t" font-weight="700">Elastic APM</tspan> hooks —</text>
    <text x="656" y="282">the SOC's own platform is monitored with the same</text>
    <text x="656" y="306">seriousness as the estates it watches.</text>
  </g>

  <rect x="632" y="344" width="584" height="118" rx="12" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="656" y="376" class="c" font-size="14" font-weight="800">AUDITED SURFACE</text>
  <g class="s" font-size="15">
    <text x="656" y="406">A full route-by-route audit consolidated the app —</text>
    <text x="656" y="430">one computation per metric, no duplicate pages,</text>
    <text x="656" y="454">every route accounted for.</text>
  </g>

  <rect x="64" y="482" width="1152" height="56" rx="10" fill="#0c1322" stroke="#26405a" stroke-width="1.5"/>
  <text x="88" y="516" class="s" font-size="15">Optional server modes: an <tspan class="t mono" font-weight="700">MCP server</tspan> for tool integration, module flags per licence — off means <tspan class="t" font-weight="700">absent</tspan>, not hidden.</text>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">If the SOC loses the internet, ION doesn't notice — that is the design constraint everything else obeys.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">12 / 13</text>
</svg>

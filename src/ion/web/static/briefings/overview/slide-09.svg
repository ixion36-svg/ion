<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .pane{fill:#0c1322;stroke:#26405a;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">TRAFFIC &amp; THREAT SURFACE</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">Seeing the network, not just the alerts</text>
  <text x="64" y="142" class="s" font-size="17">The estate's traffic, packet captures, and the vulnerabilities that actually get exploited.</text>

  <!-- packet stream motif top-right -->
  <g opacity="0.7">
    <g fill="#1f2b40"><rect x="960" y="70" width="26" height="10" rx="2"/><rect x="1000" y="70" width="40" height="10" rx="2"/><rect x="1054" y="70" width="18" height="10" rx="2"/><rect x="1086" y="70" width="34" height="10" rx="2"/></g>
    <g fill="#34d3ee"><rect x="1134" y="70" width="26" height="10" rx="2"/></g>
    <g fill="#1f2b40"><rect x="980" y="88" width="34" height="10" rx="2"/><rect x="1028" y="88" width="22" height="10" rx="2"/><rect x="1064" y="88" width="42" height="10" rx="2"/><rect x="1120" y="88" width="20" height="10" rx="2"/></g>
  </g>

  <rect class="pane" x="64" y="188" width="560" height="164" rx="12"/>
  <text x="88" y="222" class="c" font-size="14" font-weight="800">TRAFFIC ANALYTICS</text>
  <g class="s" font-size="15">
    <text x="88" y="252">Geo and protocol views with the noise removable —</text>
    <text x="88" y="276">IP/subnet exclusions, period-over-period trends,</text>
    <text x="88" y="300">an <tspan class="t" font-weight="700">AI traffic review</tspan> that narrates what changed,</text>
    <text x="88" y="324">and a network threat-correlation report.</text>
  </g>

  <rect class="pane" x="656" y="188" width="560" height="164" rx="12"/>
  <text x="680" y="222" class="c" font-size="14" font-weight="800">REALTIME IOC MONITOR</text>
  <g class="s" font-size="15">
    <text x="680" y="252">Watchlisted indicators matched against live traffic</text>
    <text x="680" y="276">as it arrives — a hit surfaces immediately rather</text>
    <text x="680" y="300">than at the next scheduled hunt, with the session</text>
    <text x="680" y="324">evidence one click away in Arkime.</text>
  </g>

  <rect class="pane" x="64" y="372" width="560" height="164" rx="12"/>
  <text x="88" y="406" class="c" font-size="14" font-weight="800">PCAP ANALYZERS</text>
  <g class="s" font-size="15">
    <text x="88" y="436">Uploaded or captured PCAPs are decomposed —</text>
    <text x="88" y="460">protocols, conversations, extracted indicators —</text>
    <text x="88" y="484">and internal-network captures get their own</text>
    <text x="88" y="508">analyzers. Arkime hits can auto-open a case.</text>
  </g>

  <rect class="pane" x="656" y="372" width="560" height="164" rx="12"/>
  <text x="680" y="406" class="c" font-size="14" font-weight="800">KEV — KNOWN EXPLOITED VULNS</text>
  <g class="s" font-size="15">
    <text x="680" y="436">The CISA KEV catalogue, snapshotted for air-gap and</text>
    <text x="680" y="460">browsable in detail — due dates, ransomware use,</text>
    <text x="680" y="484">affected products — so patch priority arguments</text>
    <text x="680" y="508">happen over the actual list, offline.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">All of it works disconnected — snapshots and local capture, no live feeds required.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">09 / 13</text>
</svg>

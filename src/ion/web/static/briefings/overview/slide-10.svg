<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif">
  <defs><style>
    .t{fill:#f1f5f9}.c{fill:#34d3ee}.s{fill:#93a4bd}.mono{font-family:'JetBrains Mono','Consolas',monospace}
    .stop{fill:#0f1828;stroke:#2b4a66;stroke-width:1.5}
  </style></defs>
  <rect width="1280" height="720" fill="#0a0e1a"/>
  <text x="64" y="58" class="c" font-size="14" font-weight="700" letter-spacing="3">RUNNING THE ROOM</text>
  <text x="62" y="104" class="t" font-size="40" font-weight="800">The SOC day, in the portal</text>
  <text x="64" y="142" class="s" font-size="17">The work around the work — standups, schedules, requests and training — lives where the cases do.</text>

  <!-- day timeline -->
  <line x1="90" y1="250" x2="1190" y2="250" stroke="#1f2b40" stroke-width="3"/>
  <g fill="#34d3ee">
    <circle cx="160" cy="250" r="7"/><circle cx="440" cy="250" r="7"/><circle cx="720" cy="250" r="7"/><circle cx="1000" cy="250" r="7"/>
  </g>
  <g>
    <text x="160" y="222" text-anchor="middle" class="t" font-size="15" font-weight="700">09:00 · Standup</text>
    <text x="160" y="286" text-anchor="middle" class="s" font-size="13">daily deck, generated</text>
    <text x="440" y="222" text-anchor="middle" class="t" font-size="15" font-weight="700">My Day / Team Day</text>
    <text x="440" y="286" text-anchor="middle" class="s" font-size="13">who's on what, live</text>
    <text x="720" y="222" text-anchor="middle" class="t" font-size="15" font-weight="700">Shift handover</text>
    <text x="720" y="286" text-anchor="middle" class="s" font-size="13">team schedule + notes</text>
    <text x="1000" y="222" text-anchor="middle" class="t" font-size="15" font-weight="700">Quiet hour</text>
    <text x="1000" y="286" text-anchor="middle" class="s" font-size="13">labs &amp; courses</text>
  </g>

  <rect class="stop" x="64" y="330" width="365" height="196" rx="12"/>
  <text x="88" y="364" class="c" font-size="14" font-weight="800">SERVICE DESK &amp; CHANGE</text>
  <g class="s" font-size="14.5">
    <text x="88" y="394">Bug reports flow to <tspan class="t" font-weight="700">GitLab</tspan> from</text>
    <text x="88" y="416">the page they happened on;</text>
    <text x="88" y="438">version upgrades go through</text>
    <text x="88" y="460"><tspan class="t" font-weight="700">CAB change requests</tspan> with an</text>
    <text x="88" y="482">approval trail.</text>
  </g>

  <rect class="stop" x="457" y="330" width="365" height="196" rx="12"/>
  <text x="481" y="364" class="c" font-size="14" font-weight="800">TRAINING, IN CONTEXT</text>
  <g class="s" font-size="14.5">
    <text x="481" y="394"><tspan class="t" font-weight="700">Courses</tspan> with scored scenarios,</text>
    <text x="481" y="416">a <tspan class="t" font-weight="700">cyber range</tspan> and lab sessions,</text>
    <text x="481" y="438">and <tspan class="t" font-weight="700">/soc-roles</tspan> — what every seat</text>
    <text x="481" y="460">on the SOC actually does, from</text>
    <text x="481" y="482">L1 triage to detection engineer.</text>
  </g>

  <rect class="stop" x="850" y="330" width="366" height="196" rx="12"/>
  <text x="874" y="364" class="c" font-size="14" font-weight="800">THE MORNING BRIEFING</text>
  <g class="s" font-size="14.5">
    <text x="874" y="394">Overnight cases, alert volumes,</text>
    <text x="874" y="416">threat landscape and standing</text>
    <text x="874" y="438">risks in one generated read —</text>
    <text x="874" y="460">with slides for the room and</text>
    <text x="874" y="482">an export for the inbox.</text>
  </g>

  <rect x="64" y="566" width="1152" height="50" rx="10" fill="#0d233a" stroke="#34d3ee" stroke-width="1.3"/>
  <text x="640" y="597" text-anchor="middle" class="c" font-size="15.5" font-weight="700">Fewer tabs, fewer tools — the coordination overhead lives next to the evidence.</text>

  <text x="64" y="688" class="s" font-size="13" font-weight="600"><tspan fill="#f1f5f9">ION</tspan> · Full Overview</text>
  <text x="1216" y="688" class="s mono" font-size="13" text-anchor="end">10 / 13</text>
</svg>

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ion"
version = "0.41.0"
description = "Intelligent Operating Network - Security Operations Portal for Guarded Glass"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Guarded Glass Team"}
]
dependencies = [
    "typer[all]>=0.9.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    # v0.31.25: fastapi 0.136.3 excluded — MAL-2026-4750 (PyPI malware
    # advisory, confirmed via OSV). The 0.136.3 wheel ships modified
    # pyproject.toml and PKG-INFO that add an undocumented optional dep
    # on `fastar>=0.9.0` (a typo-squat package). ION doesn't use the
    # [standard] extra, so the typo-squat never installs in practice,
    # but the compromised release should not be in our supply chain.
    # 0.136.3 is the only affected version per OSV; <0.136.3 floors
    # us at 0.136.1 (the version pre-incident).
    # v0.33.0: floor raised to 0.136.1 — this version drops the starlette
    # upper-cap (requires starlette>=0.46.0 only) allowing starlette 1.0.1+
    # to be installed, closing PYSEC-2026-161 (Host-header URL reconstruction).
    "fastapi>=0.136.1,<0.136.3",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.27",  # CVE-2026-40347/42561: multipart DoS
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",
    # v0.31.8: migrated from python-jose[cryptography] to PyJWT[crypto].
    # python-jose pulled a transitive `ecdsa` dep with CVE-2024-23342
    # (Minerva timing attack on P-256). ION only validates RS256 tokens
    # via Keycloak so the vulnerable code was not reachable, but the
    # transitive dep kept appearing in scanner output. PyJWT has the
    # same JWT semantics for our usage (decode + verify exp/iat/aud/iss)
    # and pulls only `cryptography` (no ecdsa).
    "PyJWT[crypto]>=2.12.0",  # PYSEC-2026-120: crit header bypass
    "httpx>=0.25.0",
    "aiosmtplib>=3.0.0",
    "email-validator>=2.0.0",
    "ldap3>=2.9",
    # PII anonymisation field config
    "pyyaml>=6.0",
    "croniter>=2.0.0",
    "slowapi>=0.1.9",
    "ecs-logging>=2.0.0",
    "python-json-logger>=2.0.0",
    # System monitoring
    "psutil>=5.9.0",
    # PCAP parsing
    "dpkt>=1.9.8",
    # PostgreSQL support
    "psycopg2-binary>=2.9.0",
    # v0.10.4: pgvector SQLAlchemy types for case-similarity embeddings.
    "pgvector>=0.3.0",
    # PDF generation
    "weasyprint>=62.0",
    # Fast JSON serialisation (5-10x faster than stdlib json)
    "orjson>=3.9.0",
    # Used by seed scripts (seed_*.py) that call the ION API via HTTP
    "requests>=2.33.0",  # CVE-2026-25645
    # Email validation (pydantic EmailStr field)
    "email-validator>=2.0.0",
    # v0.17.0: PDF text extraction for the Translator (~200 KB pure-Python)
    "pypdf>=4.0",
    # v0.19.9: PowerPoint export of the daily SOC standup
    "python-pptx>=0.6.21",
    # v0.33.0: Security floor pins — explicitly constrain transitive deps to
    # patched versions. pip-audit v0.32.1 found 26 CVEs in 15 packages;
    # these pins close the 12 ION-reachable findings.
    "cryptography>=46.0.7",    # PYSEC-2026-35/36: DNS constraint bypass + buffer overflow
    "starlette>=1.0.1",        # PYSEC-2026-161: Host-header URL reconstruction (fastapi>=0.136.1 required)
    "urllib3>=2.7.0",          # PYSEC-2026-141/142
    "idna>=3.15",              # CVE-2026-45409
    "lxml>=6.1.0",             # PYSEC-2026-87 (WeasyPrint dep)
    "Pillow>=12.2.0",          # CVE-2026-40192 + 4 others (WeasyPrint dep)
    "pyasn1>=0.6.3",           # CVE-2026-30922: recursion bomb DoS via crafted ASN.1
    "pygments>=2.20.0",        # CVE-2026-4539: ReDoS in AdlLexer (local access)
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176: /tmp race (Unix)
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
ion = "ion.cli.main:app"
ion-web = "ion.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ion = ["web/static/**/*", "web/templates/**/*", "data/**/*.md", "data/**/*.yaml", "data/**/*.json"]

[tool.ruff]
# v0.22.0 set 100→120 to match the codebase. v0.26.0 widens to 200:
# the 120 cap was producing 366 E501 violations across operational
# code, mostly long string literals in analyst-facing dict entries
# (pattern_detection_service, maturity_service, admin_api). Re-flowing
# those lines would hurt readability without adding signal. 200 lets
# the genuinely pathological lines (long SQL strings, base64 test
# payloads) still get flagged.
line-length = 200
target-version = "py311"

# Content-heavy data/seed modules — long single-line dict entries are intentional.
[tool.ruff.lint.per-file-ignores]
"src/ion/data/kb_*.py" = ["E501"]
"src/ion/services/cyab_subprofile_catalogue.py" = ["E501"]
"src/ion/services/cyab_assessment_questions.py" = ["E501"]
"src/ion/services/soc_template_service.py" = ["E501"]
"src/ion/services/training_sim_service.py" = ["E501"]
"src/ion/services/forensic_seed_service.py" = ["E501"]
"src/ion/services/cyber_range_service.py" = ["E501"]
"src/ion/services/soc_maturity_seed.py" = ["E501"]
# v0.26.0: seed_courses.py and seed_lab_fixtures.py are content-heavy data
# modules at the repo root; long lines in markdown blocks are intentional.
"seed_courses.py" = ["E501"]
"seed_lab_fixtures.py" = ["E501"]
# v0.26.0: SQLAlchemy ORM forward-string-references trip F821 because ruff
# doesn't model the registry-time resolution of `Mapped["ForeignClass"]`.
# All 13 hits are in model files. Ignoring F821 in these files keeps the
# rule active everywhere else where it WOULD catch a real undefined-name bug.
"src/ion/models/*.py" = ["F821"]
# v0.26.0: model package __init__.py re-exports for the SQLAlchemy
# registry. The imports are intentionally unused at the module level
# but get registered into Base.metadata at import-time, which is the
# whole point. F401 fires on every re-export; ignore for the file.
"src/ion/models/__init__.py" = ["F401"]
# v0.26.0: optional-dependency availability checks. The imports are
# wrapped in try/except ImportError and stored in a `_HAS_X` flag.
"src/ion/core/logging.py" = ["F401"]
"src/ion/plugins/formats/docx_plugin.py" = ["F401"]
"src/ion/services/playbook_executors/active_directory_ldap.py" = ["F401"]
# v0.26.0: content-heavy data modules. Long string literals in dict
# entries (>200 chars) are intentional analyst-facing copy.
"src/ion/services/maturity_service.py" = ["E501"]
"src/ion/services/execution_report_service.py" = ["E501"]
"src/ion/services/pattern_detection_service.py" = ["E501"]
"src/ion/services/role_skills_service.py" = ["E501"]
"src/ion/services/playbook_action_service.py" = ["E501"]
"src/ion/web/ai_api.py" = ["E501"]
"src/ion/storage/forensic_repository.py" = ["F821", "E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
# v0.26.0: codebase-wide ignores reflect deliberate style choices the
# codebase exercises across many files. Documented rule-by-rule so a
# future reviewer can audit the rationale.
ignore = [
    # E402 — module-import-not-at-top-of-file. Deferred imports are a
    # deliberate pattern for circular-dependency mitigation (many
    # services import ion.web.api lazily) and Python-version-gated
    # imports (typing differences across 3.11/3.12). 66 instances.
    "E402",
    # E501 — line-too-long. We keep this enabled GLOBALLY so genuinely
    # unwieldy lines still get flagged, but the per-file ignores above
    # cover content-heavy data/seed modules where long markdown / SQL
    # / dict literals are intentional.
    # (No global ignore — kept for visibility on operational code.)
    # E712 — `x == True` / `x == False`. SQLAlchemy filter callers
    # cannot use `is True` against ColumnElement (it returns a boolean
    # rather than producing the SQL "= TRUE" predicate). 27 instances,
    # all SQLAlchemy filters or filter-like contexts.
    "E712",
    # E741 — ambiguous-variable-name (`l`, `I`, `O`). Acceptable in
    # tight loop scopes and per-iteration accumulators where the
    # alternative names (`lesson`, `index`, `out`) shadow outer scope
    # or feel ceremony-heavy. 32 instances.
    "E741",
    # N806 — non-lowercase-variable-in-function. SQL-aliased values
    # (`UserID`), Pydantic model bindings, and TLS/JA3 fingerprint
    # mutables follow upstream naming conventions. 34 instances.
    "N806",
    # F841 — unused-variable. Many are intentional loop trackers,
    # deconstruction placeholders, or `_unused = ...` patterns where
    # the read is for side-effects. 31 instances. Where a F841 is a
    # real bug it should be fixed and removed from the ignore list.
    "F841",
    # N811 — constant-imported-as-non-constant. Almost all are the
    # `from weasyprint import HTML as _WeasyHTML` pattern in PDF
    # render endpoints, where the import is renamed to avoid
    # colliding with a local `html` variable. 7 instances.
    "N811",
    # E711 — comparison to None. SQLAlchemy filter contexts can't
    # use `is None` against ColumnElement; same dialect-binding
    # reasoning as E712. 2 instances.
    "E711",
    # E731 — lambda-assignment. Some are intentional one-line
    # SQLAlchemy `default=lambda: ...` factories; we keep this
    # globally ignored rather than chase the two instances.
    "E731",
    # E701 — multiple-statements-on-one-line-colon. Tight `if cond: x = y`
    # forms used as table-driven dispatches; replacing them with
    # multi-line ifs hurts readability for the 4 instances. Globally
    # ignored.
    "E701",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

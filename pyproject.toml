[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ion"
version = "0.19.0-rc.1"
description = "Intelligent Operating Network - Security Operations Portal for Guarded Glass"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Guarded Glass Team"}
]
dependencies = [
    "typer[all]>=0.9.0",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-docx>=1.1",
    "markdown>=3.5",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.25.0",
    "aiosmtplib>=3.0.0",
    "email-validator>=2.0.0",
    "ldap3>=2.9",
    # PII anonymisation field config
    "pyyaml>=6.0",
    "croniter>=2.0.0",
    "slowapi>=0.1.9",
    "ecs-logging>=2.0.0",
    "python-json-logger>=2.0.0",
    # System monitoring
    "psutil>=5.9.0",
    # PCAP parsing
    "dpkt>=1.9.8",
    # PostgreSQL support
    "psycopg2-binary>=2.9.0",
    # v0.10.4: pgvector SQLAlchemy types for case-similarity embeddings.
    "pgvector>=0.3.0",
    # PDF generation
    "weasyprint>=62.0",
    # Fast JSON serialisation (5-10x faster than stdlib json)
    "orjson>=3.9.0",
    # Used by seed scripts (seed_*.py) that call the ION API via HTTP
    "requests>=2.31.0",
    # Email validation (pydantic EmailStr field)
    "email-validator>=2.0.0",
    # v0.17.0: PDF text extraction for the Translator (~200 KB pure-Python)
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
ion = "ion.cli.main:app"
ion-web = "ion.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ion = ["web/static/**/*", "web/templates/**/*", "data/**/*.md", "data/**/*.yaml"]

[tool.ruff]
# Practical limit reflecting actual codebase style; was 100 but >7k lines exceeded.
# Lines beyond 120 are rare and usually long URLs / SQL strings worth flagging.
line-length = 120
target-version = "py311"

# Content-heavy data/seed modules — long single-line dict entries are intentional.
[tool.ruff.lint.per-file-ignores]
"src/ion/data/kb_*.py" = ["E501"]
"src/ion/services/cyab_subprofile_catalogue.py" = ["E501"]
"src/ion/services/cyab_assessment_questions.py" = ["E501"]
"src/ion/services/soc_template_service.py" = ["E501"]
"src/ion/services/training_sim_service.py" = ["E501"]
"src/ion/services/forensic_seed_service.py" = ["E501"]
"src/ion/services/cyber_range_service.py" = ["E501"]
"src/ion/services/soc_maturity_seed.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
